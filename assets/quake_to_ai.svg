<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550">
  <defs>
    <linearGradient id="quakeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="100%" style="stop-color:#c0392b"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#51cf66"/>
      <stop offset="100%" style="stop-color:#27ae60"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="100%" style="stop-color:#51cf66"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="550" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="bold">
    Quake Physics → AI Navigation
  </text>
  <text x="450" y="68" text-anchor="middle" fill="#888888" font-family="Arial, sans-serif" font-size="14">
    7 physics exploits from competitive gaming applied to spatial attention
  </text>

  <!-- Quake Column Header -->
  <rect x="50" y="95" width="350" height="40" rx="8" fill="url(#quakeGrad)"/>
  <text x="225" y="122" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
    🎮 QUAKE PHYSICS
  </text>

  <!-- AI Column Header -->
  <rect x="500" y="95" width="350" height="40" rx="8" fill="url(#aiGrad)"/>
  <text x="675" y="122" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
    🧠 AI NAVIGATION
  </text>

  <!-- Arrow in middle -->
  <rect x="415" y="95" width="70" height="40" rx="8" fill="url(#arrowGrad)"/>
  <text x="450" y="122" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="bold">→</text>

  <!-- Row backgrounds -->
  <rect x="50" y="145" width="800" height="50" fill="#252540" rx="5"/>
  <rect x="50" y="205" width="800" height="50" fill="#1a1a2e"/>
  <rect x="50" y="265" width="800" height="50" fill="#252540" rx="5"/>
  <rect x="50" y="325" width="800" height="50" fill="#1a1a2e"/>
  <rect x="50" y="385" width="800" height="50" fill="#252540" rx="5"/>
  <rect x="50" y="445" width="800" height="50" fill="#1a1a2e"/>

  <!-- Row 1: Warp Lanes -->
  <text x="70" y="177" fill="#ff6b6b" font-family="Arial, sans-serif" font-size="14" font-weight="bold">1. Warp Lanes (Teleporters)</text>
  <text x="520" y="177" fill="#51cf66" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Jump to distant high-similarity tokens</text>
  <text x="780" y="177" fill="#ffd43b" font-family="Arial, sans-serif" font-size="12">20-30%↑</text>

  <!-- Row 2: Shell Memory -->
  <text x="70" y="237" fill="#ff6b6b" font-family="Arial, sans-serif" font-size="14" font-weight="bold">2. Shell Memory (Spawn Points)</text>
  <text x="520" y="237" fill="#51cf66" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Organize tokens at optimal radii</text>
  <text x="780" y="237" fill="#ffd43b" font-family="Arial, sans-serif" font-size="12">10-15%↑</text>

  <!-- Row 3: LOD Hopping -->
  <text x="70" y="297" fill="#ff6b6b" font-family="Arial, sans-serif" font-size="14" font-weight="bold">3. LOD Hopping (Draw Distance)</text>
  <text x="520" y="297" fill="#51cf66" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Exploit fidelity cliffs at boundaries</text>
  <text x="780" y="297" fill="#ffd43b" font-family="Arial, sans-serif" font-size="12">15-20%↑</text>

  <!-- Row 4: Bunny Hop -->
  <text x="70" y="357" fill="#ff6b6b" font-family="Arial, sans-serif" font-size="14" font-weight="bold">4. Bunny Hop (Speed Chains)</text>
  <text x="520" y="357" fill="#51cf66" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Accumulate momentum for faster search</text>
  <text x="780" y="357" fill="#ffd43b" font-family="Arial, sans-serif" font-size="12">10-15%↑</text>

  <!-- Row 5: Circle Jump -->
  <text x="70" y="417" fill="#ff6b6b" font-family="Arial, sans-serif" font-size="14" font-weight="bold">5. Circle Jump (Movement Tech)</text>
  <text x="520" y="417" fill="#51cf66" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Broad-to-specific navigation pattern</text>
  <text x="780" y="417" fill="#888888" font-family="Arial, sans-serif" font-size="12">quality↑</text>

  <!-- Row 6: Temperature Surf + Attention Ratchet -->
  <text x="70" y="477" fill="#ff6b6b" font-family="Arial, sans-serif" font-size="14" font-weight="bold">6-7. Temp Surf + Attention Ratchet</text>
  <text x="520" y="477" fill="#51cf66" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Hot→cold annealing, directed warp graph</text>
  <text x="780" y="477" fill="#888888" font-family="Arial, sans-serif" font-size="12">explore↑</text>

  <!-- Result box -->
  <rect x="300" y="505" width="300" height="35" rx="17" fill="#51cf66" filter="url(#glow)"/>
  <text x="450" y="528" text-anchor="middle" fill="#1a1a2e" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
    RESULT: 10,317× FASTER
  </text>
</svg>
