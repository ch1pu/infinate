<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="mitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ee5a5a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="infGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#51cf66;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#40c057;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="bold">
    INFINATE vs MIT RLM: Latency Comparison
  </text>
  <text x="400" y="70" text-anchor="middle" fill="#888888" font-family="Arial, sans-serif" font-size="14">
    10 Million Tokens (BrowseComp+ Dataset)
  </text>

  <!-- Chart Area -->
  <rect x="100" y="100" width="600" height="300" fill="#252540" rx="10" filter="url(#shadow)"/>

  <!-- Y-Axis Labels -->
  <text x="90" y="150" text-anchor="end" fill="#888888" font-family="Arial, sans-serif" font-size="12">120,000ms</text>
  <text x="90" y="225" text-anchor="end" fill="#888888" font-family="Arial, sans-serif" font-size="12">60,000ms</text>
  <text x="90" y="300" text-anchor="end" fill="#888888" font-family="Arial, sans-serif" font-size="12">30,000ms</text>
  <text x="90" y="375" text-anchor="end" fill="#888888" font-family="Arial, sans-serif" font-size="12">0ms</text>

  <!-- Grid Lines -->
  <line x1="100" y1="150" x2="700" y2="150" stroke="#3a3a5a" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="100" y1="225" x2="700" y2="225" stroke="#3a3a5a" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="100" y1="300" x2="700" y2="300" stroke="#3a3a5a" stroke-width="1" stroke-dasharray="5,5"/>

  <!-- MIT RLM Bar -->
  <rect x="200" y="145" width="120" height="230" fill="url(#mitGrad)" rx="5" filter="url(#shadow)"/>
  <text x="260" y="130" text-anchor="middle" fill="#ff6b6b" font-family="Arial, sans-serif" font-size="16" font-weight="bold">120,000ms</text>
  <text x="260" y="420" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="14">MIT RLM</text>

  <!-- INFINATE Bar (tiny, need to show it's small) -->
  <rect x="480" y="373" width="120" height="2" fill="url(#infGrad)" rx="1"/>
  <text x="540" y="365" text-anchor="middle" fill="#51cf66" font-family="Arial, sans-serif" font-size="16" font-weight="bold">7.18ms</text>
  <text x="540" y="420" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="14">INFINATE</text>

  <!-- Speedup Callout -->
  <rect x="300" y="440" width="200" height="45" fill="#51cf66" rx="22" filter="url(#shadow)"/>
  <text x="400" y="470" text-anchor="middle" fill="#1a1a2e" font-family="Arial, sans-serif" font-size="20" font-weight="bold">
    10,317× FASTER
  </text>
</svg>