<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#51cf66"/>
      <stop offset="100%" style="stop-color:#37b24d"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4dabf7"/>
      <stop offset="100%" style="stop-color:#339af0"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#da77f2"/>
      <stop offset="100%" style="stop-color:#be4bdb"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffa94d"/>
      <stop offset="100%" style="stop-color:#fd7e14"/>
    </linearGradient>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="#0f0f1a"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="26" font-weight="bold">
    INFINATE System Architecture
  </text>
  <text x="450" y="65" text-anchor="middle" fill="#888888" font-family="Arial, sans-serif" font-size="14">
    O(k) Spatial Attention Engine
  </text>

  <!-- Query Input Box -->
  <rect x="350" y="90" width="200" height="50" rx="25" fill="url(#blueGrad)" filter="url(#boxShadow)"/>
  <text x="450" y="122" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
    Query Input
  </text>

  <!-- Arrow down -->
  <path d="M 450 140 L 450 170 L 440 160 M 450 170 L 460 160" stroke="#4dabf7" stroke-width="2" fill="none"/>

  <!-- Main Processing Box -->
  <rect x="150" y="180" width="600" height="280" rx="15" fill="#1a1a2e" stroke="#3a3a5a" stroke-width="2" filter="url(#boxShadow)"/>
  <text x="450" y="210" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
    INFINATE Engine
  </text>

  <!-- Spatial Attention Module -->
  <rect x="180" y="230" width="160" height="90" rx="10" fill="url(#greenGrad)" filter="url(#boxShadow)"/>
  <text x="260" y="260" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Spatial Attention</text>
  <text x="260" y="280" text-anchor="middle" fill="#e8f5e9" font-family="Arial, sans-serif" font-size="11">O(k) Complexity</text>
  <text x="260" y="300" text-anchor="middle" fill="#e8f5e9" font-family="Arial, sans-serif" font-size="11">M1.3 ✓</text>

  <!-- LOD Module -->
  <rect x="370" y="230" width="160" height="90" rx="10" fill="url(#purpleGrad)" filter="url(#boxShadow)"/>
  <text x="450" y="260" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Hierarchical LOD</text>
  <text x="450" y="280" text-anchor="middle" fill="#f3e5f5" font-family="Arial, sans-serif" font-size="11">9.7× Context Expansion</text>
  <text x="450" y="300" text-anchor="middle" fill="#f3e5f5" font-family="Arial, sans-serif" font-size="11">M1.10 ✓</text>

  <!-- Navigation Module -->
  <rect x="560" y="230" width="160" height="90" rx="10" fill="url(#orangeGrad)" filter="url(#boxShadow)"/>
  <text x="640" y="260" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Strafe Navigation</text>
  <text x="640" y="280" text-anchor="middle" fill="#fff3e0" font-family="Arial, sans-serif" font-size="11">7 Physics Exploits</text>
  <text x="640" y="300" text-anchor="middle" fill="#fff3e0" font-family="Arial, sans-serif" font-size="11">M1.11 ✓</text>

  <!-- Arrows between modules -->
  <path d="M 340 275 L 370 275" stroke="#ffffff" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 530 275 L 560 275" stroke="#ffffff" stroke-width="2" fill="none"/>

  <!-- Vector Store -->
  <rect x="280" y="350" width="340" height="80" rx="10" fill="url(#blueGrad)" filter="url(#boxShadow)"/>
  <text x="450" y="380" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Vector Store Layer</text>
  <text x="350" y="410" text-anchor="middle" fill="#e3f2fd" font-family="Arial, sans-serif" font-size="12">Qdrant</text>
  <text x="450" y="410" text-anchor="middle" fill="#e3f2fd" font-family="Arial, sans-serif" font-size="12">|</text>
  <text x="550" y="410" text-anchor="middle" fill="#e3f2fd" font-family="Arial, sans-serif" font-size="12">pgvector</text>

  <!-- Arrow to vector store -->
  <path d="M 450 320 L 450 350" stroke="#ffffff" stroke-width="2" fill="none"/>

  <!-- Output Box -->
  <rect x="325" y="490" width="250" height="60" rx="10" fill="url(#greenGrad)" filter="url(#boxShadow)"/>
  <text x="450" y="517" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Result: 7.18ms</text>
  <text x="450" y="537" text-anchor="middle" fill="#e8f5e9" font-family="Arial, sans-serif" font-size="12">10,317× faster than MIT RLM</text>

  <!-- Arrow to output -->
  <path d="M 450 460 L 450 490" stroke="#51cf66" stroke-width="2" fill="none"/>

  <!-- Side Stats -->
  <rect x="770" y="180" width="110" height="280" rx="10" fill="#1a1a2e" stroke="#51cf66" stroke-width="2"/>
  <text x="825" y="210" text-anchor="middle" fill="#51cf66" font-family="Arial, sans-serif" font-size="12" font-weight="bold">STATS</text>

  <text x="825" y="245" text-anchor="middle" fill="#888888" font-family="Arial, sans-serif" font-size="10">Tests</text>
  <text x="825" y="265" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="bold">369</text>

  <text x="825" y="300" text-anchor="middle" fill="#888888" font-family="Arial, sans-serif" font-size="10">Coverage</text>
  <text x="825" y="320" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="bold">89.6%</text>

  <text x="825" y="355" text-anchor="middle" fill="#888888" font-family="Arial, sans-serif" font-size="10">Memory</text>
  <text x="825" y="375" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="bold">1.5MB</text>

  <text x="825" y="410" text-anchor="middle" fill="#888888" font-family="Arial, sans-serif" font-size="10">Progress</text>
  <text x="825" y="430" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="bold">60%</text>

  <!-- Decorative elements -->
  <circle cx="50" cy="100" r="30" fill="#51cf66" opacity="0.1"/>
  <circle cx="850" cy="550" r="40" fill="#4dabf7" opacity="0.1"/>
</svg>