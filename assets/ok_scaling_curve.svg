<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="22" font-weight="bold">
    O(k) vs O(n²) Scaling: Time vs Context Size
  </text>

  <!-- Chart Area -->
  <rect x="80" y="70" width="650" height="350" fill="#252540" rx="8"/>

  <!-- Axes -->
  <line x1="120" y1="380" x2="700" y2="380" stroke="#555580" stroke-width="2"/>
  <line x1="120" y1="380" x2="120" y2="100" stroke="#555580" stroke-width="2"/>

  <!-- X-Axis Labels -->
  <text x="120" y="405" text-anchor="middle" fill="#888888" font-family="Arial, sans-serif" font-size="11">1K</text>
  <text x="240" y="405" text-anchor="middle" fill="#888888" font-family="Arial, sans-serif" font-size="11">8K</text>
  <text x="360" y="405" text-anchor="middle" fill="#888888" font-family="Arial, sans-serif" font-size="11">32K</text>
  <text x="480" y="405" text-anchor="middle" fill="#888888" font-family="Arial, sans-serif" font-size="11">64K</text>
  <text x="600" y="405" text-anchor="middle" fill="#888888" font-family="Arial, sans-serif" font-size="11">128K</text>
  <text x="700" y="405" text-anchor="middle" fill="#888888" font-family="Arial, sans-serif" font-size="11">1M</text>
  <text x="400" y="435" text-anchor="middle" fill="#aaaaaa" font-family="Arial, sans-serif" font-size="13">Context Size (tokens)</text>

  <!-- Y-Axis Labels -->
  <text x="110" y="380" text-anchor="end" fill="#888888" font-family="Arial, sans-serif" font-size="11">0</text>
  <text x="110" y="310" text-anchor="end" fill="#888888" font-family="Arial, sans-serif" font-size="11">1K×</text>
  <text x="110" y="240" text-anchor="end" fill="#888888" font-family="Arial, sans-serif" font-size="11">4K×</text>
  <text x="110" y="170" text-anchor="end" fill="#888888" font-family="Arial, sans-serif" font-size="11">16K×</text>
  <text x="110" y="110" text-anchor="end" fill="#888888" font-family="Arial, sans-serif" font-size="11">64K×</text>
  <text x="50" y="240" text-anchor="middle" fill="#aaaaaa" font-family="Arial, sans-serif" font-size="13" transform="rotate(-90, 50, 240)">Time Scaling Factor</text>

  <!-- O(n²) Curve - Exponential growth -->
  <path d="M 120 375 Q 200 370, 280 350 Q 360 310, 440 240 Q 520 150, 600 110 L 700 90"
        fill="none" stroke="#ff6b6b" stroke-width="3" filter="url(#glow)"/>

  <!-- O(k) Line - Nearly flat -->
  <path d="M 120 370 L 240 368 L 360 366 L 480 365 L 600 364 L 700 363"
        fill="none" stroke="#51cf66" stroke-width="3" filter="url(#glow)"/>

  <!-- Data Points O(n²) -->
  <circle cx="120" cy="375" r="5" fill="#ff6b6b"/>
  <circle cx="240" cy="360" r="5" fill="#ff6b6b"/>
  <circle cx="360" cy="320" r="5" fill="#ff6b6b"/>
  <circle cx="480" cy="240" r="5" fill="#ff6b6b"/>
  <circle cx="600" cy="130" r="5" fill="#ff6b6b"/>

  <!-- Data Points O(k) -->
  <circle cx="120" cy="370" r="5" fill="#51cf66"/>
  <circle cx="240" cy="368" r="5" fill="#51cf66"/>
  <circle cx="360" cy="366" r="5" fill="#51cf66"/>
  <circle cx="480" cy="365" r="5" fill="#51cf66"/>
  <circle cx="600" cy="364" r="5" fill="#51cf66"/>

  <!-- Legend -->
  <rect x="520" y="80" width="170" height="70" fill="#1a1a2e" rx="5" stroke="#3a3a5a"/>
  <line x1="535" y1="105" x2="565" y2="105" stroke="#ff6b6b" stroke-width="3"/>
  <text x="575" y="110" fill="#ff6b6b" font-family="Arial, sans-serif" font-size="13">O(n²) Traditional</text>
  <line x1="535" y1="130" x2="565" y2="130" stroke="#51cf66" stroke-width="3"/>
  <text x="575" y="135" fill="#51cf66" font-family="Arial, sans-serif" font-size="13">O(k) INFINATE</text>

  <!-- Annotation -->
  <rect x="180" y="180" width="200" height="60" fill="#51cf66" rx="8" opacity="0.9"/>
  <text x="280" y="205" text-anchor="middle" fill="#1a1a2e" font-family="Arial, sans-serif" font-size="13" font-weight="bold">128× more tokens</text>
  <text x="280" y="225" text-anchor="middle" fill="#1a1a2e" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Only 1.12× more time</text>

  <!-- Arrow pointing to gap -->
  <path d="M 550 200 L 600 250" stroke="#ffffff" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="520" y="190" fill="#ffffff" font-family="Arial, sans-serif" font-size="12">The gap grows</text>
  <text x="520" y="205" fill="#ffffff" font-family="Arial, sans-serif" font-size="12">exponentially!</text>
</svg>