<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650">
  <defs>
    <linearGradient id="bgIntegrationConcept" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eff6ff"/>
      <stop offset="100%" style="stop-color:#e0e7ff"/>
    </linearGradient>
    <filter id="shadowIC" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrowBlueIC" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#3b82f6"/>
    </marker>
    <marker id="arrowGreenIC" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#22c55e"/>
    </marker>
    <marker id="arrowRedIC" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#ef4444"/>
    </marker>
    <marker id="arrowPurpleIC" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#8b5cf6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1000" height="650" fill="url(#bgIntegrationConcept)"/>

  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" font-family="Arial" font-size="24" fill="#1e40af" font-weight="bold">Integration Testing: End-to-End O(k) Verification</text>
  <text x="500" y="58" text-anchor="middle" font-family="Arial" font-size="14" fill="#3b82f6">M1.7 - TransformerBridge connects SpatialTransformer to Vector Store</text>

  <!-- TOP SECTION: The Problem -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="450" height="200" rx="12" fill="white" filter="url(#shadowIC)"/>
    <rect x="0" y="0" width="450" height="35" rx="12" fill="#ef4444"/>
    <rect x="0" y="22" width="450" height="13" fill="#ef4444"/>
    <text x="225" y="24" text-anchor="middle" font-family="Arial" font-size="14" fill="white" font-weight="bold">The Problem: Separate Systems</text>

    <!-- Traditional flow -->
    <g transform="translate(25, 55)">
      <rect x="0" y="0" width="90" height="45" rx="6" fill="#fecaca"/>
      <text x="45" y="18" text-anchor="middle" font-family="Arial" font-size="10" fill="#991b1b" font-weight="bold">Transformer</text>
      <text x="45" y="35" text-anchor="middle" font-family="Arial" font-size="9" fill="#991b1b">(M1.4)</text>

      <line x1="95" y1="22" x2="140" y2="22" stroke="#ef4444" stroke-width="2"/>
      <text x="118" y="15" text-anchor="middle" font-family="Arial" font-size="8" fill="#991b1b">?</text>

      <rect x="145" y="0" width="90" height="45" rx="6" fill="#fecaca"/>
      <text x="190" y="18" text-anchor="middle" font-family="Arial" font-size="10" fill="#991b1b" font-weight="bold">Vector Store</text>
      <text x="190" y="35" text-anchor="middle" font-family="Arial" font-size="9" fill="#991b1b">(M1.6)</text>

      <line x1="240" y1="22" x2="285" y2="22" stroke="#ef4444" stroke-width="2"/>
      <text x="263" y="15" text-anchor="middle" font-family="Arial" font-size="8" fill="#991b1b">?</text>

      <rect x="290" y="0" width="90" height="45" rx="6" fill="#fecaca"/>
      <text x="335" y="18" text-anchor="middle" font-family="Arial" font-size="10" fill="#991b1b" font-weight="bold">Application</text>
      <text x="335" y="35" text-anchor="middle" font-family="Arial" font-size="9" fill="#991b1b">(External)</text>
    </g>

    <!-- Problems list -->
    <g transform="translate(30, 120)">
      <text x="0" y="0" font-family="Arial" font-size="11" fill="#991b1b">✗ Components work but not together</text>
      <text x="0" y="20" font-family="Arial" font-size="11" fill="#991b1b">✗ No end-to-end O(k) verification</text>
      <text x="0" y="40" font-family="Arial" font-size="11" fill="#991b1b">✗ Missing integration layer</text>
      <text x="220" y="0" font-family="Arial" font-size="11" fill="#991b1b">✗ External orchestration required</text>
      <text x="220" y="20" font-family="Arial" font-size="11" fill="#991b1b">✗ Manual context assembly</text>
      <text x="220" y="40" font-family="Arial" font-size="11" fill="#991b1b">✗ No unified API</text>
    </g>
  </g>

  <!-- TOP SECTION: The Solution -->
  <g transform="translate(520, 80)">
    <rect x="0" y="0" width="450" height="200" rx="12" fill="white" filter="url(#shadowIC)"/>
    <rect x="0" y="0" width="450" height="35" rx="12" fill="#22c55e"/>
    <rect x="0" y="22" width="450" height="13" fill="#22c55e"/>
    <text x="225" y="24" text-anchor="middle" font-family="Arial" font-size="14" fill="white" font-weight="bold">The Solution: TransformerBridge</text>

    <!-- Solution flow -->
    <g transform="translate(30, 50)">
      <!-- Bridge wraps everything -->
      <rect x="0" y="0" width="390" height="80" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" stroke-dasharray="5,3"/>
      <text x="195" y="-5" text-anchor="middle" font-family="Arial" font-size="10" fill="#166534" font-weight="bold">TransformerBridge</text>

      <rect x="15" y="15" width="110" height="50" rx="6" fill="#dcfce7"/>
      <text x="70" y="35" text-anchor="middle" font-family="Arial" font-size="10" fill="#166534" font-weight="bold">Transformer</text>
      <text x="70" y="50" text-anchor="middle" font-family="Arial" font-size="9" fill="#166534">(wrapped)</text>

      <line x1="130" y1="40" x2="155" y2="40" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreenIC)"/>

      <rect x="160" y="15" width="110" height="50" rx="6" fill="#dcfce7"/>
      <text x="215" y="35" text-anchor="middle" font-family="Arial" font-size="10" fill="#166534" font-weight="bold">ContextManager</text>
      <text x="215" y="50" text-anchor="middle" font-family="Arial" font-size="9" fill="#166534">(LRU cache)</text>

      <line x1="275" y1="40" x2="300" y2="40" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreenIC)"/>

      <rect x="305" y="15" width="70" height="50" rx="6" fill="#dcfce7"/>
      <text x="340" y="35" text-anchor="middle" font-family="Arial" font-size="10" fill="#166534" font-weight="bold">VectorStore</text>
      <text x="340" y="50" text-anchor="middle" font-family="Arial" font-size="9" fill="#166534">(k-NN)</text>
    </g>

    <!-- Benefits list -->
    <g transform="translate(30, 145)">
      <text x="0" y="0" font-family="Arial" font-size="11" fill="#166534">✓ Single API: bridge(x, positions)</text>
      <text x="0" y="18" font-family="Arial" font-size="11" fill="#166534">✓ O(k) verified end-to-end</text>
      <text x="0" y="36" font-family="Arial" font-size="11" fill="#166534">✓ Composition (no core mods)</text>
      <text x="210" y="0" font-family="Arial" font-size="11" fill="#166534">✓ LRU caching for speed</text>
      <text x="210" y="18" font-family="Arial" font-size="11" fill="#166534">✓ Works with Qdrant + pgvector</text>
      <text x="210" y="36" font-family="Arial" font-size="11" fill="#166534">✓ Memory bounded</text>
    </g>
  </g>

  <!-- MIDDLE SECTION: O(k) Verification -->
  <g transform="translate(30, 300)">
    <rect x="0" y="0" width="600" height="180" rx="12" fill="white" filter="url(#shadowIC)"/>
    <rect x="0" y="0" width="600" height="35" rx="12" fill="#8b5cf6"/>
    <rect x="0" y="22" width="600" height="13" fill="#8b5cf6"/>
    <text x="300" y="24" text-anchor="middle" font-family="Arial" font-size="14" fill="white" font-weight="bold">O(k) Complexity Verified End-to-End</text>

    <!-- Complexity proof -->
    <g transform="translate(30, 50)">
      <text x="0" y="0" font-family="monospace" font-size="12" fill="#1e293b">Context 1000: 11.82ms</text>
      <text x="0" y="22" font-family="monospace" font-size="12" fill="#1e293b">Context 2000: 12.96ms</text>
      <text x="180" y="22" font-family="Arial" font-size="12" fill="#8b5cf6" font-weight="bold">(ratio: 1.10×)</text>
      <text x="0" y="44" font-family="monospace" font-size="12" fill="#1e293b">Context 4000: 12.61ms</text>
      <text x="180" y="44" font-family="Arial" font-size="12" fill="#8b5cf6" font-weight="bold">(ratio: 1.07×)</text>
    </g>

    <!-- Expected vs Actual -->
    <g transform="translate(350, 50)">
      <rect x="0" y="0" width="220" height="110" rx="8" fill="#f3e8ff"/>
      <text x="110" y="20" text-anchor="middle" font-family="Arial" font-size="11" fill="#7c3aed" font-weight="bold">Expected Ratios</text>
      <line x1="10" y1="30" x2="210" y2="30" stroke="#c4b5fd" stroke-width="1"/>
      <text x="20" y="50" font-family="Arial" font-size="11" fill="#7c3aed">O(n) would be:</text>
      <text x="140" y="50" font-family="monospace" font-size="11" fill="#ef4444" font-weight="bold">2.0×</text>
      <text x="20" y="70" font-family="Arial" font-size="11" fill="#7c3aed">O(n²) would be:</text>
      <text x="140" y="70" font-family="monospace" font-size="11" fill="#ef4444" font-weight="bold">4.0×</text>
      <text x="20" y="95" font-family="Arial" font-size="11" fill="#7c3aed">O(k) actual:</text>
      <text x="140" y="95" font-family="monospace" font-size="11" fill="#22c55e" font-weight="bold">~1.1×</text>
    </g>

    <!-- Conclusion -->
    <g transform="translate(30, 130)">
      <rect x="0" y="0" width="540" height="35" rx="6" fill="#dcfce7"/>
      <text x="270" y="23" text-anchor="middle" font-family="Arial" font-size="13" fill="#166534" font-weight="bold">✓ O(k) VERIFIED: 2×context = 1.10× time (not 2.0×), 4×context = 1.07× time (not 4.0×)</text>
    </g>
  </g>

  <!-- MIDDLE RIGHT: Performance Stats -->
  <g transform="translate(660, 300)">
    <rect x="0" y="0" width="310" height="180" rx="12" fill="white" filter="url(#shadowIC)"/>
    <text x="155" y="25" text-anchor="middle" font-family="Arial" font-size="14" fill="#1e40af" font-weight="bold">Performance Results</text>

    <g transform="translate(20, 45)">
      <rect x="0" y="0" width="130" height="50" rx="6" fill="#dcfce7"/>
      <text x="65" y="20" text-anchor="middle" font-family="Arial" font-size="10" fill="#166534">Qdrant Latency</text>
      <text x="65" y="40" text-anchor="middle" font-family="Arial" font-size="16" fill="#166534" font-weight="bold">13.91ms</text>
    </g>

    <g transform="translate(160, 45)">
      <rect x="0" y="0" width="130" height="50" rx="6" fill="#dbeafe"/>
      <text x="65" y="20" text-anchor="middle" font-family="Arial" font-size="10" fill="#1e40af">pgvector Latency</text>
      <text x="65" y="40" text-anchor="middle" font-family="Arial" font-size="16" fill="#1e40af" font-weight="bold">25.85ms</text>
    </g>

    <g transform="translate(20, 105)">
      <rect x="0" y="0" width="130" height="50" rx="6" fill="#fef3c7"/>
      <text x="65" y="20" text-anchor="middle" font-family="Arial" font-size="10" fill="#b45309">Throughput</text>
      <text x="65" y="40" text-anchor="middle" font-family="Arial" font-size="14" fill="#b45309" font-weight="bold">12,161 tok/s</text>
    </g>

    <g transform="translate(160, 105)">
      <rect x="0" y="0" width="130" height="50" rx="6" fill="#f3e8ff"/>
      <text x="65" y="20" text-anchor="middle" font-family="Arial" font-size="10" fill="#7c3aed">Memory</text>
      <text x="65" y="40" text-anchor="middle" font-family="Arial" font-size="14" fill="#7c3aed" font-weight="bold">CONSTANT</text>
    </g>
  </g>

  <!-- BOTTOM SECTION: Key Insight -->
  <g transform="translate(30, 500)">
    <rect x="0" y="0" width="940" height="130" rx="12" fill="#1e40af" filter="url(#shadowIC)"/>
    <text x="470" y="30" text-anchor="middle" font-family="Arial" font-size="18" fill="white" font-weight="bold">THE KEY INSIGHT</text>

    <line x1="50" y1="45" x2="890" y2="45" stroke="#60a5fa" stroke-width="1"/>

    <text x="470" y="70" text-anchor="middle" font-family="Arial" font-size="14" fill="#93c5fd">TransformerBridge = Composition, Not Modification</text>
    <text x="470" y="95" text-anchor="middle" font-family="Arial" font-size="12" fill="#bfdbfe">The bridge wraps existing components without changing them.</text>
    <text x="470" y="115" text-anchor="middle" font-family="Arial" font-size="12" fill="#bfdbfe">M1.3 + M1.4 + M1.6 now work together with a single forward() call.</text>
  </g>
</svg>
