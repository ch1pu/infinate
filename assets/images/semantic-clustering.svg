<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320">
  <defs>
    <linearGradient id="bgMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="320" fill="url(#bgMain)"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial" font-size="16" fill="#334155" font-weight="bold">Semantic Clustering: Similar Concepts Live Together</text>

  <!-- Python/ML Cluster (Blue) -->
  <g transform="translate(80, 80)">
    <ellipse cx="100" cy="80" rx="120" ry="90" fill="#3b82f6" opacity="0.1" filter="url(#shadow)"/>
    <text x="100" y="20" text-anchor="middle" font-family="Arial" font-size="12" fill="#1d4ed8" font-weight="bold">Python / ML</text>

    <circle cx="60" cy="60" r="28" fill="#3b82f6" filter="url(#shadow)"/>
    <text x="60" y="65" text-anchor="middle" font-family="Arial" font-size="10" fill="white" font-weight="bold">Python</text>

    <circle cx="140" cy="55" r="28" fill="#3b82f6" filter="url(#shadow)"/>
    <text x="140" y="60" text-anchor="middle" font-family="Arial" font-size="10" fill="white" font-weight="bold">PyTorch</text>

    <circle cx="50" cy="115" r="25" fill="#60a5fa" filter="url(#shadow)"/>
    <text x="50" y="120" text-anchor="middle" font-family="Arial" font-size="9" fill="white" font-weight="bold">NumPy</text>

    <circle cx="110" cy="125" r="28" fill="#60a5fa" filter="url(#shadow)"/>
    <text x="110" y="120" text-anchor="middle" font-family="Arial" font-size="8" fill="white" font-weight="bold">TensorFlow</text>

    <circle cx="160" cy="110" r="22" fill="#93c5fd" filter="url(#shadow)"/>
    <text x="160" y="115" text-anchor="middle" font-family="Arial" font-size="8" fill="#1e40af" font-weight="bold">Keras</text>
  </g>

  <!-- JavaScript Cluster (Yellow/Orange) -->
  <g transform="translate(350, 70)">
    <ellipse cx="100" cy="80" rx="110" ry="85" fill="#f59e0b" opacity="0.1" filter="url(#shadow)"/>
    <text x="100" y="15" text-anchor="middle" font-family="Arial" font-size="12" fill="#b45309" font-weight="bold">JavaScript / Web</text>

    <circle cx="100" cy="55" r="30" fill="#f59e0b" filter="url(#shadow)"/>
    <text x="100" y="52" text-anchor="middle" font-family="Arial" font-size="8" fill="white" font-weight="bold">JavaScript</text>

    <circle cx="50" cy="95" r="25" fill="#fbbf24" filter="url(#shadow)"/>
    <text x="50" y="100" text-anchor="middle" font-family="Arial" font-size="9" fill="#78350f" font-weight="bold">React</text>

    <circle cx="150" cy="95" r="25" fill="#fbbf24" filter="url(#shadow)"/>
    <text x="150" y="100" text-anchor="middle" font-family="Arial" font-size="9" fill="#78350f" font-weight="bold">Vue</text>

    <circle cx="100" cy="130" r="22" fill="#fcd34d" filter="url(#shadow)"/>
    <text x="100" y="135" text-anchor="middle" font-family="Arial" font-size="8" fill="#78350f" font-weight="bold">Node.js</text>
  </g>

  <!-- Database Cluster (Green) -->
  <g transform="translate(620, 80)">
    <ellipse cx="90" cy="75" rx="105" ry="80" fill="#10b981" opacity="0.1" filter="url(#shadow)"/>
    <text x="90" y="15" text-anchor="middle" font-family="Arial" font-size="12" fill="#065f46" font-weight="bold">Databases</text>

    <circle cx="90" cy="55" r="28" fill="#10b981" filter="url(#shadow)"/>
    <text x="90" y="52" text-anchor="middle" font-family="Arial" font-size="8" fill="white" font-weight="bold">PostgreSQL</text>

    <circle cx="40" cy="100" r="24" fill="#34d399" filter="url(#shadow)"/>
    <text x="40" y="105" text-anchor="middle" font-family="Arial" font-size="8" fill="#065f46" font-weight="bold">MySQL</text>

    <circle cx="140" cy="100" r="24" fill="#34d399" filter="url(#shadow)"/>
    <text x="140" y="105" text-anchor="middle" font-family="Arial" font-size="8" fill="#065f46" font-weight="bold">Redis</text>

    <circle cx="90" cy="130" r="22" fill="#6ee7b7" filter="url(#shadow)"/>
    <text x="90" y="135" text-anchor="middle" font-family="Arial" font-size="8" fill="#065f46" font-weight="bold">MongoDB</text>
  </g>

  <!-- Distance indicators -->
  <g transform="translate(0, 0)">
    <!-- Close distance (within cluster) -->
    <line x1="140" y1="140" x2="190" y2="135" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="165" y="155" text-anchor="middle" font-family="Arial" font-size="9" fill="#3b82f6">close</text>

    <!-- Far distance (between clusters) -->
    <line x1="280" y1="150" x2="370" y2="150" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="325" y="170" text-anchor="middle" font-family="Arial" font-size="9" fill="#64748b">far apart</text>
  </g>

  <!-- Legend -->
  <g transform="translate(280, 250)">
    <rect x="0" y="0" width="340" height="55" rx="8" fill="white" filter="url(#shadow)"/>
    <text x="170" y="20" text-anchor="middle" font-family="Arial" font-size="11" fill="#334155" font-weight="bold">Key Insight</text>
    <text x="170" y="38" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">Similar topics cluster together automatically.</text>
    <text x="170" y="52" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">Query "PyTorch" → finds Python/ML neighbors, ignores cooking recipes.</text>
  </g>
</svg>