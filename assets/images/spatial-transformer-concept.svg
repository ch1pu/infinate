<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520">
  <defs>
    <linearGradient id="bgTrans" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eff6ff"/>
      <stop offset="100%" style="stop-color:#e0e7ff"/>
    </linearGradient>
    <filter id="shadowTrans" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrowDown" markerWidth="10" markerHeight="10" refX="5" refY="10" orient="auto">
      <polygon points="0,0 10,0 5,10" fill="#6366f1"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="520" fill="url(#bgTrans)"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial" font-size="20" fill="#1e40af" font-weight="bold">Spatial Transformer: Complete O(k) Architecture</text>
  <text x="450" y="50" text-anchor="middle" font-family="Arial" font-size="12" fill="#3b82f6">Stacking transformer blocks while maintaining constant complexity</text>

  <!-- Left side: Single Block Architecture -->
  <g transform="translate(30, 75)">
    <rect x="0" y="0" width="340" height="420" rx="12" fill="white" filter="url(#shadowTrans)"/>
    <rect x="0" y="0" width="340" height="35" rx="12" fill="#6366f1"/>
    <rect x="0" y="22" width="340" height="13" fill="#6366f1"/>
    <text x="170" y="24" text-anchor="middle" font-family="Arial" font-size="12" fill="white" font-weight="bold">SpatialTransformerBlock (Single Layer)</text>

    <!-- Input -->
    <g transform="translate(70, 55)">
      <rect x="0" y="0" width="200" height="35" rx="6" fill="#dbeafe"/>
      <text x="100" y="15" text-anchor="middle" font-family="Arial" font-size="10" fill="#1e40af" font-weight="bold">Input: x + positions</text>
      <text x="100" y="28" text-anchor="middle" font-family="monospace" font-size="8" fill="#3b82f6">[batch, seq, 768] + [batch, seq, 3]</text>
    </g>

    <!-- Arrow -->
    <line x1="170" y1="95" x2="170" y2="115" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowDown)"/>

    <!-- Spatial Attention -->
    <g transform="translate(45, 125)">
      <rect x="0" y="0" width="250" height="55" rx="8" fill="#22c55e" filter="url(#shadowTrans)"/>
      <text x="125" y="20" text-anchor="middle" font-family="Arial" font-size="11" fill="white" font-weight="bold">Spatial Attention (M1.3)</text>
      <text x="125" y="35" text-anchor="middle" font-family="Arial" font-size="9" fill="#dcfce7">O(k) complexity - only k neighbors</text>
      <text x="125" y="48" text-anchor="middle" font-family="monospace" font-size="8" fill="#bbf7d0">Q·K^T × spatial_mask → softmax</text>
    </g>

    <!-- Residual + Norm 1 -->
    <g transform="translate(45, 190)">
      <rect x="0" y="0" width="250" height="35" rx="6" fill="#fef3c7"/>
      <text x="125" y="15" text-anchor="middle" font-family="Arial" font-size="10" fill="#b45309" font-weight="bold">+ Residual → LayerNorm</text>
      <text x="125" y="28" text-anchor="middle" font-family="monospace" font-size="8" fill="#d97706">x = norm1(x + dropout(attn))</text>
    </g>

    <!-- Arrow -->
    <line x1="170" y1="230" x2="170" y2="250" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowDown)"/>

    <!-- Feed Forward -->
    <g transform="translate(45, 260)">
      <rect x="0" y="0" width="250" height="55" rx="8" fill="#8b5cf6" filter="url(#shadowTrans)"/>
      <text x="125" y="20" text-anchor="middle" font-family="Arial" font-size="11" fill="white" font-weight="bold">Feed-Forward Network</text>
      <text x="125" y="35" text-anchor="middle" font-family="Arial" font-size="9" fill="#e9d5ff">2-layer MLP with GELU</text>
      <text x="125" y="48" text-anchor="middle" font-family="monospace" font-size="8" fill="#d8b4fe">768 → 3072 → 768</text>
    </g>

    <!-- Residual + Norm 2 -->
    <g transform="translate(45, 325)">
      <rect x="0" y="0" width="250" height="35" rx="6" fill="#fef3c7"/>
      <text x="125" y="15" text-anchor="middle" font-family="Arial" font-size="10" fill="#b45309" font-weight="bold">+ Residual → LayerNorm</text>
      <text x="125" y="28" text-anchor="middle" font-family="monospace" font-size="8" fill="#d97706">x = norm2(x + dropout(ffn))</text>
    </g>

    <!-- Arrow -->
    <line x1="170" y1="365" x2="170" y2="385" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowDown)"/>

    <!-- Output -->
    <g transform="translate(70, 390)">
      <rect x="0" y="0" width="200" height="25" rx="6" fill="#dbeafe"/>
      <text x="100" y="17" text-anchor="middle" font-family="Arial" font-size="10" fill="#1e40af" font-weight="bold">Output: [batch, seq, 768]</text>
    </g>
  </g>

  <!-- Right side: Stacked Architecture -->
  <g transform="translate(400, 75)">
    <rect x="0" y="0" width="470" height="420" rx="12" fill="white" filter="url(#shadowTrans)"/>
    <rect x="0" y="0" width="470" height="35" rx="12" fill="#1e40af"/>
    <rect x="0" y="22" width="470" height="13" fill="#1e40af"/>
    <text x="235" y="24" text-anchor="middle" font-family="Arial" font-size="12" fill="white" font-weight="bold">SpatialTransformer (Multi-Layer Stack)</text>

    <!-- Input -->
    <g transform="translate(160, 50)">
      <rect x="0" y="0" width="150" height="30" rx="6" fill="#dbeafe"/>
      <text x="75" y="19" text-anchor="middle" font-family="Arial" font-size="10" fill="#1e40af" font-weight="bold">Input Embeddings</text>
    </g>

    <!-- Arrow -->
    <line x1="235" y1="85" x2="235" y2="100" stroke="#1e40af" stroke-width="2" marker-end="url(#arrowDown)"/>

    <!-- Layer 1 -->
    <g transform="translate(135, 110)">
      <rect x="0" y="0" width="200" height="40" rx="6" fill="#6366f1"/>
      <text x="100" y="17" text-anchor="middle" font-family="Arial" font-size="10" fill="white" font-weight="bold">Layer 1</text>
      <text x="100" y="32" text-anchor="middle" font-family="Arial" font-size="8" fill="#c7d2fe">SpatialTransformerBlock</text>
    </g>

    <!-- Arrow -->
    <line x1="235" y1="155" x2="235" y2="170" stroke="#1e40af" stroke-width="2" marker-end="url(#arrowDown)"/>

    <!-- Layer 2 -->
    <g transform="translate(135, 175)">
      <rect x="0" y="0" width="200" height="40" rx="6" fill="#6366f1"/>
      <text x="100" y="17" text-anchor="middle" font-family="Arial" font-size="10" fill="white" font-weight="bold">Layer 2</text>
      <text x="100" y="32" text-anchor="middle" font-family="Arial" font-size="8" fill="#c7d2fe">SpatialTransformerBlock</text>
    </g>

    <!-- Dots -->
    <text x="235" y="235" text-anchor="middle" font-family="Arial" font-size="16" fill="#6366f1">⋮</text>

    <!-- Layer N -->
    <g transform="translate(135, 250)">
      <rect x="0" y="0" width="200" height="40" rx="6" fill="#6366f1"/>
      <text x="100" y="17" text-anchor="middle" font-family="Arial" font-size="10" fill="white" font-weight="bold">Layer N (default: 6)</text>
      <text x="100" y="32" text-anchor="middle" font-family="Arial" font-size="8" fill="#c7d2fe">SpatialTransformerBlock</text>
    </g>

    <!-- Arrow -->
    <line x1="235" y1="295" x2="235" y2="310" stroke="#1e40af" stroke-width="2" marker-end="url(#arrowDown)"/>

    <!-- Output -->
    <g transform="translate(160, 315)">
      <rect x="0" y="0" width="150" height="30" rx="6" fill="#dcfce7"/>
      <text x="75" y="19" text-anchor="middle" font-family="Arial" font-size="10" fill="#166534" font-weight="bold">Output Embeddings</text>
    </g>

    <!-- Features box -->
    <g transform="translate(20, 360)">
      <rect x="0" y="0" width="200" height="50" rx="6" fill="#f3e8ff"/>
      <text x="100" y="15" text-anchor="middle" font-family="Arial" font-size="9" fill="#7c3aed" font-weight="bold">Features:</text>
      <text x="10" y="30" font-family="Arial" font-size="8" fill="#6b21a8">• Gradient checkpointing</text>
      <text x="10" y="42" font-family="Arial" font-size="8" fill="#6b21a8">• Configurable depth (3-12+)</text>
    </g>

    <!-- O(k) box -->
    <g transform="translate(250, 360)">
      <rect x="0" y="0" width="200" height="50" rx="6" fill="#dcfce7"/>
      <text x="100" y="15" text-anchor="middle" font-family="Arial" font-size="9" fill="#166534" font-weight="bold">O(k) Maintained:</text>
      <text x="10" y="30" font-family="Arial" font-size="8" fill="#15803d">• 2x seq → 2.52x time</text>
      <text x="10" y="42" font-family="Arial" font-size="8" fill="#15803d">• (Not 4x like O(n²)!)</text>
    </g>
  </g>

  <!-- Bottom: Integration summary -->
  <g transform="translate(30, 505)">
    <rect x="0" y="0" width="840" height="40" rx="8" fill="#1e40af" opacity="0.1"/>
    <text x="420" y="15" text-anchor="middle" font-family="Arial" font-size="11" fill="#1e40af" font-weight="bold">Full Integration: M1.1 (SpatialToken) + M1.2 (Encoding) + M1.3 (Attention) + M1.4 (Transformer)</text>
    <text x="420" y="32" text-anchor="middle" font-family="Arial" font-size="10" fill="#3b82f6">Complete O(k) transformer architecture ready for infinite context AI</text>
  </g>
</svg>
