<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="800" height="500" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">The Emergent Semantic Map</text>
  <text x="400" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Position encodes meaning in 3D semantic space</text>

  <!-- 3D Coordinate System (isometric view) -->
  <g transform="translate(400, 320)">
    <!-- Origin point -->
    <circle cx="0" cy="0" r="4" fill="#334155"/>

    <!-- X-axis (going right-down) - Semantic Category -->
    <line x1="0" y1="0" x2="200" y2="80" stroke="#3b82f6" stroke-width="3"/>
    <polygon points="200,80 185,75 190,90" fill="#3b82f6"/>
    <text x="220" y="95" font-family="Arial" font-size="13" fill="#1d4ed8" font-weight="bold">X: Category</text>
    <text x="220" y="110" font-family="Arial" font-size="10" fill="#3b82f6">Frontend ↔ Backend</text>

    <!-- Y-axis (going up) - Recency -->
    <line x1="0" y1="0" x2="0" y2="-200" stroke="#10b981" stroke-width="3"/>
    <polygon points="0,-200 -8,-185 8,-185" fill="#10b981"/>
    <text x="10" y="-205" font-family="Arial" font-size="13" fill="#065f46" font-weight="bold">Y: Recency</text>
    <text x="10" y="-190" font-family="Arial" font-size="10" fill="#10b981">Recent ↑ Archived ↓</text>

    <!-- Z-axis (going left-down) - Abstraction Level -->
    <line x1="0" y1="0" x2="-180" y2="70" stroke="#8b5cf6" stroke-width="3"/>
    <polygon points="-180,70 -165,75 -170,55" fill="#8b5cf6"/>
    <text x="-270" y="90" font-family="Arial" font-size="13" fill="#6b21a8" font-weight="bold">Z: Abstraction</text>
    <text x="-270" y="105" font-family="Arial" font-size="10" fill="#8b5cf6">Interface ↔ Implementation</text>

    <!-- Grid lines (faint) -->
    <g opacity="0.15" stroke="#64748b" stroke-width="1">
      <!-- Horizontal planes -->
      <line x1="-150" y1="55" x2="50" y2="55"/>
      <line x1="-150" y1="55" x2="-100" y2="80"/>
      <line x1="50" y1="55" x2="100" y2="80"/>

      <line x1="-150" y1="-50" x2="50" y2="-50"/>
      <line x1="-150" y1="-50" x2="-100" y2="-25"/>
      <line x1="50" y1="-50" x2="100" y2="-25"/>

      <line x1="-150" y1="-150" x2="50" y2="-150"/>
      <line x1="-150" y1="-150" x2="-100" y2="-125"/>
      <line x1="50" y1="-150" x2="100" y2="-125"/>
    </g>

    <!-- Data Points in 3D Space -->

    <!-- Recent Auth Changes (high Y, mid X, mid Z) -->
    <g transform="translate(20, -170)">
      <ellipse cx="0" cy="0" rx="55" ry="28" fill="#f59e0b" opacity="0.2"/>
      <rect x="-45" y="-18" width="90" height="36" rx="8" fill="#f59e0b" filter="url(#shadow)"/>
      <text x="0" y="-3" text-anchor="middle" font-family="Arial" font-size="10" fill="white" font-weight="bold">Recent Auth</text>
      <text x="0" y="10" text-anchor="middle" font-family="Arial" font-size="9" fill="white">Changes</text>
    </g>

    <!-- Frontend UI (low X, mid Y) -->
    <g transform="translate(-100, -80)">
      <ellipse cx="0" cy="0" rx="50" ry="25" fill="#3b82f6" opacity="0.2"/>
      <rect x="-40" y="-15" width="80" height="30" rx="8" fill="#3b82f6" filter="url(#shadow)"/>
      <text x="0" y="3" text-anchor="middle" font-family="Arial" font-size="11" fill="white" font-weight="bold">Frontend UI</text>
    </g>

    <!-- Backend API (high X, mid Y) -->
    <g transform="translate(100, -60)">
      <ellipse cx="0" cy="0" rx="55" ry="25" fill="#10b981" opacity="0.2"/>
      <rect x="-45" y="-15" width="90" height="30" rx="8" fill="#10b981" filter="url(#shadow)"/>
      <text x="0" y="3" text-anchor="middle" font-family="Arial" font-size="11" fill="white" font-weight="bold">Backend API</text>
    </g>

    <!-- Old CSS (low X, low Y, high Z abstraction) -->
    <g transform="translate(-130, 30)">
      <ellipse cx="0" cy="0" rx="40" ry="20" fill="#94a3b8" opacity="0.2"/>
      <rect x="-35" y="-12" width="70" height="24" rx="6" fill="#94a3b8" filter="url(#shadow)"/>
      <text x="0" y="3" text-anchor="middle" font-family="Arial" font-size="10" fill="white" font-weight="bold">Old CSS</text>
    </g>

    <!-- Legacy Database (high X, low Y) -->
    <g transform="translate(120, 45)">
      <ellipse cx="0" cy="0" rx="55" ry="22" fill="#94a3b8" opacity="0.2"/>
      <rect x="-50" y="-14" width="100" height="28" rx="6" fill="#94a3b8" filter="url(#shadow)"/>
      <text x="0" y="3" text-anchor="middle" font-family="Arial" font-size="10" fill="white" font-weight="bold">Legacy Database</text>
    </g>

    <!-- Middleware (center, mid everything) -->
    <g transform="translate(10, -40)">
      <ellipse cx="0" cy="0" rx="50" ry="22" fill="#8b5cf6" opacity="0.2"/>
      <rect x="-45" y="-14" width="90" height="28" rx="6" fill="#8b5cf6" filter="url(#shadow)"/>
      <text x="0" y="3" text-anchor="middle" font-family="Arial" font-size="10" fill="white" font-weight="bold">Middleware</text>
    </g>

  </g>

  <!-- Legend Box -->
  <g transform="translate(30, 400)">
    <rect x="0" y="0" width="740" height="80" rx="10" fill="white" filter="url(#shadow)"/>

    <text x="20" y="25" font-family="Arial" font-size="12" fill="#334155" font-weight="bold">Key Insight:</text>
    <text x="20" y="45" font-family="Arial" font-size="11" fill="#64748b">Similar code naturally clusters together. Authentication logic groups with security.</text>
    <text x="20" y="62" font-family="Arial" font-size="11" fill="#64748b">Error handlers form neighborhoods. The map emerges from semantics - not manual organization.</text>

    <!-- Color legend -->
    <g transform="translate(550, 15)">
      <circle cx="0" cy="0" r="8" fill="#f59e0b"/>
      <text x="15" y="4" font-family="Arial" font-size="10" fill="#64748b">Recent/Active</text>

      <circle cx="0" cy="22" r="8" fill="#3b82f6"/>
      <text x="15" y="26" font-family="Arial" font-size="10" fill="#64748b">Frontend</text>

      <circle cx="90" cy="0" r="8" fill="#10b981"/>
      <text x="105" y="4" font-family="Arial" font-size="10" fill="#64748b">Backend</text>

      <circle cx="90" cy="22" r="8" fill="#94a3b8"/>
      <text x="105" y="26" font-family="Arial" font-size="10" fill="#64748b">Archived</text>
    </g>
  </g>

</svg>
