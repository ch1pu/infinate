<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200">
  <defs>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe"/>
      <stop offset="100%" style="stop-color:#bfdbfe"/>
    </linearGradient>
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ede9fe"/>
      <stop offset="100%" style="stop-color:#ddd6fe"/>
    </linearGradient>
    <linearGradient id="gradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d1fae5"/>
      <stop offset="100%" style="stop-color:#a7f3d0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Step 1: Raw Text -->
  <g transform="translate(20, 50)">
    <rect x="0" y="0" width="140" height="100" rx="10" fill="url(#gradBlue)" filter="url(#shadow)"/>
    <text x="70" y="25" text-anchor="middle" font-family="Arial" font-size="11" fill="#1e40af" font-weight="bold">RAW TEXT</text>
    <text x="70" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1e3a8a">"Python loops</text>
    <text x="70" y="75" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1e3a8a">are useful"</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(170, 90)">
    <polygon points="0,10 25,0 25,7 50,7 50,13 25,13 25,20" fill="#6366f1"/>
  </g>

  <!-- Step 2: Embedding Model -->
  <g transform="translate(230, 50)">
    <rect x="0" y="0" width="140" height="100" rx="10" fill="url(#gradPurple)" filter="url(#shadow)"/>
    <text x="70" y="25" text-anchor="middle" font-family="Arial" font-size="11" fill="#6b21a8" font-weight="bold">EMBEDDING MODEL</text>
    <rect x="20" y="40" width="100" height="45" rx="5" fill="#7c3aed" opacity="0.2"/>
    <text x="70" y="58" text-anchor="middle" font-family="monospace" font-size="10" fill="#5b21b6">transformer</text>
    <text x="70" y="73" text-anchor="middle" font-family="monospace" font-size="10" fill="#5b21b6">encoder</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(380, 90)">
    <polygon points="0,10 25,0 25,7 50,7 50,13 25,13 25,20" fill="#6366f1"/>
  </g>

  <!-- Step 3: Vector -->
  <g transform="translate(440, 50)">
    <rect x="0" y="0" width="140" height="100" rx="10" fill="url(#gradPurple)" filter="url(#shadow)"/>
    <text x="70" y="25" text-anchor="middle" font-family="Arial" font-size="11" fill="#6b21a8" font-weight="bold">EMBEDDING VECTOR</text>
    <text x="70" y="50" text-anchor="middle" font-family="monospace" font-size="11" fill="#5b21b6">[0.23, 0.87,</text>
    <text x="70" y="65" text-anchor="middle" font-family="monospace" font-size="11" fill="#5b21b6">0.45, 0.12,</text>
    <text x="70" y="80" text-anchor="middle" font-family="monospace" font-size="11" fill="#5b21b6">... 768 dims]</text>
  </g>

  <!-- Arrow 3 -->
  <g transform="translate(590, 90)">
    <polygon points="0,10 25,0 25,7 50,7 50,13 25,13 25,20" fill="#6366f1"/>
  </g>

  <!-- Step 4: 3D Position -->
  <g transform="translate(650, 50)">
    <rect x="0" y="0" width="140" height="100" rx="10" fill="url(#gradGreen)" filter="url(#shadow)"/>
    <text x="70" y="25" text-anchor="middle" font-family="Arial" font-size="11" fill="#065f46" font-weight="bold">3D POSITION</text>

    <!-- Mini 3D coordinate system -->
    <g transform="translate(40, 45)">
      <!-- Axes -->
      <line x1="30" y1="45" x2="30" y2="15" stroke="#065f46" stroke-width="1.5"/>
      <line x1="30" y1="45" x2="60" y2="55" stroke="#065f46" stroke-width="1.5"/>
      <line x1="30" y1="45" x2="5" y2="55" stroke="#065f46" stroke-width="1.5"/>
      <!-- Labels -->
      <text x="30" y="10" text-anchor="middle" font-family="Arial" font-size="9" fill="#065f46">y</text>
      <text x="65" y="58" font-family="Arial" font-size="9" fill="#065f46">x</text>
      <text x="0" y="60" font-family="Arial" font-size="9" fill="#065f46">z</text>
      <!-- Point -->
      <circle cx="45" cy="30" r="6" fill="#10b981"/>
    </g>

    <text x="70" y="95" text-anchor="middle" font-family="monospace" font-size="10" fill="#065f46">(12, 45, 8)</text>
  </g>

  <!-- Bottom label -->
  <text x="450" y="185" text-anchor="middle" font-family="Arial" font-size="13" fill="#666">
    Text with similar meaning → Similar positions in space
  </text>
</svg>