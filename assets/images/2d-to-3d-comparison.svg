<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350">
  <defs>
    <linearGradient id="bgLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fee2e2"/>
      <stop offset="100%" style="stop-color:#fecaca"/>
    </linearGradient>
    <linearGradient id="bgRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d1fae5"/>
      <stop offset="100%" style="stop-color:#a7f3d0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Left Panel: Traditional 2D -->
  <rect x="20" y="20" width="400" height="310" rx="15" fill="url(#bgLeft)" filter="url(#shadow)"/>
  <text x="220" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#991b1b">Traditional: 2D Linear Sequence</text>

  <!-- 2D Token Chain -->
  <g transform="translate(50, 120)">
    <!-- Tokens in a line -->
    <rect x="0" y="0" width="45" height="45" rx="8" fill="#ef4444" opacity="0.8"/>
    <text x="22" y="28" text-anchor="middle" font-family="Arial" font-size="14" fill="white">T₁</text>

    <line x1="45" y1="22" x2="65" y2="22" stroke="#666" stroke-width="2"/>

    <rect x="65" y="0" width="45" height="45" rx="8" fill="#ef4444" opacity="0.8"/>
    <text x="87" y="28" text-anchor="middle" font-family="Arial" font-size="14" fill="white">T₂</text>

    <line x1="110" y1="22" x2="130" y2="22" stroke="#666" stroke-width="2"/>

    <rect x="130" y="0" width="45" height="45" rx="8" fill="#ef4444" opacity="0.8"/>
    <text x="152" y="28" text-anchor="middle" font-family="Arial" font-size="14" fill="white">T₃</text>

    <line x1="175" y1="22" x2="195" y2="22" stroke="#666" stroke-width="2"/>

    <text x="210" y="28" font-family="Arial" font-size="20" fill="#666">···</text>

    <line x1="235" y1="22" x2="255" y2="22" stroke="#666" stroke-width="2"/>

    <rect x="255" y="0" width="45" height="45" rx="8" fill="#ef4444" opacity="0.8"/>
    <text x="277" y="28" text-anchor="middle" font-family="Arial" font-size="14" fill="white">Tₙ</text>
  </g>

  <!-- Query with lines to ALL tokens -->
  <g transform="translate(50, 200)">
    <circle cx="170" cy="40" r="28" fill="#7c3aed" filter="url(#shadow)"/>
    <text x="170" y="46" text-anchor="middle" font-family="Arial" font-size="12" fill="white" font-weight="bold">Query</text>

    <!-- Dotted lines to all tokens (showing O(n²)) -->
    <line x1="145" y1="20" x2="22" y2="-55" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
    <line x1="155" y1="15" x2="87" y2="-55" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
    <line x1="170" y1="12" x2="152" y2="-55" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
    <line x1="185" y1="15" x2="277" y2="-55" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
  </g>

  <!-- Left Panel Labels -->
  <text x="220" y="290" text-anchor="middle" font-family="Arial" font-size="14" fill="#666">Must scan <tspan font-weight="bold" fill="#991b1b">ALL</tspan> tokens</text>
  <text x="220" y="315" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#991b1b">O(n²) = SLOW</text>

  <!-- Arrow between panels -->
  <g transform="translate(430, 160)">
    <polygon points="0,20 30,0 30,15 60,15 60,25 30,25 30,40" fill="#6366f1"/>
    <text x="30" y="60" text-anchor="middle" font-family="Arial" font-size="11" fill="#4f46e5" font-weight="bold">INFINATE</text>
  </g>

  <!-- Right Panel: INFINATE 3D -->
  <rect x="480" y="20" width="400" height="310" rx="15" fill="url(#bgRight)" filter="url(#shadow)"/>
  <text x="680" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#065f46">INFINATE: 3D Semantic Space</text>

  <!-- 3D Token Cloud -->
  <g transform="translate(520, 80)">
    <!-- Distant tokens (faded) -->
    <circle cx="30" cy="40" r="20" fill="#10b981" opacity="0.3"/>
    <text x="30" y="45" text-anchor="middle" font-family="Arial" font-size="12" fill="white">T</text>

    <circle cx="290" cy="30" r="20" fill="#10b981" opacity="0.3"/>
    <text x="290" y="35" text-anchor="middle" font-family="Arial" font-size="12" fill="white">T</text>

    <circle cx="50" cy="170" r="20" fill="#10b981" opacity="0.3"/>
    <text x="50" y="175" text-anchor="middle" font-family="Arial" font-size="12" fill="white">T</text>

    <circle cx="280" cy="180" r="20" fill="#10b981" opacity="0.3"/>
    <text x="280" y="185" text-anchor="middle" font-family="Arial" font-size="12" fill="white">T</text>

    <!-- Nearby tokens (bright) -->
    <circle cx="100" cy="80" r="22" fill="#10b981" opacity="0.9" filter="url(#shadow)"/>
    <text x="100" y="86" text-anchor="middle" font-family="Arial" font-size="13" fill="white" font-weight="bold">T</text>

    <circle cx="220" cy="70" r="22" fill="#10b981" opacity="0.9" filter="url(#shadow)"/>
    <text x="220" y="76" text-anchor="middle" font-family="Arial" font-size="13" fill="white" font-weight="bold">T</text>

    <circle cx="90" cy="150" r="22" fill="#10b981" opacity="0.9" filter="url(#shadow)"/>
    <text x="90" y="156" text-anchor="middle" font-family="Arial" font-size="13" fill="white" font-weight="bold">T</text>

    <circle cx="230" cy="155" r="22" fill="#10b981" opacity="0.9" filter="url(#shadow)"/>
    <text x="230" y="161" text-anchor="middle" font-family="Arial" font-size="13" fill="white" font-weight="bold">T</text>

    <!-- Query in center -->
    <circle cx="160" cy="115" r="32" fill="#7c3aed" filter="url(#shadow)"/>
    <text x="160" y="121" text-anchor="middle" font-family="Arial" font-size="13" fill="white" font-weight="bold">Query</text>

    <!-- Lines only to nearby tokens -->
    <line x1="135" y1="95" x2="115" y2="90" stroke="#7c3aed" stroke-width="3" opacity="0.8"/>
    <line x1="185" y1="95" x2="205" y2="82" stroke="#7c3aed" stroke-width="3" opacity="0.8"/>
    <line x1="140" y1="135" x2="108" y2="140" stroke="#7c3aed" stroke-width="3" opacity="0.8"/>
    <line x1="185" y1="135" x2="212" y2="145" stroke="#7c3aed" stroke-width="3" opacity="0.8"/>

    <!-- Radius indicator -->
    <circle cx="160" cy="115" r="70" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.5"/>
  </g>

  <!-- Right Panel Labels -->
  <text x="680" y="290" text-anchor="middle" font-family="Arial" font-size="14" fill="#666">Only check <tspan font-weight="bold" fill="#065f46">NEARBY</tspan> tokens</text>
  <text x="680" y="315" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#065f46">O(k) = FAST</text>
</svg>