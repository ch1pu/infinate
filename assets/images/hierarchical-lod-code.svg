<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 750">
  <defs>
    <linearGradient id="titleBarLOD" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#313244"/>
      <stop offset="100%" style="stop-color:#45475a"/>
    </linearGradient>
  </defs>

  <!-- Dark background -->
  <rect x="0" y="0" width="1100" height="750" fill="#1e1e2e"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="1100" height="40" fill="url(#titleBarLOD)"/>
  <circle cx="20" cy="20" r="7" fill="#f38ba8"/>
  <circle cx="42" cy="20" r="7" fill="#f9e2af"/>
  <circle cx="64" cy="20" r="7" fill="#a6e3a1"/>
  <text x="550" y="26" text-anchor="middle" font-family="monospace" font-size="13" fill="#cdd6f4">lod.py — HierarchicalLOD System (M1.10)</text>

  <!-- LEFT PANEL: Code -->
  <g transform="translate(20, 55)">
    <!-- LODLevel dataclass -->
    <text x="0" y="0" font-family="monospace" font-size="11" fill="#6c7086"># LOD level configuration</text>
    <text x="0" y="18" font-family="monospace" font-size="11" fill="#cba6f7">@dataclass</text>
    <text x="0" y="36" font-family="monospace" font-size="11"><tspan fill="#89b4fa">class </tspan><tspan fill="#f9e2af">LODLevel</tspan><tspan fill="#cdd6f4">:</tspan></text>
    <text x="0" y="54" font-family="monospace" font-size="11"><tspan fill="#cdd6f4">    </tspan><tspan fill="#f38ba8">name</tspan><tspan fill="#cdd6f4">: </tspan><tspan fill="#89b4fa">str</tspan></text>
    <text x="0" y="72" font-family="monospace" font-size="11"><tspan fill="#cdd6f4">    </tspan><tspan fill="#f38ba8">min_radius</tspan><tspan fill="#cdd6f4">: </tspan><tspan fill="#89b4fa">float</tspan></text>
    <text x="0" y="90" font-family="monospace" font-size="11"><tspan fill="#cdd6f4">    </tspan><tspan fill="#f38ba8">max_radius</tspan><tspan fill="#cdd6f4">: </tspan><tspan fill="#89b4fa">float</tspan></text>
    <text x="0" y="108" font-family="monospace" font-size="11"><tspan fill="#cdd6f4">    </tspan><tspan fill="#f38ba8">compression_ratio</tspan><tspan fill="#cdd6f4">: </tspan><tspan fill="#89b4fa">int</tspan></text>
    <text x="0" y="126" font-family="monospace" font-size="11"><tspan fill="#cdd6f4">    </tspan><tspan fill="#f38ba8">max_tokens</tspan><tspan fill="#cdd6f4">: </tspan><tspan fill="#89b4fa">int</tspan></text>

    <!-- Default config -->
    <text x="0" y="158" font-family="monospace" font-size="11" fill="#6c7086"># Default LOD configuration</text>
    <text x="0" y="176" font-family="monospace" font-size="11"><tspan fill="#f38ba8">DEFAULT_LOD_CONFIG</tspan><tspan fill="#cdd6f4"> = [</tspan></text>
    <text x="0" y="194" font-family="monospace" font-size="11"><tspan fill="#cdd6f4">    </tspan><tspan fill="#f9e2af">LODLevel</tspan><tspan fill="#cdd6f4">(</tspan><tspan fill="#a6e3a1">"near"</tspan><tspan fill="#cdd6f4">,   </tspan><tspan fill="#fab387">0</tspan><tspan fill="#cdd6f4">,   </tspan><tspan fill="#fab387">50</tspan><tspan fill="#cdd6f4">,  </tspan><tspan fill="#fab387">1</tspan><tspan fill="#cdd6f4">,   </tspan><tspan fill="#fab387">50</tspan><tspan fill="#cdd6f4">),</tspan></text>
    <text x="0" y="212" font-family="monospace" font-size="11"><tspan fill="#cdd6f4">    </tspan><tspan fill="#f9e2af">LODLevel</tspan><tspan fill="#cdd6f4">(</tspan><tspan fill="#a6e3a1">"medium"</tspan><tspan fill="#cdd6f4">, </tspan><tspan fill="#fab387">50</tspan><tspan fill="#cdd6f4">,  </tspan><tspan fill="#fab387">150</tspan><tspan fill="#cdd6f4">, </tspan><tspan fill="#fab387">5</tspan><tspan fill="#cdd6f4">,   </tspan><tspan fill="#fab387">25</tspan><tspan fill="#cdd6f4">),</tspan></text>
    <text x="0" y="230" font-family="monospace" font-size="11"><tspan fill="#cdd6f4">    </tspan><tspan fill="#f9e2af">LODLevel</tspan><tspan fill="#cdd6f4">(</tspan><tspan fill="#a6e3a1">"far"</tspan><tspan fill="#cdd6f4">,    </tspan><tspan fill="#fab387">150</tspan><tspan fill="#cdd6f4">, </tspan><tspan fill="#fab387">500</tspan><tspan fill="#cdd6f4">, </tspan><tspan fill="#fab387">20</tspan><tspan fill="#cdd6f4">,  </tspan><tspan fill="#fab387">10</tspan><tspan fill="#cdd6f4">),</tspan></text>
    <text x="0" y="248" font-family="monospace" font-size="11"><tspan fill="#cdd6f4">    </tspan><tspan fill="#f9e2af">LODLevel</tspan><tspan fill="#cdd6f4">(</tspan><tspan fill="#a6e3a1">"beyond"</tspan><tspan fill="#cdd6f4">, </tspan><tspan fill="#fab387">500</tspan><tspan fill="#cdd6f4">, </tspan><tspan fill="#fab387">inf</tspan><tspan fill="#cdd6f4">, </tspan><tspan fill="#fab387">100</tspan><tspan fill="#cdd6f4">, </tspan><tspan fill="#fab387">5</tspan><tspan fill="#cdd6f4">),</tspan></text>
    <text x="0" y="266" font-family="monospace" font-size="11" fill="#cdd6f4">]</text>

    <!-- HierarchicalLOD class -->
    <text x="0" y="298" font-family="monospace" font-size="11" fill="#6c7086"># Main LOD class</text>
    <text x="0" y="316" font-family="monospace" font-size="11"><tspan fill="#89b4fa">class </tspan><tspan fill="#f9e2af">HierarchicalLOD</tspan><tspan fill="#cdd6f4">:</tspan></text>

    <text x="0" y="342" font-family="monospace" font-size="11"><tspan fill="#cdd6f4">    </tspan><tspan fill="#89b4fa">def </tspan><tspan fill="#a6e3a1">assign_lod_levels</tspan><tspan fill="#cdd6f4">(</tspan><tspan fill="#f38ba8">self</tspan><tspan fill="#cdd6f4">, </tspan><tspan fill="#fab387">query_pos</tspan><tspan fill="#cdd6f4">, </tspan><tspan fill="#fab387">key_pos</tspan><tspan fill="#cdd6f4">):</tspan></text>
    <text x="0" y="360" font-family="monospace" font-size="11" fill="#6c7086">        # Compute distances, assign to levels</text>
    <text x="0" y="378" font-family="monospace" font-size="11"><tspan fill="#cdd6f4">        </tspan><tspan fill="#f38ba8">distances</tspan><tspan fill="#cdd6f4"> = </tspan><tspan fill="#fab387">torch</tspan><tspan fill="#cdd6f4">.</tspan><tspan fill="#a6e3a1">cdist</tspan><tspan fill="#cdd6f4">(</tspan><tspan fill="#fab387">query_pos</tspan><tspan fill="#cdd6f4">, </tspan><tspan fill="#fab387">key_pos</tspan><tspan fill="#cdd6f4">)</tspan></text>
    <text x="0" y="396" font-family="monospace" font-size="11"><tspan fill="#cdd6f4">        </tspan><tspan fill="#89b4fa">return </tspan><tspan fill="#cdd6f4">{</tspan><tspan fill="#fab387">lvl</tspan><tspan fill="#cdd6f4">.</tspan><tspan fill="#f38ba8">name</tspan><tspan fill="#cdd6f4">: </tspan><tspan fill="#fab387">mask</tspan><tspan fill="#cdd6f4"> </tspan><tspan fill="#89b4fa">for </tspan><tspan fill="#fab387">lvl</tspan><tspan fill="#cdd6f4">, </tspan><tspan fill="#fab387">mask</tspan><tspan fill="#cdd6f4"> ...}</tspan></text>

    <text x="0" y="426" font-family="monospace" font-size="11"><tspan fill="#cdd6f4">    </tspan><tspan fill="#89b4fa">def </tspan><tspan fill="#a6e3a1">compress_tokens</tspan><tspan fill="#cdd6f4">(</tspan><tspan fill="#f38ba8">self</tspan><tspan fill="#cdd6f4">, </tspan><tspan fill="#fab387">tokens</tspan><tspan fill="#cdd6f4">, </tspan><tspan fill="#fab387">positions</tspan><tspan fill="#cdd6f4">, </tspan><tspan fill="#fab387">level</tspan><tspan fill="#cdd6f4">):</tspan></text>
    <text x="0" y="444" font-family="monospace" font-size="11" fill="#6c7086">        # Merge or cluster compression</text>
    <text x="0" y="462" font-family="monospace" font-size="11"><tspan fill="#cdd6f4">        </tspan><tspan fill="#89b4fa">if </tspan><tspan fill="#f38ba8">self</tspan><tspan fill="#cdd6f4">.</tspan><tspan fill="#fab387">method</tspan><tspan fill="#cdd6f4"> == </tspan><tspan fill="#a6e3a1">"merge"</tspan><tspan fill="#cdd6f4">:</tspan></text>
    <text x="0" y="480" font-family="monospace" font-size="11"><tspan fill="#cdd6f4">            </tspan><tspan fill="#89b4fa">return </tspan><tspan fill="#f38ba8">self</tspan><tspan fill="#cdd6f4">.</tspan><tspan fill="#a6e3a1">_merge</tspan><tspan fill="#cdd6f4">(</tspan><tspan fill="#fab387">tokens</tspan><tspan fill="#cdd6f4">, </tspan><tspan fill="#fab387">positions</tspan><tspan fill="#cdd6f4">, </tspan><tspan fill="#fab387">level</tspan><tspan fill="#cdd6f4">)</tspan></text>
    <text x="0" y="498" font-family="monospace" font-size="11"><tspan fill="#cdd6f4">        </tspan><tspan fill="#89b4fa">return </tspan><tspan fill="#f38ba8">self</tspan><tspan fill="#cdd6f4">.</tspan><tspan fill="#a6e3a1">_cluster</tspan><tspan fill="#cdd6f4">(</tspan><tspan fill="#fab387">tokens</tspan><tspan fill="#cdd6f4">, </tspan><tspan fill="#fab387">positions</tspan><tspan fill="#cdd6f4">, </tspan><tspan fill="#fab387">level</tspan><tspan fill="#cdd6f4">)</tspan></text>

    <text x="0" y="528" font-family="monospace" font-size="11"><tspan fill="#cdd6f4">    </tspan><tspan fill="#89b4fa">def </tspan><tspan fill="#a6e3a1">forward</tspan><tspan fill="#cdd6f4">(</tspan><tspan fill="#f38ba8">self</tspan><tspan fill="#cdd6f4">, </tspan><tspan fill="#fab387">query</tspan><tspan fill="#cdd6f4">, </tspan><tspan fill="#fab387">keys</tspan><tspan fill="#cdd6f4">, </tspan><tspan fill="#fab387">values</tspan><tspan fill="#cdd6f4">, </tspan><tspan fill="#fab387">positions</tspan><tspan fill="#cdd6f4">):</tspan></text>
    <text x="0" y="546" font-family="monospace" font-size="11" fill="#6c7086">        # Assign levels, compress, concatenate</text>
    <text x="0" y="564" font-family="monospace" font-size="11"><tspan fill="#cdd6f4">        </tspan><tspan fill="#89b4fa">for </tspan><tspan fill="#fab387">level</tspan><tspan fill="#cdd6f4"> </tspan><tspan fill="#89b4fa">in </tspan><tspan fill="#f38ba8">self</tspan><tspan fill="#cdd6f4">.</tspan><tspan fill="#fab387">lod_config</tspan><tspan fill="#cdd6f4">:</tspan></text>
    <text x="0" y="582" font-family="monospace" font-size="11"><tspan fill="#cdd6f4">            </tspan><tspan fill="#fab387">compressed</tspan><tspan fill="#cdd6f4"> = </tspan><tspan fill="#f38ba8">self</tspan><tspan fill="#cdd6f4">.</tspan><tspan fill="#a6e3a1">compress_tokens</tspan><tspan fill="#cdd6f4">(...)</tspan></text>
    <text x="0" y="600" font-family="monospace" font-size="11"><tspan fill="#cdd6f4">        </tspan><tspan fill="#89b4fa">return </tspan><tspan fill="#fab387">torch</tspan><tspan fill="#cdd6f4">.</tspan><tspan fill="#a6e3a1">cat</tspan><tspan fill="#cdd6f4">(</tspan><tspan fill="#fab387">all_levels</tspan><tspan fill="#cdd6f4">, </tspan><tspan fill="#f38ba8">dim</tspan><tspan fill="#cdd6f4">=</tspan><tspan fill="#fab387">1</tspan><tspan fill="#cdd6f4">)</tspan></text>
  </g>

  <!-- RIGHT PANEL: Visualizations -->
  <g transform="translate(530, 55)">
    <!-- LOD Rings visualization -->
    <rect x="0" y="0" width="540" height="200" rx="8" fill="#313244"/>
    <text x="270" y="22" text-anchor="middle" font-family="Arial" font-size="12" fill="#cdd6f4" font-weight="bold">LOD Level Rings (Concentric Distance Zones)</text>
    <line x1="20" y1="32" x2="520" y2="32" stroke="#45475a" stroke-width="1"/>

    <!-- Concentric rings -->
    <g transform="translate(270, 120)">
      <!-- BEYOND ring -->
      <circle cx="0" cy="0" r="80" fill="none" stroke="#cba6f7" stroke-width="20" opacity="0.3"/>
      <text x="0" y="-65" text-anchor="middle" font-family="Arial" font-size="8" fill="#cba6f7">BEYOND</text>

      <!-- FAR ring -->
      <circle cx="0" cy="0" r="55" fill="none" stroke="#f9e2af" stroke-width="15" opacity="0.4"/>
      <text x="50" y="0" text-anchor="start" font-family="Arial" font-size="8" fill="#f9e2af">FAR</text>

      <!-- MEDIUM ring -->
      <circle cx="0" cy="0" r="35" fill="none" stroke="#89b4fa" stroke-width="12" opacity="0.5"/>
      <text x="30" y="25" text-anchor="start" font-family="Arial" font-size="8" fill="#89b4fa">MEDIUM</text>

      <!-- NEAR ring -->
      <circle cx="0" cy="0" r="18" fill="#a6e3a1" opacity="0.6"/>
      <text x="0" y="4" text-anchor="middle" font-family="Arial" font-size="8" fill="#1e1e2e" font-weight="bold">NEAR</text>

      <!-- Query point -->
      <circle cx="0" cy="0" r="4" fill="#f38ba8"/>
      <text x="0" y="15" text-anchor="middle" font-family="Arial" font-size="7" fill="#f38ba8">Query</text>
    </g>

    <!-- Distance labels -->
    <g transform="translate(420, 60)">
      <text x="0" y="0" font-family="monospace" font-size="9" fill="#a6e3a1">0-50: NEAR (1:1)</text>
      <text x="0" y="18" font-family="monospace" font-size="9" fill="#89b4fa">50-150: MEDIUM (5:1)</text>
      <text x="0" y="36" font-family="monospace" font-size="9" fill="#f9e2af">150-500: FAR (20:1)</text>
      <text x="0" y="54" font-family="monospace" font-size="9" fill="#cba6f7">500+: BEYOND (100:1)</text>
    </g>
  </g>

  <!-- Context Expansion -->
  <g transform="translate(530, 270)">
    <rect x="0" y="0" width="540" height="140" rx="8" fill="#313244"/>
    <text x="270" y="22" text-anchor="middle" font-family="Arial" font-size="12" fill="#cdd6f4" font-weight="bold">Context Expansion: 90 → 875 Tokens (9.7×)</text>
    <line x1="20" y1="32" x2="520" y2="32" stroke="#45475a" stroke-width="1"/>

    <!-- Before bar -->
    <g transform="translate(30, 50)">
      <text x="0" y="12" font-family="Arial" font-size="10" fill="#6c7086">Without LOD:</text>
      <rect x="100" y="0" width="50" height="20" rx="3" fill="#f38ba8"/>
      <text x="170" y="14" font-family="monospace" font-size="10" fill="#f38ba8">50 tokens visible</text>
    </g>

    <!-- After bar -->
    <g transform="translate(30, 85)">
      <text x="0" y="12" font-family="Arial" font-size="10" fill="#6c7086">With LOD:</text>
      <rect x="100" y="0" width="50" height="20" rx="3" fill="#a6e3a1"/>
      <rect x="150" y="0" width="25" height="20" rx="3" fill="#89b4fa"/>
      <rect x="175" y="0" width="10" height="20" rx="3" fill="#f9e2af"/>
      <rect x="185" y="0" width="5" height="20" rx="3" fill="#cba6f7"/>
      <text x="210" y="14" font-family="monospace" font-size="10" fill="#a6e3a1">90 tokens → 875 represented</text>
    </g>
  </g>

  <!-- Compression Methods -->
  <g transform="translate(530, 425)">
    <rect x="0" y="0" width="260" height="130" rx="8" fill="#313244"/>
    <text x="130" y="22" text-anchor="middle" font-family="Arial" font-size="11" fill="#89b4fa" font-weight="bold">Merge Compression</text>
    <line x1="20" y1="32" x2="240" y2="32" stroke="#45475a" stroke-width="1"/>

    <g transform="translate(20, 45)">
      <text x="0" y="0" font-family="monospace" font-size="9" fill="#6c7086"># Average nearby tokens</text>
      <text x="0" y="18" font-family="monospace" font-size="9" fill="#cdd6f4">[A, B, C, D, E] → [avg(A,B,C,D,E)]</text>
      <text x="0" y="40" font-family="Arial" font-size="9" fill="#a6e3a1">✓ Fast (O(n))</text>
      <text x="0" y="55" font-family="Arial" font-size="9" fill="#a6e3a1">✓ Simple implementation</text>
      <text x="0" y="70" font-family="Arial" font-size="9" fill="#f9e2af">○ Uniform distribution assumed</text>
    </g>
  </g>

  <g transform="translate(810, 425)">
    <rect x="0" y="0" width="260" height="130" rx="8" fill="#313244"/>
    <text x="130" y="22" text-anchor="middle" font-family="Arial" font-size="11" fill="#cba6f7" font-weight="bold">Cluster Compression</text>
    <line x1="20" y1="32" x2="240" y2="32" stroke="#45475a" stroke-width="1"/>

    <g transform="translate(20, 45)">
      <text x="0" y="0" font-family="monospace" font-size="9" fill="#6c7086"># K-means clustering</text>
      <text x="0" y="18" font-family="monospace" font-size="9" fill="#cdd6f4">[A,B,C,D,E] → [centroid1, centroid2]</text>
      <text x="0" y="40" font-family="Arial" font-size="9" fill="#a6e3a1">✓ Better quality</text>
      <text x="0" y="55" font-family="Arial" font-size="9" fill="#a6e3a1">✓ Handles irregular distributions</text>
      <text x="0" y="70" font-family="Arial" font-size="9" fill="#f9e2af">○ Slightly slower (k-means iters)</text>
    </g>
  </g>

  <!-- Performance comparison -->
  <g transform="translate(530, 570)">
    <rect x="0" y="0" width="540" height="85" rx="8" fill="#313244"/>
    <text x="270" y="20" text-anchor="middle" font-family="Arial" font-size="11" fill="#cdd6f4" font-weight="bold">Performance vs O(n²) Baseline</text>

    <g transform="translate(30, 40)">
      <rect x="0" y="0" width="150" height="30" rx="4" fill="#45475a"/>
      <text x="75" y="20" text-anchor="middle" font-family="Arial" font-size="11" fill="#a6e3a1" font-weight="bold">2,586× faster</text>
    </g>

    <g transform="translate(195, 40)">
      <rect x="0" y="0" width="150" height="30" rx="4" fill="#45475a"/>
      <text x="75" y="20" text-anchor="middle" font-family="Arial" font-size="11" fill="#89b4fa" font-weight="bold">1,330× cheaper</text>
    </g>

    <g transform="translate(360, 40)">
      <rect x="0" y="0" width="150" height="30" rx="4" fill="#45475a"/>
      <text x="75" y="20" text-anchor="middle" font-family="Arial" font-size="11" fill="#cba6f7" font-weight="bold">9.7× context</text>
    </g>
  </g>

  <!-- Footer: test stats -->
  <g transform="translate(20, 700)">
    <rect x="0" y="0" width="200" height="30" rx="6" fill="#313244"/>
    <text x="100" y="20" text-anchor="middle" font-family="Arial" font-size="11" fill="#a6e3a1">✓ 68 tests (67+1 skip)</text>
  </g>

  <g transform="translate(240, 700)">
    <rect x="0" y="0" width="160" height="30" rx="6" fill="#313244"/>
    <text x="80" y="20" text-anchor="middle" font-family="Arial" font-size="11" fill="#89b4fa">95.5% coverage</text>
  </g>

  <g transform="translate(420, 700)">
    <rect x="0" y="0" width="180" height="30" rx="6" fill="#313244"/>
    <text x="90" y="20" text-anchor="middle" font-family="Arial" font-size="11" fill="#f9e2af">lod.py: 93%</text>
  </g>

  <g transform="translate(620, 700)">
    <rect x="0" y="0" width="220" height="30" rx="6" fill="#313244"/>
    <text x="110" y="20" text-anchor="middle" font-family="Arial" font-size="11" fill="#cba6f7">spatial_attention_lod: 98%</text>
  </g>
</svg>
