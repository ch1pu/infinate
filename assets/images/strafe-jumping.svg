<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520">
  <defs>
    <linearGradient id="bgStrafe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef2f2"/>
      <stop offset="100%" style="stop-color:#fee2e2"/>
    </linearGradient>
    <filter id="shadowStrafe" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="520" fill="url(#bgStrafe)"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="Arial" font-size="20" fill="#991b1b" font-weight="bold">Strafe Jumping Navigation: 7 Physics Exploits from Quake</text>
  <text x="450" y="58" text-anchor="middle" font-family="Arial" font-size="13" fill="#dc2626">Momentum-based semantic space navigation - 10,317x faster than O(n²)</text>

  <!-- Exploit 1: Warp Lanes -->
  <g transform="translate(30, 85)">
    <rect x="0" y="0" width="270" height="130" rx="10" fill="white" filter="url(#shadowStrafe)"/>
    <rect x="0" y="0" width="270" height="32" rx="10" fill="#dc2626"/>
    <rect x="0" y="20" width="270" height="12" fill="#dc2626"/>
    <text x="135" y="22" text-anchor="middle" font-family="Arial" font-size="12" fill="white" font-weight="bold">1. Warp Lanes</text>

    <!-- Visualization -->
    <circle cx="50" cy="75" r="12" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
    <text x="50" y="79" text-anchor="middle" font-family="Arial" font-size="8" fill="white">Query</text>

    <circle cx="220" cy="75" r="12" fill="#22c55e" stroke="#16a34a" stroke-width="2"/>
    <text x="220" y="79" text-anchor="middle" font-family="Arial" font-size="8" fill="white">Target</text>

    <!-- Warp arrow (curved, skipping middle) -->
    <path d="M 65 65 Q 135 20 205 65" stroke="#dc2626" stroke-width="3" fill="none" stroke-dasharray="8,4" marker-end="url(#arrowhead)"/>
    <text x="135" y="45" text-anchor="middle" font-family="Arial" font-size="9" fill="#dc2626" font-weight="bold">WARP!</text>

    <!-- Skipped tokens -->
    <circle cx="100" cy="85" r="5" fill="#94a3b8" opacity="0.5"/>
    <circle cx="135" cy="90" r="5" fill="#94a3b8" opacity="0.5"/>
    <circle cx="170" cy="85" r="5" fill="#94a3b8" opacity="0.5"/>

    <text x="135" y="115" text-anchor="middle" font-family="Arial" font-size="9" fill="#64748b">Jump to distant similar tokens</text>
    <text x="135" y="125" text-anchor="middle" font-family="Arial" font-size="8" fill="#94a3b8">~15x similarity overcomes decay</text>
  </g>

  <!-- Exploit 2: Shell Memory -->
  <g transform="translate(315, 85)">
    <rect x="0" y="0" width="270" height="130" rx="10" fill="white" filter="url(#shadowStrafe)"/>
    <rect x="0" y="0" width="270" height="32" rx="10" fill="#f59e0b"/>
    <rect x="0" y="20" width="270" height="12" fill="#f59e0b"/>
    <text x="135" y="22" text-anchor="middle" font-family="Arial" font-size="12" fill="white" font-weight="bold">2. Shell Memory</text>

    <!-- Concentric shells -->
    <circle cx="135" cy="78" r="45" fill="none" stroke="#fcd34d" stroke-width="2" stroke-dasharray="4,2"/>
    <circle cx="135" cy="78" r="30" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,2"/>
    <circle cx="135" cy="78" r="15" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="135" cy="78" r="5" fill="#7c3aed"/>

    <!-- Tokens on shells -->
    <circle cx="150" cy="78" r="4" fill="#f59e0b"/>
    <circle cx="135" cy="93" r="4" fill="#f59e0b"/>
    <circle cx="165" cy="78" r="4" fill="#fbbf24"/>
    <circle cx="135" cy="48" r="4" fill="#fbbf24"/>
    <circle cx="180" cy="78" r="4" fill="#fcd34d"/>
    <circle cx="90" cy="78" r="4" fill="#fcd34d"/>

    <!-- Labels -->
    <text x="200" y="50" font-family="monospace" font-size="8" fill="#b45309">0.9r</text>
    <text x="215" y="65" font-family="monospace" font-size="8" fill="#b45309">1.9r</text>
    <text x="230" y="85" font-family="monospace" font-size="8" fill="#b45309">2.9r</text>

    <text x="135" y="115" text-anchor="middle" font-family="Arial" font-size="9" fill="#64748b">Position at optimal radii</text>
    <text x="135" y="125" text-anchor="middle" font-family="Arial" font-size="8" fill="#94a3b8">Maximize visibility before 3r cutoff</text>
  </g>

  <!-- Exploit 3: LOD Hopping -->
  <g transform="translate(600, 85)">
    <rect x="0" y="0" width="270" height="130" rx="10" fill="white" filter="url(#shadowStrafe)"/>
    <rect x="0" y="0" width="270" height="32" rx="10" fill="#8b5cf6"/>
    <rect x="0" y="20" width="270" height="12" fill="#8b5cf6"/>
    <text x="135" y="22" text-anchor="middle" font-family="Arial" font-size="12" fill="white" font-weight="bold">3. LOD Hopping</text>

    <!-- LOD boundary visualization -->
    <rect x="30" y="50" width="100" height="60" fill="#dcfce7" stroke="#22c55e" stroke-width="2" rx="5"/>
    <text x="80" y="75" text-anchor="middle" font-family="Arial" font-size="10" fill="#16a34a" font-weight="bold">100%</text>
    <text x="80" y="90" text-anchor="middle" font-family="Arial" font-size="8" fill="#16a34a">fidelity</text>

    <rect x="140" y="50" width="100" height="60" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="5"/>
    <text x="190" y="75" text-anchor="middle" font-family="Arial" font-size="10" fill="#b45309" font-weight="bold">80%</text>
    <text x="190" y="90" text-anchor="middle" font-family="Arial" font-size="8" fill="#b45309">fidelity</text>

    <!-- Boundary line -->
    <line x1="135" y1="45" x2="135" y2="115" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="135" y="42" text-anchor="middle" font-family="Arial" font-size="8" fill="#dc2626" font-weight="bold">Boundary 50</text>

    <!-- Token positioning -->
    <circle cx="125" cy="80" r="6" fill="#22c55e" stroke="#16a34a" stroke-width="2"/>
    <text x="125" y="100" text-anchor="middle" font-family="Arial" font-size="7" fill="#16a34a">49.9</text>

    <text x="135" y="125" text-anchor="middle" font-family="Arial" font-size="9" fill="#64748b">Exploit 80% fidelity cliff</text>
  </g>

  <!-- Exploit 4: Bunny Hop -->
  <g transform="translate(30, 230)">
    <rect x="0" y="0" width="270" height="130" rx="10" fill="white" filter="url(#shadowStrafe)"/>
    <rect x="0" y="0" width="270" height="32" rx="10" fill="#22c55e"/>
    <rect x="0" y="20" width="270" height="12" fill="#22c55e"/>
    <text x="135" y="22" text-anchor="middle" font-family="Arial" font-size="12" fill="white" font-weight="bold">4. Bunny Hop Momentum</text>

    <!-- Momentum arrows getting bigger -->
    <circle cx="40" cy="75" r="8" fill="#3b82f6"/>
    <line x1="52" y1="75" x2="70" y2="75" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowhead)"/>

    <circle cx="90" cy="75" r="8" fill="#3b82f6"/>
    <line x1="102" y1="75" x2="125" y2="75" stroke="#22c55e" stroke-width="3" marker-end="url(#arrowhead)"/>

    <circle cx="145" cy="75" r="8" fill="#3b82f6"/>
    <line x1="157" y1="75" x2="185" y2="75" stroke="#22c55e" stroke-width="4" marker-end="url(#arrowhead)"/>

    <circle cx="205" cy="75" r="8" fill="#3b82f6"/>
    <line x1="217" y1="75" x2="250" y2="75" stroke="#22c55e" stroke-width="5" marker-end="url(#arrowhead)"/>

    <!-- Velocity indicator -->
    <text x="60" y="95" font-family="monospace" font-size="8" fill="#64748b">v=1</text>
    <text x="115" y="95" font-family="monospace" font-size="8" fill="#64748b">v=2</text>
    <text x="170" y="95" font-family="monospace" font-size="8" fill="#64748b">v=3</text>
    <text x="235" y="95" font-family="monospace" font-size="8" fill="#16a34a" font-weight="bold">v=4</text>

    <text x="135" y="115" text-anchor="middle" font-family="Arial" font-size="9" fill="#64748b">Accumulate velocity on aligned queries</text>
    <text x="135" y="125" text-anchor="middle" font-family="Arial" font-size="8" fill="#94a3b8">Faster convergence with each hop</text>
  </g>

  <!-- Exploit 5: Circle Jump -->
  <g transform="translate(315, 230)">
    <rect x="0" y="0" width="270" height="130" rx="10" fill="white" filter="url(#shadowStrafe)"/>
    <rect x="0" y="0" width="270" height="32" rx="10" fill="#3b82f6"/>
    <rect x="0" y="20" width="270" height="12" fill="#3b82f6"/>
    <text x="135" y="22" text-anchor="middle" font-family="Arial" font-size="12" fill="white" font-weight="bold">5. Circle Jump</text>

    <!-- Phase 1: Broad circle -->
    <circle cx="80" cy="78" r="35" fill="none" stroke="#93c5fd" stroke-width="2" stroke-dasharray="4,2"/>
    <circle cx="80" cy="78" r="5" fill="#3b82f6"/>
    <text x="80" y="45" text-anchor="middle" font-family="Arial" font-size="8" fill="#3b82f6">Phase 1: Broad</text>

    <!-- Arrow between phases -->
    <line x1="120" y1="78" x2="145" y2="78" stroke="#1e40af" stroke-width="2" marker-end="url(#arrowPurple)"/>

    <!-- Phase 2: Specific (smaller, focused) -->
    <circle cx="190" cy="78" r="15" fill="none" stroke="#3b82f6" stroke-width="3"/>
    <circle cx="190" cy="78" r="5" fill="#22c55e"/>
    <circle cx="185" cy="70" r="3" fill="#3b82f6"/>
    <circle cx="198" cy="82" r="3" fill="#3b82f6"/>
    <circle cx="182" cy="85" r="3" fill="#3b82f6"/>
    <text x="190" y="55" text-anchor="middle" font-family="Arial" font-size="8" fill="#22c55e">Phase 2: Specific</text>

    <text x="135" y="115" text-anchor="middle" font-family="Arial" font-size="9" fill="#64748b">Two-phase navigation strategy</text>
    <text x="135" y="125" text-anchor="middle" font-family="Arial" font-size="8" fill="#94a3b8">Explore broadly, then focus narrowly</text>
  </g>

  <!-- Exploit 6: Temperature Surfing -->
  <g transform="translate(600, 230)">
    <rect x="0" y="0" width="270" height="130" rx="10" fill="white" filter="url(#shadowStrafe)"/>
    <rect x="0" y="0" width="270" height="32" rx="10" fill="#ef4444"/>
    <rect x="0" y="20" width="270" height="12" fill="#ef4444"/>
    <text x="135" y="22" text-anchor="middle" font-family="Arial" font-size="12" fill="white" font-weight="bold">6. Temperature Surfing</text>

    <!-- Temperature gradient bar -->
    <defs>
      <linearGradient id="tempGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:#ef4444"/>
        <stop offset="50%" style="stop-color:#f59e0b"/>
        <stop offset="100%" style="stop-color:#3b82f6"/>
      </linearGradient>
    </defs>
    <rect x="30" y="50" width="210" height="25" rx="5" fill="url(#tempGrad)"/>

    <!-- Labels -->
    <text x="50" y="68" text-anchor="middle" font-family="Arial" font-size="10" fill="white" font-weight="bold">HOT</text>
    <text x="135" y="68" text-anchor="middle" font-family="Arial" font-size="10" fill="white" font-weight="bold">WARM</text>
    <text x="220" y="68" text-anchor="middle" font-family="Arial" font-size="10" fill="white" font-weight="bold">COLD</text>

    <!-- Behavior labels -->
    <text x="50" y="90" text-anchor="middle" font-family="Arial" font-size="8" fill="#dc2626">Explore</text>
    <text x="135" y="90" text-anchor="middle" font-family="Arial" font-size="8" fill="#b45309">Balance</text>
    <text x="220" y="90" text-anchor="middle" font-family="Arial" font-size="8" fill="#2563eb">Exploit</text>

    <!-- Arrow showing direction -->
    <line x1="50" y1="100" x2="220" y2="100" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>

    <text x="135" y="115" text-anchor="middle" font-family="Arial" font-size="9" fill="#64748b">Annealing: hot start, cold finish</text>
    <text x="135" y="125" text-anchor="middle" font-family="Arial" font-size="8" fill="#94a3b8">T: 2.0 → 0.65 over iterations</text>
  </g>

  <!-- Exploit 7: Attention Ratchet -->
  <g transform="translate(170, 375)">
    <rect x="0" y="0" width="270" height="130" rx="10" fill="white" filter="url(#shadowStrafe)"/>
    <rect x="0" y="0" width="270" height="32" rx="10" fill="#7c3aed"/>
    <rect x="0" y="20" width="270" height="12" fill="#7c3aed"/>
    <text x="135" y="22" text-anchor="middle" font-family="Arial" font-size="12" fill="white" font-weight="bold">7. Attention Ratchet</text>

    <!-- Directed graph visualization -->
    <circle cx="60" cy="75" r="12" fill="#a78bfa" stroke="#7c3aed" stroke-width="2"/>
    <text x="60" y="79" text-anchor="middle" font-family="Arial" font-size="8" fill="white">A</text>

    <circle cx="135" cy="55" r="12" fill="#a78bfa" stroke="#7c3aed" stroke-width="2"/>
    <text x="135" y="59" text-anchor="middle" font-family="Arial" font-size="8" fill="white">B</text>

    <circle cx="135" cy="95" r="12" fill="#a78bfa" stroke="#7c3aed" stroke-width="2"/>
    <text x="135" y="99" text-anchor="middle" font-family="Arial" font-size="8" fill="white">C</text>

    <circle cx="210" cy="75" r="12" fill="#22c55e" stroke="#16a34a" stroke-width="2"/>
    <text x="210" y="79" text-anchor="middle" font-family="Arial" font-size="8" fill="white">D</text>

    <!-- Directed arrows -->
    <line x1="72" y1="68" x2="120" y2="58" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowPurple)"/>
    <line x1="72" y1="82" x2="120" y2="92" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowPurple)"/>
    <line x1="147" y1="55" x2="195" y2="68" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowPurple)"/>
    <line x1="147" y1="95" x2="195" y2="82" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowPurple)"/>

    <text x="135" y="115" text-anchor="middle" font-family="Arial" font-size="9" fill="#64748b">Directed warp graph awareness</text>
    <text x="135" y="125" text-anchor="middle" font-family="Arial" font-size="8" fill="#94a3b8">Track reversible vs one-way warps</text>
  </g>

  <!-- Result callout -->
  <g transform="translate(460, 375)">
    <rect x="0" y="0" width="270" height="130" rx="10" fill="#7f1d1d" filter="url(#shadowStrafe)"/>
    <text x="135" y="35" text-anchor="middle" font-family="Arial" font-size="16" fill="white" font-weight="bold">Combined Result</text>

    <text x="135" y="60" text-anchor="middle" font-family="Arial" font-size="12" fill="#fca5a5">In-Memory:</text>
    <text x="135" y="78" text-anchor="middle" font-family="Arial" font-size="18" fill="#fef2f2" font-weight="bold">10,317x faster</text>

    <text x="135" y="100" text-anchor="middle" font-family="Arial" font-size="12" fill="#fca5a5">Production (Qdrant):</text>
    <text x="135" y="118" text-anchor="middle" font-family="Arial" font-size="18" fill="#fef2f2" font-weight="bold">533x faster</text>
  </g>
</svg>
