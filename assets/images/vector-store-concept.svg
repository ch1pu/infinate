<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700">
  <defs>
    <linearGradient id="bgVectorConcept" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eff6ff"/>
      <stop offset="100%" style="stop-color:#e0e7ff"/>
    </linearGradient>
    <filter id="shadowVC" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrowBlueVC" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#3b82f6"/>
    </marker>
    <marker id="arrowGreenVC" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#22c55e"/>
    </marker>
    <marker id="arrowRedVC" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1000" height="700" fill="url(#bgVectorConcept)"/>

  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" font-family="Arial" font-size="24" fill="#1e40af" font-weight="bold">Vector Store Integration: Unlimited Context Memory</text>
  <text x="500" y="58" text-anchor="middle" font-family="Arial" font-size="14" fill="#3b82f6">M1.6 - How INFINATE connects to vector databases for infinite memory</text>

  <!-- TOP SECTION: The Problem (Traditional RAG) -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="450" height="200" rx="12" fill="white" filter="url(#shadowVC)"/>
    <rect x="0" y="0" width="450" height="35" rx="12" fill="#ef4444"/>
    <rect x="0" y="22" width="450" height="13" fill="#ef4444"/>
    <text x="225" y="24" text-anchor="middle" font-family="Arial" font-size="14" fill="white" font-weight="bold">The Problem: Traditional RAG</text>

    <!-- Traditional RAG flow -->
    <g transform="translate(25, 55)">
      <rect x="0" y="0" width="80" height="40" rx="6" fill="#fecaca"/>
      <text x="40" y="25" text-anchor="middle" font-family="Arial" font-size="10" fill="#991b1b">Model</text>

      <line x1="85" y1="20" x2="115" y2="20" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRedVC)"/>

      <rect x="120" y="0" width="80" height="40" rx="6" fill="#fecaca"/>
      <text x="160" y="25" text-anchor="middle" font-family="Arial" font-size="10" fill="#991b1b">Retriever</text>

      <line x1="205" y1="20" x2="235" y2="20" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRedVC)"/>

      <rect x="240" y="0" width="80" height="40" rx="6" fill="#fecaca"/>
      <text x="280" y="25" text-anchor="middle" font-family="Arial" font-size="10" fill="#991b1b">Vector DB</text>

      <line x1="320" y1="20" x2="350" y2="20" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRedVC)"/>

      <rect x="355" y="0" width="40" height="40" rx="6" fill="#fecaca"/>
      <text x="375" y="25" text-anchor="middle" font-family="Arial" font-size="10" fill="#991b1b">...</text>
    </g>

    <!-- Return path -->
    <g transform="translate(25, 55)">
      <path d="M 375 45 L 375 70 L 40 70 L 40 45" stroke="#ef4444" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowRedVC)"/>
    </g>

    <!-- Problems list -->
    <g transform="translate(30, 145)">
      <text x="0" y="0" font-family="Arial" font-size="11" fill="#991b1b">✗ Multiple round trips (slow)</text>
      <text x="0" y="18" font-family="Arial" font-size="11" fill="#991b1b">✗ Context assembled OUTSIDE model</text>
      <text x="200" y="0" font-family="Arial" font-size="11" fill="#991b1b">✗ O(n) retrieval overhead</text>
      <text x="200" y="18" font-family="Arial" font-size="11" fill="#991b1b">✗ No spatial awareness</text>
    </g>
  </g>

  <!-- TOP SECTION: The Solution (INFINATE) -->
  <g transform="translate(520, 80)">
    <rect x="0" y="0" width="450" height="200" rx="12" fill="white" filter="url(#shadowVC)"/>
    <rect x="0" y="0" width="450" height="35" rx="12" fill="#22c55e"/>
    <rect x="0" y="22" width="450" height="13" fill="#22c55e"/>
    <text x="225" y="24" text-anchor="middle" font-family="Arial" font-size="14" fill="white" font-weight="bold">The Solution: INFINATE Direct Query</text>

    <!-- INFINATE flow -->
    <g transform="translate(50, 55)">
      <rect x="0" y="0" width="140" height="50" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
      <text x="70" y="20" text-anchor="middle" font-family="Arial" font-size="11" fill="#166534" font-weight="bold">Spatial Attention</text>
      <text x="70" y="38" text-anchor="middle" font-family="Arial" font-size="10" fill="#166534">(inside model)</text>

      <line x1="145" y1="25" x2="195" y2="25" stroke="#22c55e" stroke-width="3" marker-end="url(#arrowGreenVC)"/>
      <text x="170" y="15" text-anchor="middle" font-family="Arial" font-size="9" fill="#166534">direct</text>

      <rect x="200" y="0" width="140" height="50" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
      <text x="270" y="20" text-anchor="middle" font-family="Arial" font-size="11" fill="#166534" font-weight="bold">Vector Store</text>
      <text x="270" y="38" text-anchor="middle" font-family="Arial" font-size="10" fill="#166534">(Qdrant/pgvector)</text>
    </g>

    <!-- Benefits list -->
    <g transform="translate(30, 130)">
      <text x="0" y="0" font-family="Arial" font-size="11" fill="#166534">✓ Single query during attention</text>
      <text x="0" y="18" font-family="Arial" font-size="11" fill="#166534">✓ Context inside model (O(k))</text>
      <text x="0" y="36" font-family="Arial" font-size="11" fill="#166534">✓ Semantic + spatial filtering</text>
      <text x="220" y="0" font-family="Arial" font-size="11" fill="#166534">✓ O(log n) vector lookup</text>
      <text x="220" y="18" font-family="Arial" font-size="11" fill="#166534">✓ HNSW + Octree indexing</text>
      <text x="220" y="36" font-family="Arial" font-size="11" fill="#166534">✓ Unlimited context!</text>
    </g>
  </g>

  <!-- MIDDLE SECTION: How the Query Works -->
  <g transform="translate(30, 300)">
    <rect x="0" y="0" width="940" height="200" rx="12" fill="white" filter="url(#shadowVC)"/>
    <rect x="0" y="0" width="940" height="35" rx="12" fill="#6366f1"/>
    <rect x="0" y="22" width="940" height="13" fill="#6366f1"/>
    <text x="470" y="24" text-anchor="middle" font-family="Arial" font-size="14" fill="white" font-weight="bold">How It Works: Semantic + Spatial Query</text>

    <!-- Step 1: Query comes in -->
    <g transform="translate(30, 55)">
      <rect x="0" y="0" width="160" height="120" rx="8" fill="#eff6ff"/>
      <text x="80" y="20" text-anchor="middle" font-family="Arial" font-size="11" fill="#1e40af" font-weight="bold">1. Query Arrives</text>
      <rect x="15" y="35" width="130" height="25" rx="4" fill="#3b82f6"/>
      <text x="80" y="52" text-anchor="middle" font-family="Arial" font-size="9" fill="white">query_vector (768d)</text>
      <rect x="15" y="65" width="130" height="25" rx="4" fill="#8b5cf6"/>
      <text x="80" y="82" text-anchor="middle" font-family="Arial" font-size="9" fill="white">position (x, y, z)</text>
      <text x="80" y="110" text-anchor="middle" font-family="Arial" font-size="9" fill="#64748b">What + Where</text>
    </g>

    <!-- Arrow -->
    <line x1="200" y1="115" x2="240" y2="115" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowBlueVC)"/>

    <!-- Step 2: Vector similarity -->
    <g transform="translate(250, 55)">
      <rect x="0" y="0" width="200" height="120" rx="8" fill="#fef3c7"/>
      <text x="100" y="20" text-anchor="middle" font-family="Arial" font-size="11" fill="#b45309" font-weight="bold">2. Vector Similarity (HNSW)</text>
      <text x="100" y="45" text-anchor="middle" font-family="Arial" font-size="10" fill="#92400e">Find semantically similar tokens</text>
      <text x="100" y="65" text-anchor="middle" font-family="monospace" font-size="9" fill="#b45309">cosine(query, all_tokens)</text>
      <text x="100" y="90" text-anchor="middle" font-family="Arial" font-size="10" fill="#92400e">Returns: top-k candidates</text>
      <text x="100" y="110" text-anchor="middle" font-family="Arial" font-size="9" fill="#64748b">O(log n) via HNSW index</text>
    </g>

    <!-- Arrow -->
    <line x1="460" y1="115" x2="500" y2="115" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowBlueVC)"/>

    <!-- Step 3: Spatial filter -->
    <g transform="translate(510, 55)">
      <rect x="0" y="0" width="200" height="120" rx="8" fill="#dcfce7"/>
      <text x="100" y="20" text-anchor="middle" font-family="Arial" font-size="11" fill="#166534" font-weight="bold">3. Spatial Filter</text>
      <text x="100" y="45" text-anchor="middle" font-family="Arial" font-size="10" fill="#166534">Keep only nearby tokens</text>
      <text x="100" y="65" text-anchor="middle" font-family="monospace" font-size="9" fill="#166534">distance(pos, token.pos) ≤ r</text>
      <text x="100" y="90" text-anchor="middle" font-family="Arial" font-size="10" fill="#166534">Octree range query</text>
      <text x="100" y="110" text-anchor="middle" font-family="Arial" font-size="9" fill="#64748b">O(log n) spatial lookup</text>
    </g>

    <!-- Arrow -->
    <line x1="720" y1="115" x2="760" y2="115" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowBlueVC)"/>

    <!-- Step 4: Return k nearest -->
    <g transform="translate(770, 55)">
      <rect x="0" y="0" width="140" height="120" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
      <text x="70" y="20" text-anchor="middle" font-family="Arial" font-size="11" fill="#166534" font-weight="bold">4. Return k Tokens</text>
      <text x="70" y="45" text-anchor="middle" font-family="Arial" font-size="10" fill="#166534">embeddings (k, 768)</text>
      <text x="70" y="65" text-anchor="middle" font-family="Arial" font-size="10" fill="#166534">positions (k, 3)</text>
      <text x="70" y="85" text-anchor="middle" font-family="Arial" font-size="10" fill="#166534">ids [k strings]</text>
      <text x="70" y="110" text-anchor="middle" font-family="Arial" font-size="9" fill="#166534" font-weight="bold">Attention: O(k)</text>
    </g>
  </g>

  <!-- BOTTOM SECTION: Key Insight -->
  <g transform="translate(30, 520)">
    <rect x="0" y="0" width="600" height="160" rx="12" fill="#1e40af" filter="url(#shadowVC)"/>
    <text x="300" y="30" text-anchor="middle" font-family="Arial" font-size="16" fill="white" font-weight="bold">THE KEY INSIGHT</text>

    <text x="300" y="60" text-anchor="middle" font-family="Arial" font-size="14" fill="#93c5fd">Vector DB Query = Spatial Attention</text>
    <text x="300" y="82" text-anchor="middle" font-family="Arial" font-size="12" fill="#bfdbfe">(mathematically equivalent)</text>

    <line x1="50" y1="95" x2="550" y2="95" stroke="#60a5fa" stroke-width="1"/>

    <text x="150" y="120" text-anchor="middle" font-family="Arial" font-size="11" fill="#bfdbfe">Traditional Attention:</text>
    <text x="150" y="140" text-anchor="middle" font-family="monospace" font-size="12" fill="#fbbf24">O(n²)</text>

    <text x="450" y="120" text-anchor="middle" font-family="Arial" font-size="11" fill="#bfdbfe">Vector Store Query:</text>
    <text x="450" y="140" text-anchor="middle" font-family="monospace" font-size="12" fill="#4ade80">O(log n + k) ≈ constant</text>
  </g>

  <!-- BOTTOM RIGHT: Performance Stats -->
  <g transform="translate(660, 520)">
    <rect x="0" y="0" width="310" height="160" rx="12" fill="white" filter="url(#shadowVC)"/>
    <text x="155" y="25" text-anchor="middle" font-family="Arial" font-size="14" fill="#1e40af" font-weight="bold">Performance (10k tokens)</text>

    <g transform="translate(20, 45)">
      <rect x="0" y="0" width="130" height="45" rx="6" fill="#dcfce7"/>
      <text x="65" y="18" text-anchor="middle" font-family="Arial" font-size="10" fill="#166534">Distance calc</text>
      <text x="65" y="36" text-anchor="middle" font-family="Arial" font-size="14" fill="#166534" font-weight="bold">0.7ms</text>
    </g>

    <g transform="translate(160, 45)">
      <rect x="0" y="0" width="130" height="45" rx="6" fill="#dcfce7"/>
      <text x="65" y="18" text-anchor="middle" font-family="Arial" font-size="10" fill="#166534">k-NN (k=50)</text>
      <text x="65" y="36" text-anchor="middle" font-family="Arial" font-size="14" fill="#166534" font-weight="bold">2.1ms</text>
    </g>

    <g transform="translate(20, 100)">
      <rect x="0" y="0" width="130" height="45" rx="6" fill="#dbeafe"/>
      <text x="65" y="18" text-anchor="middle" font-family="Arial" font-size="10" fill="#1e40af">Qdrant query</text>
      <text x="65" y="36" text-anchor="middle" font-family="Arial" font-size="14" fill="#1e40af" font-weight="bold">~8ms</text>
    </g>

    <g transform="translate(160, 100)">
      <rect x="0" y="0" width="130" height="45" rx="6" fill="#f3e8ff"/>
      <text x="65" y="18" text-anchor="middle" font-family="Arial" font-size="10" fill="#7c3aed">Tests passing</text>
      <text x="65" y="36" text-anchor="middle" font-family="Arial" font-size="14" fill="#7c3aed" font-weight="bold">17/17</text>
    </g>
  </g>
</svg>
