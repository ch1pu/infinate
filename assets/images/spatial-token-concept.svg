<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400">
  <defs>
    <linearGradient id="bgConcept" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eff6ff"/>
      <stop offset="100%" style="stop-color:#dbeafe"/>
    </linearGradient>
    <linearGradient id="tokenGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="tokenGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#6d28d9"/>
    </linearGradient>
    <linearGradient id="tokenGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
    <filter id="shadowConcept" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    <filter id="glowBlue" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="400" fill="url(#bgConcept)"/>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-family="Arial" font-size="20" fill="#1e40af" font-weight="bold">SpatialToken: Every Token Has Meaning AND Location</text>

  <!-- Left: The Problem -->
  <g transform="translate(30, 60)">
    <rect x="0" y="0" width="260" height="155" rx="12" fill="white" filter="url(#shadowConcept)"/>
    <rect x="0" y="0" width="260" height="35" rx="12" fill="#ef4444"/>
    <rect x="0" y="22" width="260" height="13" fill="#ef4444"/>
    <text x="130" y="24" text-anchor="middle" font-family="Arial" font-size="13" fill="white" font-weight="bold">Traditional: Just the Word</text>

    <!-- Same word, no context -->
    <text x="130" y="65" text-anchor="middle" font-family="Georgia" font-size="16" fill="#1e293b">"function"</text>

    <text x="130" y="95" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">Which function?</text>

    <text x="65" y="120" text-anchor="middle" font-family="Arial" font-size="10" fill="#94a3b8">auth.login()?</text>
    <text x="130" y="120" text-anchor="middle" font-family="Arial" font-size="10" fill="#94a3b8">db.query()?</text>
    <text x="195" y="120" text-anchor="middle" font-family="Arial" font-size="10" fill="#94a3b8">math.sqrt()?</text>

    <text x="130" y="145" text-anchor="middle" font-family="Arial" font-size="11" fill="#dc2626" font-weight="bold">No way to know!</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(300, 130)">
    <polygon points="0,15 30,0 30,10 60,10 60,20 30,20 30,30" fill="#3b82f6"/>
  </g>

  <!-- Right: The Solution -->
  <g transform="translate(370, 60)">
    <rect x="0" y="0" width="500" height="155" rx="12" fill="white" filter="url(#shadowConcept)"/>
    <rect x="0" y="0" width="500" height="35" rx="12" fill="#22c55e"/>
    <rect x="0" y="22" width="500" height="13" fill="#22c55e"/>
    <text x="250" y="24" text-anchor="middle" font-family="Arial" font-size="13" fill="white" font-weight="bold">SpatialToken: Word + Position = Context</text>

    <!-- Three tokens with positions -->
    <g transform="translate(45, 55)">
      <rect x="0" y="0" width="120" height="85" rx="8" fill="url(#tokenGrad1)" filter="url(#shadowConcept)"/>
      <text x="60" y="25" text-anchor="middle" font-family="Georgia" font-size="14" fill="white">"function"</text>
      <line x1="15" y1="35" x2="105" y2="35" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
      <text x="60" y="55" text-anchor="middle" font-family="monospace" font-size="10" fill="#bfdbfe">position:</text>
      <text x="60" y="72" text-anchor="middle" font-family="monospace" font-size="11" fill="white" font-weight="bold">(100, 50, 25)</text>
      <text x="60" y="95" text-anchor="middle" font-family="Arial" font-size="9" fill="#93c5fd">→ Auth Module</text>
    </g>

    <g transform="translate(190, 55)">
      <rect x="0" y="0" width="120" height="85" rx="8" fill="url(#tokenGrad2)" filter="url(#shadowConcept)"/>
      <text x="60" y="25" text-anchor="middle" font-family="Georgia" font-size="14" fill="white">"function"</text>
      <line x1="15" y1="35" x2="105" y2="35" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
      <text x="60" y="55" text-anchor="middle" font-family="monospace" font-size="10" fill="#ddd6fe">position:</text>
      <text x="60" y="72" text-anchor="middle" font-family="monospace" font-size="11" fill="white" font-weight="bold">(500, 150, 80)</text>
      <text x="60" y="95" text-anchor="middle" font-family="Arial" font-size="9" fill="#c4b5fd">→ Database Module</text>
    </g>

    <g transform="translate(335, 55)">
      <rect x="0" y="0" width="120" height="85" rx="8" fill="url(#tokenGrad3)" filter="url(#shadowConcept)"/>
      <text x="60" y="25" text-anchor="middle" font-family="Georgia" font-size="14" fill="white">"function"</text>
      <line x1="15" y1="35" x2="105" y2="35" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
      <text x="60" y="55" text-anchor="middle" font-family="monospace" font-size="10" fill="#bbf7d0">position:</text>
      <text x="60" y="72" text-anchor="middle" font-family="monospace" font-size="11" fill="white" font-weight="bold">(250, 300, 10)</text>
      <text x="60" y="95" text-anchor="middle" font-family="Arial" font-size="9" fill="#86efac">→ Math Utils</text>
    </g>
  </g>

  <!-- Bottom: 3D Space Visualization -->
  <g transform="translate(50, 235)">
    <rect x="0" y="0" width="380" height="150" rx="12" fill="white" filter="url(#shadowConcept)"/>

    <!-- 3D coordinate system -->
    <g transform="translate(100, 85)">
      <!-- Axes -->
      <line x1="0" y1="0" x2="0" y2="-60" stroke="#64748b" stroke-width="2"/>
      <line x1="0" y1="0" x2="80" y2="30" stroke="#64748b" stroke-width="2"/>
      <line x1="0" y1="0" x2="-60" y2="30" stroke="#64748b" stroke-width="2"/>

      <!-- Axis labels -->
      <text x="0" y="-68" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b" font-weight="bold">Y</text>
      <text x="90" y="35" font-family="Arial" font-size="11" fill="#64748b" font-weight="bold">X</text>
      <text x="-70" y="38" font-family="Arial" font-size="11" fill="#64748b" font-weight="bold">Z</text>

      <!-- Token points in space -->
      <circle cx="30" cy="-25" r="12" fill="#3b82f6" filter="url(#glowBlue)"/>
      <text x="30" y="-20" text-anchor="middle" font-family="Arial" font-size="8" fill="white">auth</text>

      <circle cx="60" cy="10" r="12" fill="#8b5cf6" filter="url(#glowBlue)"/>
      <text x="60" y="14" text-anchor="middle" font-family="Arial" font-size="8" fill="white">db</text>

      <circle cx="-20" cy="-10" r="12" fill="#22c55e" filter="url(#glowBlue)"/>
      <text x="-20" y="-6" text-anchor="middle" font-family="Arial" font-size="8" fill="white">math</text>

      <!-- Distance line between auth and db -->
      <line x1="30" y1="-25" x2="60" y2="10" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,2"/>
    </g>

    <text x="280" y="40" text-anchor="middle" font-family="Arial" font-size="12" fill="#1e40af" font-weight="bold">Tokens in 3D Space</text>
    <text x="280" y="60" text-anchor="middle" font-family="Arial" font-size="10" fill="#64748b">Same word, different locations</text>
    <text x="280" y="80" text-anchor="middle" font-family="Arial" font-size="10" fill="#64748b">= different meanings</text>

    <text x="280" y="110" text-anchor="middle" font-family="Arial" font-size="10" fill="#f59e0b">Distance = Relevance</text>
    <text x="280" y="128" text-anchor="middle" font-family="Arial" font-size="9" fill="#64748b">Close tokens attend to each other</text>
    <text x="280" y="143" text-anchor="middle" font-family="Arial" font-size="9" fill="#64748b">Far tokens are ignored (O(k)!)</text>
  </g>

  <!-- Bottom right: The Key Insight -->
  <g transform="translate(470, 235)">
    <rect x="0" y="0" width="400" height="150" rx="12" fill="#1e40af" filter="url(#shadowConcept)"/>

    <text x="200" y="30" text-anchor="middle" font-family="Arial" font-size="14" fill="white" font-weight="bold">The Key Insight</text>

    <g transform="translate(30, 50)">
      <!-- Semantic box -->
      <rect x="0" y="0" width="100" height="40" rx="6" fill="#60a5fa"/>
      <text x="50" y="17" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Semantic</text>
      <text x="50" y="32" text-anchor="middle" font-family="Arial" font-size="9" fill="#bfdbfe">(what it means)</text>
    </g>

    <text x="155" y="75" text-anchor="middle" font-family="Arial" font-size="20" fill="white">+</text>

    <g transform="translate(175, 50)">
      <!-- Spatial box -->
      <rect x="0" y="0" width="100" height="40" rx="6" fill="#a78bfa"/>
      <text x="50" y="17" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Spatial</text>
      <text x="50" y="32" text-anchor="middle" font-family="Arial" font-size="9" fill="#ddd6fe">(where it is)</text>
    </g>

    <text x="300" y="75" text-anchor="middle" font-family="Arial" font-size="20" fill="white">=</text>

    <g transform="translate(315, 50)">
      <!-- Full embedding box -->
      <rect x="0" y="0" width="70" height="40" rx="6" fill="#4ade80"/>
      <text x="35" y="17" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Context</text>
      <text x="35" y="32" text-anchor="middle" font-family="Arial" font-size="9" fill="#bbf7d0">(full picture)</text>
    </g>

    <text x="200" y="120" text-anchor="middle" font-family="Arial" font-size="11" fill="#93c5fd">Position gives meaning to identical words</text>
    <text x="200" y="138" text-anchor="middle" font-family="Arial" font-size="11" fill="#bfdbfe">→ Enables O(k) attention (only check nearby!)</text>
  </g>
</svg>
