<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480">
  <defs>
    <linearGradient id="bgAttn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef2f2"/>
      <stop offset="100%" style="stop-color:#fce7f3"/>
    </linearGradient>
    <filter id="shadowAttn" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="480" fill="url(#bgAttn)"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial" font-size="20" fill="#991b1b" font-weight="bold">Spatial Attention: The O(k) Breakthrough</text>
  <text x="450" y="50" text-anchor="middle" font-family="Arial" font-size="12" fill="#dc2626">How INFINATE achieves unlimited context through spatial locality</text>

  <!-- Left: The Problem (O(n²)) -->
  <g transform="translate(30, 70)">
    <rect x="0" y="0" width="260" height="180" rx="12" fill="white" filter="url(#shadowAttn)"/>
    <rect x="0" y="0" width="260" height="35" rx="12" fill="#ef4444"/>
    <rect x="0" y="22" width="260" height="13" fill="#ef4444"/>
    <text x="130" y="24" text-anchor="middle" font-family="Arial" font-size="12" fill="white" font-weight="bold">Traditional: O(n²)</text>

    <!-- n×n grid visualization -->
    <g transform="translate(30, 50)">
      <text x="100" y="0" text-anchor="middle" font-family="Arial" font-size="10" fill="#64748b">Every token attends to ALL tokens</text>

      <!-- Grid showing n² comparisons -->
      <g transform="translate(40, 15)">
        <rect x="0" y="0" width="120" height="80" fill="#fecaca" stroke="#ef4444" stroke-width="1"/>

        <!-- Grid lines -->
        <line x1="30" y1="0" x2="30" y2="80" stroke="#ef4444" stroke-width="0.5" opacity="0.5"/>
        <line x1="60" y1="0" x2="60" y2="80" stroke="#ef4444" stroke-width="0.5" opacity="0.5"/>
        <line x1="90" y1="0" x2="90" y2="80" stroke="#ef4444" stroke-width="0.5" opacity="0.5"/>
        <line x1="0" y1="20" x2="120" y2="20" stroke="#ef4444" stroke-width="0.5" opacity="0.5"/>
        <line x1="0" y1="40" x2="120" y2="40" stroke="#ef4444" stroke-width="0.5" opacity="0.5"/>
        <line x1="0" y1="60" x2="120" y2="60" stroke="#ef4444" stroke-width="0.5" opacity="0.5"/>

        <text x="60" y="45" text-anchor="middle" font-family="Arial" font-size="9" fill="#dc2626" font-weight="bold">n² pairs!</text>
      </g>

      <!-- Labels -->
      <text x="-5" y="55" font-family="Arial" font-size="8" fill="#64748b">n</text>
      <text x="100" y="105" text-anchor="middle" font-family="Arial" font-size="8" fill="#64748b">n tokens</text>
    </g>

    <text x="130" y="155" text-anchor="middle" font-family="Arial" font-size="10" fill="#dc2626" font-weight="bold">1M tokens = 10¹² operations</text>
    <text x="130" y="170" text-anchor="middle" font-family="Arial" font-size="9" fill="#ef4444">IMPOSSIBLE!</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(300, 150)">
    <polygon points="0,15 25,0 25,10 55,10 55,20 25,20 25,30" fill="#22c55e"/>
  </g>

  <!-- Right: The Solution (O(k)) -->
  <g transform="translate(370, 70)">
    <rect x="0" y="0" width="500" height="180" rx="12" fill="white" filter="url(#shadowAttn)"/>
    <rect x="0" y="0" width="500" height="35" rx="12" fill="#22c55e"/>
    <rect x="0" y="22" width="500" height="13" fill="#22c55e"/>
    <text x="250" y="24" text-anchor="middle" font-family="Arial" font-size="12" fill="white" font-weight="bold">INFINATE: O(k) Spatial Attention</text>

    <!-- Radius visualization -->
    <g transform="translate(80, 95)">
      <!-- Outer cutoff circle (3×radius) -->
      <circle cx="0" cy="0" r="55" fill="none" stroke="#fca5a5" stroke-width="2" stroke-dasharray="4,2"/>
      <text x="60" y="-45" font-family="Arial" font-size="8" fill="#dc2626">3×r cutoff</text>

      <!-- Inner radius circle -->
      <circle cx="0" cy="0" r="35" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
      <text x="0" y="-40" text-anchor="middle" font-family="Arial" font-size="8" fill="#166534">radius r</text>

      <!-- Query token (center) -->
      <circle cx="0" cy="0" r="8" fill="#3b82f6"/>
      <text x="0" y="4" text-anchor="middle" font-family="Arial" font-size="7" fill="white">Q</text>

      <!-- Nearby tokens (attended) -->
      <circle cx="20" cy="-15" r="6" fill="#22c55e"/>
      <circle cx="-15" cy="20" r="6" fill="#22c55e"/>
      <circle cx="25" cy="10" r="6" fill="#22c55e"/>
      <circle cx="-25" cy="-10" r="6" fill="#22c55e"/>
      <circle cx="5" cy="25" r="6" fill="#22c55e"/>

      <!-- Distant tokens (ignored) -->
      <circle cx="70" cy="20" r="6" fill="#d1d5db" opacity="0.5"/>
      <circle cx="-65" cy="-30" r="6" fill="#d1d5db" opacity="0.5"/>
      <circle cx="50" cy="-50" r="6" fill="#d1d5db" opacity="0.5"/>
    </g>

    <!-- Explanation -->
    <g transform="translate(200, 50)">
      <text x="0" y="0" font-family="Arial" font-size="10" fill="#166534" font-weight="bold">Only attend to k neighbors!</text>

      <text x="0" y="25" font-family="Arial" font-size="9" fill="#22c55e">✓</text>
      <text x="15" y="25" font-family="Arial" font-size="9" fill="#64748b">Inside radius: ATTEND</text>

      <text x="0" y="42" font-family="Arial" font-size="9" fill="#ef4444">✗</text>
      <text x="15" y="42" font-family="Arial" font-size="9" fill="#64748b">Beyond 3×r: IGNORE (weight=0)</text>

      <text x="0" y="65" font-family="Arial" font-size="9" fill="#64748b">k ≈ 50 neighbors (constant!)</text>
      <text x="0" y="82" font-family="Arial" font-size="9" fill="#64748b">Regardless of total tokens</text>

      <rect x="0" y="95" width="260" height="25" rx="4" fill="#22c55e" opacity="0.2"/>
      <text x="130" y="112" text-anchor="middle" font-family="Arial" font-size="10" fill="#166534" font-weight="bold">1M tokens = 5×10⁷ ops (20,000× less!)</text>
    </g>
  </g>

  <!-- Bottom: Distance Decay Visualization -->
  <g transform="translate(30, 270)">
    <rect x="0" y="0" width="840" height="190" rx="12" fill="white" filter="url(#shadowAttn)"/>
    <text x="420" y="25" text-anchor="middle" font-family="Arial" font-size="14" fill="#7c3aed" font-weight="bold">Distance Decay: How Attention Weight Decreases with Distance</text>

    <!-- Decay curve graph -->
    <g transform="translate(50, 50)">
      <!-- Axes -->
      <line x1="0" y1="100" x2="300" y2="100" stroke="#64748b" stroke-width="1"/>
      <line x1="0" y1="0" x2="0" y2="100" stroke="#64748b" stroke-width="1"/>

      <!-- Y-axis labels -->
      <text x="-10" y="8" text-anchor="end" font-family="Arial" font-size="8" fill="#64748b">1.0</text>
      <text x="-10" y="55" text-anchor="end" font-family="Arial" font-size="8" fill="#64748b">0.5</text>
      <text x="-10" y="103" text-anchor="end" font-family="Arial" font-size="8" fill="#64748b">0</text>
      <text x="-25" y="55" text-anchor="middle" font-family="Arial" font-size="9" fill="#64748b" transform="rotate(-90, -25, 55)">weight</text>

      <!-- X-axis labels -->
      <text x="0" y="115" text-anchor="middle" font-family="Arial" font-size="8" fill="#64748b">0</text>
      <text x="100" y="115" text-anchor="middle" font-family="Arial" font-size="8" fill="#64748b">r</text>
      <text x="200" y="115" text-anchor="middle" font-family="Arial" font-size="8" fill="#64748b">2r</text>
      <text x="300" y="115" text-anchor="middle" font-family="Arial" font-size="8" fill="#64748b">3r</text>
      <text x="150" y="130" text-anchor="middle" font-family="Arial" font-size="9" fill="#64748b">distance</text>

      <!-- Exponential decay curve: exp(-d/r) -->
      <path d="M 0 0 Q 50 32, 100 63 T 200 87 T 300 95" stroke="#3b82f6" stroke-width="2" fill="none"/>

      <!-- Hard cutoff line at 3r -->
      <line x1="300" y1="0" x2="300" y2="100" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,2"/>
      <rect x="300" y="0" width="50" height="100" fill="#fecaca" opacity="0.3"/>
      <text x="325" y="50" text-anchor="middle" font-family="Arial" font-size="8" fill="#dc2626" transform="rotate(-90, 325, 50)">CUTOFF</text>

      <!-- Key points -->
      <circle cx="0" cy="0" r="4" fill="#3b82f6"/>
      <text x="10" y="-5" font-family="Arial" font-size="8" fill="#3b82f6">1.0</text>

      <circle cx="100" cy="63" r="4" fill="#3b82f6"/>
      <text x="110" y="60" font-family="Arial" font-size="8" fill="#3b82f6">0.37</text>

      <circle cx="200" cy="87" r="4" fill="#3b82f6"/>
      <text x="210" y="84" font-family="Arial" font-size="8" fill="#3b82f6">0.14</text>
    </g>

    <!-- Decay formulas -->
    <g transform="translate(420, 50)">
      <text x="0" y="0" font-family="Arial" font-size="11" fill="#1e40af" font-weight="bold">Decay Functions:</text>

      <rect x="0" y="15" width="180" height="25" rx="4" fill="#dbeafe"/>
      <text x="10" y="32" font-family="monospace" font-size="10" fill="#1e40af">Exponential: e^(-d/r)</text>

      <rect x="0" y="48" width="180" height="25" rx="4" fill="#dcfce7"/>
      <text x="10" y="65" font-family="monospace" font-size="10" fill="#166534">Linear: max(0, 1-d/r)</text>

      <rect x="0" y="81" width="180" height="25" rx="4" fill="#fef3c7"/>
      <text x="10" y="98" font-family="monospace" font-size="10" fill="#b45309">Gaussian: e^(-(d/r)²)</text>
    </g>

    <!-- The Key Insight -->
    <g transform="translate(620, 50)">
      <rect x="0" y="0" width="200" height="115" rx="8" fill="#7c3aed" opacity="0.1"/>
      <text x="100" y="20" text-anchor="middle" font-family="Arial" font-size="11" fill="#581c87" font-weight="bold">THE KEY INSIGHT</text>

      <text x="10" y="45" font-family="Arial" font-size="9" fill="#7c3aed">Hard cutoff at 3×radius</text>
      <text x="10" y="60" font-family="Arial" font-size="9" fill="#7c3aed">makes weights = 0</text>

      <text x="10" y="85" font-family="Arial" font-size="9" fill="#7c3aed">Softmax only computes</text>
      <text x="10" y="100" font-family="Arial" font-size="9" fill="#581c87" font-weight="bold">over ~k non-zero values!</text>
    </g>

    <!-- Bottom formula -->
    <g transform="translate(50, 150)">
      <rect x="0" y="0" width="740" height="30" rx="4" fill="#f3e8ff"/>
      <text x="370" y="20" text-anchor="middle" font-family="Arial" font-size="11" fill="#581c87" font-weight="bold">Combined Score = (Q·K^T / √d) × Spatial_Mask → Softmax over ~k neighbors → O(k) complexity!</text>
    </g>
  </g>
</svg>
