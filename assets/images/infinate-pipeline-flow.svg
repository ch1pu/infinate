<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550">
  <defs>
    <linearGradient id="bgPipe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdf4"/>
      <stop offset="100%" style="stop-color:#dcfce7"/>
    </linearGradient>
    <filter id="shadowPipe" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrowPipe" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#6366f1"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#22c55e"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="550" fill="url(#bgPipe)"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial" font-size="20" fill="#166534" font-weight="bold">INFINATE Pipeline: From Source Code to Spatial Memory</text>
  <text x="450" y="50" text-anchor="middle" font-family="Arial" font-size="12" fill="#22c55e">How text becomes queryable 3D spatial tokens</text>

  <!-- Step 1: Source Code -->
  <g transform="translate(30, 75)">
    <rect x="0" y="0" width="180" height="120" rx="10" fill="white" filter="url(#shadowPipe)"/>
    <rect x="0" y="0" width="180" height="30" rx="10" fill="#3b82f6"/>
    <rect x="0" y="20" width="180" height="10" fill="#3b82f6"/>
    <text x="90" y="21" text-anchor="middle" font-family="Arial" font-size="11" fill="white" font-weight="bold">1. Source Code</text>

    <text x="15" y="50" font-family="monospace" font-size="9" fill="#64748b">auth/login.py:50</text>
    <text x="15" y="65" font-family="monospace" font-size="9" fill="#1e40af">def login(user):</text>
    <text x="15" y="80" font-family="monospace" font-size="9" fill="#64748b">    ...</text>

    <text x="15" y="100" font-family="monospace" font-size="9" fill="#64748b">db/query.py:200</text>
    <text x="15" y="115" font-family="monospace" font-size="9" fill="#1e40af">def query(sql):</text>
  </g>

  <!-- Arrow 1→2 -->
  <line x1="215" y1="135" x2="255" y2="135" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowPipe)"/>

  <!-- Step 2: Split into two paths -->
  <g transform="translate(265, 75)">
    <rect x="0" y="0" width="160" height="120" rx="10" fill="white" filter="url(#shadowPipe)"/>
    <rect x="0" y="0" width="160" height="30" rx="10" fill="#8b5cf6"/>
    <rect x="0" y="20" width="160" height="10" fill="#8b5cf6"/>
    <text x="80" y="21" text-anchor="middle" font-family="Arial" font-size="11" fill="white" font-weight="bold">2. Extract Two Things</text>

    <!-- Text content -->
    <rect x="10" y="40" width="60" height="35" rx="4" fill="#dbeafe"/>
    <text x="40" y="55" text-anchor="middle" font-family="Arial" font-size="9" fill="#1e40af" font-weight="bold">Text</text>
    <text x="40" y="68" text-anchor="middle" font-family="Arial" font-size="8" fill="#3b82f6">"def login"</text>

    <!-- Position -->
    <rect x="90" y="40" width="60" height="35" rx="4" fill="#fef3c7"/>
    <text x="120" y="55" text-anchor="middle" font-family="Arial" font-size="9" fill="#b45309" font-weight="bold">Position</text>
    <text x="120" y="68" text-anchor="middle" font-family="Arial" font-size="8" fill="#f59e0b">(100,50,25)</text>

    <text x="80" y="95" text-anchor="middle" font-family="Arial" font-size="8" fill="#64748b">file → X</text>
    <text x="80" y="107" text-anchor="middle" font-family="Arial" font-size="8" fill="#64748b">class/func → Y</text>
    <text x="80" y="119" text-anchor="middle" font-family="Arial" font-size="8" fill="#64748b">line/depth → Z</text>
  </g>

  <!-- Split arrows for two paths -->
  <path d="M 430 110 L 460 110 L 460 80 L 490 80" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrowPipe)"/>
  <path d="M 430 160 L 460 160 L 460 190 L 490 190" stroke="#f59e0b" stroke-width="2" fill="none"/>
  <polygon points="490,185 500,190 490,195" fill="#f59e0b"/>

  <!-- Step 3a: Embedding Model -->
  <g transform="translate(505, 45)">
    <rect x="0" y="0" width="150" height="70" rx="10" fill="white" filter="url(#shadowPipe)"/>
    <rect x="0" y="0" width="150" height="25" rx="10" fill="#3b82f6"/>
    <rect x="0" y="15" width="150" height="10" fill="#3b82f6"/>
    <text x="75" y="18" text-anchor="middle" font-family="Arial" font-size="10" fill="white" font-weight="bold">3a. Embedding Model</text>

    <text x="75" y="45" text-anchor="middle" font-family="Arial" font-size="9" fill="#64748b">Text → 768D vector</text>
    <text x="75" y="60" text-anchor="middle" font-family="Arial" font-size="8" fill="#3b82f6">(semantic meaning)</text>
  </g>

  <!-- Step 3b: Spatial Encoding -->
  <g transform="translate(505, 155)">
    <rect x="0" y="0" width="150" height="70" rx="10" fill="white" filter="url(#shadowPipe)"/>
    <rect x="0" y="0" width="150" height="25" rx="10" fill="#f59e0b"/>
    <rect x="0" y="15" width="150" height="10" fill="#f59e0b"/>
    <text x="75" y="18" text-anchor="middle" font-family="Arial" font-size="10" fill="white" font-weight="bold">3b. Spatial Encoding</text>

    <text x="75" y="45" text-anchor="middle" font-family="Arial" font-size="9" fill="#64748b">(x,y,z) → 768D vector</text>
    <text x="75" y="60" text-anchor="middle" font-family="Arial" font-size="8" fill="#f59e0b">(position awareness)</text>
  </g>

  <!-- Merge arrows -->
  <path d="M 660 80 L 690 80 L 690 135 L 720 135" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrowPipe)"/>
  <path d="M 660 190 L 690 190 L 690 135 L 715 135" stroke="#f59e0b" stroke-width="2" fill="none"/>

  <!-- Step 4: SpatialToken -->
  <g transform="translate(725, 70)">
    <rect x="0" y="0" width="150" height="130" rx="10" fill="white" filter="url(#shadowPipe)"/>
    <rect x="0" y="0" width="150" height="25" rx="10" fill="#22c55e"/>
    <rect x="0" y="15" width="150" height="10" fill="#22c55e"/>
    <text x="75" y="18" text-anchor="middle" font-family="Arial" font-size="10" fill="white" font-weight="bold">4. SpatialToken</text>

    <text x="15" y="42" font-family="monospace" font-size="8" fill="#64748b">token_id:</text>
    <text x="75" y="42" font-family="monospace" font-size="8" fill="#1e40af">42</text>

    <text x="15" y="57" font-family="monospace" font-size="8" fill="#64748b">position:</text>
    <text x="75" y="57" font-family="monospace" font-size="8" fill="#f59e0b">(100,50,25)</text>

    <text x="15" y="72" font-family="monospace" font-size="8" fill="#64748b">embedding:</text>
    <rect x="75" y="63" width="60" height="12" rx="2" fill="#3b82f6" opacity="0.3"/>
    <text x="105" y="72" text-anchor="middle" font-family="monospace" font-size="7" fill="#3b82f6">768D</text>

    <text x="15" y="87" font-family="monospace" font-size="8" fill="#64748b">spatial_enc:</text>
    <rect x="75" y="78" width="60" height="12" rx="2" fill="#f59e0b" opacity="0.3"/>
    <text x="105" y="87" text-anchor="middle" font-family="monospace" font-size="7" fill="#f59e0b">768D</text>

    <line x1="15" y1="95" x2="135" y2="95" stroke="#e2e8f0" stroke-width="1"/>

    <text x="15" y="110" font-family="monospace" font-size="8" fill="#166534" font-weight="bold">full_embedding:</text>
    <rect x="15" y="115" width="120" height="12" rx="2" fill="#22c55e" opacity="0.3"/>
    <text x="75" y="124" text-anchor="middle" font-family="monospace" font-size="7" fill="#22c55e">768D (semantic + spatial)</text>
  </g>

  <!-- BOTTOM SECTION: Vector Store and Query -->

  <!-- Arrow down to vector store -->
  <line x1="800" y1="205" x2="800" y2="245" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Step 5: Vector Store -->
  <g transform="translate(30, 270)">
    <rect x="0" y="0" width="840" height="100" rx="12" fill="white" filter="url(#shadowPipe)"/>
    <rect x="0" y="0" width="840" height="30" rx="12" fill="#6366f1"/>
    <rect x="0" y="20" width="840" height="10" fill="#6366f1"/>
    <text x="420" y="21" text-anchor="middle" font-family="Arial" font-size="12" fill="white" font-weight="bold">5. Vector Store (Qdrant) - Spatial Memory</text>

    <!-- Multiple tokens stored -->
    <g transform="translate(30, 45)">
      <rect x="0" y="0" width="120" height="45" rx="6" fill="#3b82f6" opacity="0.2"/>
      <text x="60" y="15" text-anchor="middle" font-family="monospace" font-size="8" fill="#1e40af">"login" @ (100,50,25)</text>
      <circle cx="60" cy="35" r="4" fill="#3b82f6"/>
    </g>

    <g transform="translate(170, 45)">
      <rect x="0" y="0" width="120" height="45" rx="6" fill="#8b5cf6" opacity="0.2"/>
      <text x="60" y="15" text-anchor="middle" font-family="monospace" font-size="8" fill="#6d28d9">"query" @ (500,150,80)</text>
      <circle cx="60" cy="35" r="4" fill="#8b5cf6"/>
    </g>

    <g transform="translate(310, 45)">
      <rect x="0" y="0" width="120" height="45" rx="6" fill="#22c55e" opacity="0.2"/>
      <text x="60" y="15" text-anchor="middle" font-family="monospace" font-size="8" fill="#166534">"user" @ (105,55,30)</text>
      <circle cx="60" cy="35" r="4" fill="#22c55e"/>
    </g>

    <g transform="translate(450, 45)">
      <rect x="0" y="0" width="120" height="45" rx="6" fill="#f59e0b" opacity="0.2"/>
      <text x="60" y="15" text-anchor="middle" font-family="monospace" font-size="8" fill="#b45309">"password" @ (110,52,28)</text>
      <circle cx="60" cy="35" r="4" fill="#f59e0b"/>
    </g>

    <g transform="translate(590, 45)">
      <rect x="0" y="0" width="120" height="45" rx="6" fill="#ef4444" opacity="0.2"/>
      <text x="60" y="15" text-anchor="middle" font-family="monospace" font-size="8" fill="#dc2626">"validate" @ (108,48,26)</text>
      <circle cx="60" cy="35" r="4" fill="#ef4444"/>
    </g>

    <g transform="translate(730, 45)">
      <text x="40" y="20" text-anchor="middle" font-family="Arial" font-size="9" fill="#64748b">millions</text>
      <text x="40" y="32" text-anchor="middle" font-family="Arial" font-size="9" fill="#64748b">more...</text>
    </g>
  </g>

  <!-- Step 6: Query with O(k) -->
  <g transform="translate(30, 390)">
    <rect x="0" y="0" width="400" height="140" rx="12" fill="white" filter="url(#shadowPipe)"/>
    <rect x="0" y="0" width="400" height="30" rx="12" fill="#ef4444"/>
    <rect x="0" y="20" width="400" height="10" fill="#ef4444"/>
    <text x="200" y="21" text-anchor="middle" font-family="Arial" font-size="12" fill="white" font-weight="bold">6. Query: "How does authentication work?"</text>

    <!-- Query process -->
    <text x="20" y="55" font-family="Arial" font-size="10" fill="#1e40af" font-weight="bold">Traditional RAG (O(n²)):</text>
    <text x="20" y="72" font-family="Arial" font-size="9" fill="#64748b">Compare query to ALL tokens → slow, expensive</text>

    <text x="20" y="95" font-family="Arial" font-size="10" fill="#22c55e" font-weight="bold">INFINATE (O(k)):</text>
    <text x="20" y="112" font-family="Arial" font-size="9" fill="#64748b">1. Find query position: (100, 50, 25) - auth area</text>
    <text x="20" y="127" font-family="Arial" font-size="9" fill="#64748b">2. Only check k=50 nearest neighbors</text>
    <text x="295" y="120" font-family="Arial" font-size="11" fill="#22c55e" font-weight="bold">10,317× faster!</text>
  </g>

  <!-- Step 7: Results -->
  <g transform="translate(470, 390)">
    <rect x="0" y="0" width="400" height="140" rx="12" fill="white" filter="url(#shadowPipe)"/>
    <rect x="0" y="0" width="400" height="30" rx="12" fill="#22c55e"/>
    <rect x="0" y="20" width="400" height="10" fill="#22c55e"/>
    <text x="200" y="21" text-anchor="middle" font-family="Arial" font-size="12" fill="white" font-weight="bold">7. Results: Spatially Relevant Context</text>

    <!-- Results showing nearby tokens -->
    <text x="20" y="50" font-family="Arial" font-size="9" fill="#64748b">Found nearby tokens (same auth area):</text>

    <rect x="20" y="58" width="170" height="22" rx="4" fill="#3b82f6" opacity="0.2"/>
    <text x="105" y="73" text-anchor="middle" font-family="monospace" font-size="8" fill="#1e40af">"login" @ (100,50,25) ✓</text>

    <rect x="200" y="58" width="180" height="22" rx="4" fill="#22c55e" opacity="0.2"/>
    <text x="290" y="73" text-anchor="middle" font-family="monospace" font-size="8" fill="#166534">"user" @ (105,55,30) ✓</text>

    <rect x="20" y="85" width="180" height="22" rx="4" fill="#f59e0b" opacity="0.2"/>
    <text x="110" y="100" text-anchor="middle" font-family="monospace" font-size="8" fill="#b45309">"password" @ (110,52,28) ✓</text>

    <rect x="210" y="85" width="170" height="22" rx="4" fill="#ef4444" opacity="0.2"/>
    <text x="295" y="100" text-anchor="middle" font-family="monospace" font-size="8" fill="#dc2626">"validate" @ (108,48,26) ✓</text>

    <text x="20" y="125" font-family="Arial" font-size="9" fill="#64748b">NOT found (too far away):</text>
    <text x="170" y="125" font-family="monospace" font-size="8" fill="#94a3b8">"query" @ (500,150,80) ✗ - database area</text>
  </g>
</svg>
