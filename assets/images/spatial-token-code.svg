<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480">
  <defs>
    <linearGradient id="bgCode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e"/>
      <stop offset="100%" style="stop-color:#181825"/>
    </linearGradient>
    <linearGradient id="gradToken" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#89b4fa"/>
      <stop offset="100%" style="stop-color:#74c7ec"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark code editor background -->
  <rect x="0" y="0" width="900" height="480" fill="url(#bgCode)"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="900" height="35" fill="#313244"/>
  <circle cx="20" cy="17" r="6" fill="#f38ba8"/>
  <circle cx="40" cy="17" r="6" fill="#f9e2af"/>
  <circle cx="60" cy="17" r="6" fill="#a6e3a1"/>
  <text x="450" y="23" text-anchor="middle" font-family="monospace" font-size="12" fill="#cdd6f4">spatial_token.py — SpatialToken Class (M1.1)</text>

  <!-- Left panel: Class Definition -->
  <g transform="translate(20, 50)">
    <text x="0" y="20" font-family="monospace" font-size="11" fill="#cba6f7">@dataclass</text>
    <text x="0" y="38" font-family="monospace" font-size="11" fill="#89b4fa">class</text>
    <text x="40" y="38" font-family="monospace" font-size="11" fill="#f9e2af">SpatialToken</text>
    <text x="135" y="38" font-family="monospace" font-size="11" fill="#cdd6f4">:</text>

    <!-- Attributes -->
    <text x="20" y="65" font-family="monospace" font-size="10" fill="#6c7086"># Attributes</text>

    <text x="20" y="85" font-family="monospace" font-size="11" fill="#f38ba8">token_id</text>
    <text x="85" y="85" font-family="monospace" font-size="11" fill="#cdd6f4">:</text>
    <text x="95" y="85" font-family="monospace" font-size="11" fill="#89b4fa">int</text>

    <text x="20" y="105" font-family="monospace" font-size="11" fill="#f38ba8">position</text>
    <text x="85" y="105" font-family="monospace" font-size="11" fill="#cdd6f4">:</text>
    <text x="95" y="105" font-family="monospace" font-size="11" fill="#89b4fa">tuple</text>
    <text x="130" y="105" font-family="monospace" font-size="11" fill="#cdd6f4">[</text>
    <text x="138" y="105" font-family="monospace" font-size="11" fill="#89b4fa">float, float, float</text>
    <text x="250" y="105" font-family="monospace" font-size="11" fill="#cdd6f4">]</text>

    <text x="20" y="125" font-family="monospace" font-size="11" fill="#f38ba8">embedding</text>
    <text x="95" y="125" font-family="monospace" font-size="11" fill="#cdd6f4">:</text>
    <text x="105" y="125" font-family="monospace" font-size="11" fill="#89b4fa">torch.Tensor</text>

    <text x="20" y="145" font-family="monospace" font-size="11" fill="#f38ba8">spatial_encoding</text>
    <text x="135" y="145" font-family="monospace" font-size="11" fill="#cdd6f4">:</text>
    <text x="145" y="145" font-family="monospace" font-size="11" fill="#89b4fa">torch.Tensor</text>

    <!-- distance_to method -->
    <text x="20" y="175" font-family="monospace" font-size="10" fill="#6c7086"># Methods</text>

    <text x="20" y="195" font-family="monospace" font-size="11" fill="#89b4fa">def</text>
    <text x="45" y="195" font-family="monospace" font-size="11" fill="#a6e3a1">distance_to</text>
    <text x="125" y="195" font-family="monospace" font-size="11" fill="#cdd6f4">(self, other):</text>

    <text x="40" y="215" font-family="monospace" font-size="10" fill="#a6adc8">x1, y1, z1 = self.position</text>
    <text x="40" y="232" font-family="monospace" font-size="10" fill="#a6adc8">x2, y2, z2 = other.position</text>
    <text x="40" y="249" font-family="monospace" font-size="10" fill="#89b4fa">return</text>
    <text x="75" y="249" font-family="monospace" font-size="10" fill="#f9e2af">sqrt</text>
    <text x="100" y="249" font-family="monospace" font-size="10" fill="#cdd6f4">((x2-x1)² + (y2-y1)² + (z2-z1)²)</text>

    <!-- full_embedding property -->
    <text x="20" y="280" font-family="monospace" font-size="11" fill="#cba6f7">@property</text>
    <text x="20" y="298" font-family="monospace" font-size="11" fill="#89b4fa">def</text>
    <text x="45" y="298" font-family="monospace" font-size="11" fill="#a6e3a1">full_embedding</text>
    <text x="140" y="298" font-family="monospace" font-size="11" fill="#cdd6f4">(self):</text>
    <text x="40" y="318" font-family="monospace" font-size="10" fill="#89b4fa">return</text>
    <text x="75" y="318" font-family="monospace" font-size="10" fill="#cdd6f4">self.embedding + self.spatial_encoding</text>
  </g>

  <!-- Right panel: Visual representation -->
  <g transform="translate(480, 50)">
    <!-- Token 1 box -->
    <rect x="0" y="0" width="180" height="140" rx="8" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
    <text x="90" y="22" text-anchor="middle" font-family="monospace" font-size="11" fill="#89b4fa" font-weight="bold">token1</text>

    <text x="15" y="45" font-family="monospace" font-size="9" fill="#6c7086">token_id:</text>
    <text x="80" y="45" font-family="monospace" font-size="9" fill="#fab387">42</text>

    <text x="15" y="63" font-family="monospace" font-size="9" fill="#6c7086">position:</text>
    <text x="80" y="63" font-family="monospace" font-size="9" fill="#a6e3a1">(0, 0, 0)</text>

    <text x="15" y="81" font-family="monospace" font-size="9" fill="#6c7086">embedding:</text>
    <rect x="80" y="70" width="85" height="14" rx="2" fill="#cba6f7" opacity="0.3"/>
    <text x="122" y="81" text-anchor="middle" font-family="monospace" font-size="8" fill="#cba6f7">768D tensor</text>

    <text x="15" y="99" font-family="monospace" font-size="9" fill="#6c7086">spatial_enc:</text>
    <rect x="80" y="88" width="85" height="14" rx="2" fill="#f9e2af" opacity="0.3"/>
    <text x="122" y="99" text-anchor="middle" font-family="monospace" font-size="8" fill="#f9e2af">768D tensor</text>

    <line x1="15" y1="110" x2="165" y2="110" stroke="#45475a" stroke-width="1"/>
    <text x="15" y="125" font-family="monospace" font-size="9" fill="#6c7086">full_emb:</text>
    <rect x="80" y="114" width="85" height="14" rx="2" fill="#a6e3a1" opacity="0.3"/>
    <text x="122" y="125" text-anchor="middle" font-family="monospace" font-size="8" fill="#a6e3a1">768D (sum)</text>

    <!-- Token 2 box -->
    <rect x="220" y="0" width="180" height="140" rx="8" fill="#313244" stroke="#f38ba8" stroke-width="2"/>
    <text x="310" y="22" text-anchor="middle" font-family="monospace" font-size="11" fill="#f38ba8" font-weight="bold">token2</text>

    <text x="235" y="45" font-family="monospace" font-size="9" fill="#6c7086">token_id:</text>
    <text x="300" y="45" font-family="monospace" font-size="9" fill="#fab387">99</text>

    <text x="235" y="63" font-family="monospace" font-size="9" fill="#6c7086">position:</text>
    <text x="300" y="63" font-family="monospace" font-size="9" fill="#a6e3a1">(3, 4, 0)</text>

    <text x="235" y="81" font-family="monospace" font-size="9" fill="#6c7086">embedding:</text>
    <rect x="300" y="70" width="85" height="14" rx="2" fill="#cba6f7" opacity="0.3"/>
    <text x="342" y="81" text-anchor="middle" font-family="monospace" font-size="8" fill="#cba6f7">768D tensor</text>

    <text x="235" y="99" font-family="monospace" font-size="9" fill="#6c7086">spatial_enc:</text>
    <rect x="300" y="88" width="85" height="14" rx="2" fill="#f9e2af" opacity="0.3"/>
    <text x="342" y="99" text-anchor="middle" font-family="monospace" font-size="8" fill="#f9e2af">768D tensor</text>

    <line x1="235" y1="110" x2="385" y2="110" stroke="#45475a" stroke-width="1"/>
    <text x="235" y="125" font-family="monospace" font-size="9" fill="#6c7086">full_emb:</text>
    <rect x="300" y="114" width="85" height="14" rx="2" fill="#a6e3a1" opacity="0.3"/>
    <text x="342" y="125" text-anchor="middle" font-family="monospace" font-size="8" fill="#a6e3a1">768D (sum)</text>

    <!-- Distance calculation visualization: 3-4-5 triangle -->
    <g transform="translate(50, 170)">
      <text x="150" y="0" text-anchor="middle" font-family="monospace" font-size="11" fill="#f9e2af" font-weight="bold">distance_to() → 3-4-5 Triangle</text>

      <!-- Coordinate grid -->
      <rect x="20" y="20" width="260" height="160" rx="4" fill="#1e1e2e" stroke="#45475a" stroke-width="1"/>

      <!-- Grid lines -->
      <line x1="20" y1="180" x2="280" y2="180" stroke="#313244" stroke-width="1"/>
      <line x1="20" y1="20" x2="20" y2="180" stroke="#313244" stroke-width="1"/>

      <!-- X axis labels -->
      <text x="20" y="195" font-family="monospace" font-size="8" fill="#6c7086">0</text>
      <text x="105" y="195" font-family="monospace" font-size="8" fill="#6c7086">1</text>
      <text x="190" y="195" font-family="monospace" font-size="8" fill="#6c7086">2</text>
      <text x="275" y="195" font-family="monospace" font-size="8" fill="#6c7086">3</text>

      <!-- Y axis labels -->
      <text x="8" y="180" font-family="monospace" font-size="8" fill="#6c7086">0</text>
      <text x="8" y="140" font-family="monospace" font-size="8" fill="#6c7086">1</text>
      <text x="8" y="100" font-family="monospace" font-size="8" fill="#6c7086">2</text>
      <text x="8" y="60" font-family="monospace" font-size="8" fill="#6c7086">3</text>
      <text x="8" y="25" font-family="monospace" font-size="8" fill="#6c7086">4</text>

      <!-- Triangle sides -->
      <!-- Horizontal: x = 3 -->
      <line x1="20" y1="180" x2="280" y2="180" stroke="#89b4fa" stroke-width="2" stroke-dasharray="5,3"/>
      <text x="150" y="175" text-anchor="middle" font-family="monospace" font-size="10" fill="#89b4fa">x = 3</text>

      <!-- Vertical: y = 4 -->
      <line x1="280" y1="180" x2="280" y2="20" stroke="#f38ba8" stroke-width="2" stroke-dasharray="5,3"/>
      <text x="295" y="100" font-family="monospace" font-size="10" fill="#f38ba8">y = 4</text>

      <!-- Hypotenuse: d = 5 -->
      <line x1="20" y1="180" x2="280" y2="20" stroke="#a6e3a1" stroke-width="3" filter="url(#glow)"/>
      <text x="130" y="85" font-family="monospace" font-size="12" fill="#a6e3a1" font-weight="bold">d = 5.0</text>

      <!-- Points -->
      <circle cx="20" cy="180" r="8" fill="#89b4fa" stroke="#cdd6f4" stroke-width="2"/>
      <text x="35" y="170" font-family="monospace" font-size="9" fill="#89b4fa">(0,0,0)</text>

      <circle cx="280" cy="20" r="8" fill="#f38ba8" stroke="#cdd6f4" stroke-width="2"/>
      <text x="240" y="40" font-family="monospace" font-size="9" fill="#f38ba8">(3,4,0)</text>
    </g>

    <!-- Formula box -->
    <g transform="translate(50, 395)">
      <rect x="0" y="0" width="300" height="35" rx="4" fill="#313244" stroke="#a6e3a1" stroke-width="1"/>
      <text x="150" y="15" text-anchor="middle" font-family="monospace" font-size="10" fill="#6c7086">sqrt((3-0)² + (4-0)² + (0-0)²)</text>
      <text x="150" y="28" text-anchor="middle" font-family="monospace" font-size="10" fill="#a6e3a1">= sqrt(9 + 16 + 0) = sqrt(25) = 5.0</text>
    </g>
  </g>

  <!-- Bottom: Test coverage badge -->
  <g transform="translate(20, 445)">
    <rect x="0" y="0" width="160" height="25" rx="4" fill="#313244"/>
    <text x="10" y="17" font-family="monospace" font-size="10" fill="#a6e3a1">✓ 8 tests passing</text>
  </g>

  <g transform="translate(190, 445)">
    <rect x="0" y="0" width="120" height="25" rx="4" fill="#313244"/>
    <text x="10" y="17" font-family="monospace" font-size="10" fill="#89b4fa">100% coverage</text>
  </g>

  <g transform="translate(320, 445)">
    <rect x="0" y="0" width="180" height="25" rx="4" fill="#313244"/>
    <text x="10" y="17" font-family="monospace" font-size="10" fill="#f9e2af">&lt;1ms for 1000 tokens</text>
  </g>
</svg>
