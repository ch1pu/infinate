<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420">
  <defs>
    <linearGradient id="bgEnc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#faf5ff"/>
      <stop offset="100%" style="stop-color:#f3e8ff"/>
    </linearGradient>
    <linearGradient id="waveGradX" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
    <linearGradient id="waveGradY" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#4ade80"/>
    </linearGradient>
    <linearGradient id="waveGradZ" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
    <filter id="shadowEnc" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="420" fill="url(#bgEnc)"/>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-family="Arial" font-size="20" fill="#581c87" font-weight="bold">Spatial Encoding: Turning 3D Positions into Rich Representations</text>
  <text x="450" y="52" text-anchor="middle" font-family="Arial" font-size="12" fill="#7c3aed">Extending transformer positional encoding from 1D sequences to 3D space</text>

  <!-- Left: Input Position -->
  <g transform="translate(30, 75)">
    <rect x="0" y="0" width="160" height="140" rx="12" fill="white" filter="url(#shadowEnc)"/>
    <rect x="0" y="0" width="160" height="35" rx="12" fill="#7c3aed"/>
    <rect x="0" y="22" width="160" height="13" fill="#7c3aed"/>
    <text x="80" y="24" text-anchor="middle" font-family="Arial" font-size="12" fill="white" font-weight="bold">3D Position</text>

    <!-- Coordinate display -->
    <text x="80" y="60" text-anchor="middle" font-family="monospace" font-size="11" fill="#3b82f6" font-weight="bold">X = 100.0</text>
    <text x="80" y="80" text-anchor="middle" font-family="monospace" font-size="11" fill="#22c55e" font-weight="bold">Y = 50.0</text>
    <text x="80" y="100" text-anchor="middle" font-family="monospace" font-size="11" fill="#f59e0b" font-weight="bold">Z = 25.0</text>

    <text x="80" y="125" text-anchor="middle" font-family="Arial" font-size="10" fill="#64748b">Just 3 numbers</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(200, 135)">
    <polygon points="0,12 20,0 20,8 50,8 50,16 20,16 20,24" fill="#7c3aed"/>
  </g>

  <!-- Middle: The Encoding Process -->
  <g transform="translate(260, 75)">
    <rect x="0" y="0" width="350" height="140" rx="12" fill="white" filter="url(#shadowEnc)"/>
    <rect x="0" y="0" width="350" height="35" rx="12" fill="#8b5cf6"/>
    <rect x="0" y="22" width="350" height="13" fill="#8b5cf6"/>
    <text x="175" y="24" text-anchor="middle" font-family="Arial" font-size="12" fill="white" font-weight="bold">Sinusoidal Encoding (per dimension)</text>

    <!-- X encoding -->
    <g transform="translate(20, 45)">
      <rect x="0" y="0" width="95" height="35" rx="4" fill="#dbeafe"/>
      <text x="47" y="14" text-anchor="middle" font-family="Arial" font-size="9" fill="#1e40af" font-weight="bold">X → 256D</text>
      <text x="47" y="28" text-anchor="middle" font-family="monospace" font-size="8" fill="#3b82f6">sin + cos</text>
    </g>

    <!-- Y encoding -->
    <g transform="translate(125, 45)">
      <rect x="0" y="0" width="95" height="35" rx="4" fill="#dcfce7"/>
      <text x="47" y="14" text-anchor="middle" font-family="Arial" font-size="9" fill="#166534" font-weight="bold">Y → 256D</text>
      <text x="47" y="28" text-anchor="middle" font-family="monospace" font-size="8" fill="#22c55e">sin + cos</text>
    </g>

    <!-- Z encoding -->
    <g transform="translate(230, 45)">
      <rect x="0" y="0" width="95" height="35" rx="4" fill="#fef3c7"/>
      <text x="47" y="14" text-anchor="middle" font-family="Arial" font-size="9" fill="#b45309" font-weight="bold">Z → 256D</text>
      <text x="47" y="28" text-anchor="middle" font-family="monospace" font-size="8" fill="#f59e0b">sin + cos</text>
    </g>

    <!-- Concatenate -->
    <text x="175" y="100" text-anchor="middle" font-family="Arial" font-size="10" fill="#64748b">Concatenate all dimensions:</text>
    <text x="175" y="118" text-anchor="middle" font-family="monospace" font-size="10" fill="#7c3aed" font-weight="bold">256 + 256 + 256 = 768D</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(620, 135)">
    <polygon points="0,12 20,0 20,8 50,8 50,16 20,16 20,24" fill="#7c3aed"/>
  </g>

  <!-- Right: Output Encoding -->
  <g transform="translate(680, 75)">
    <rect x="0" y="0" width="190" height="140" rx="12" fill="white" filter="url(#shadowEnc)"/>
    <rect x="0" y="0" width="190" height="35" rx="12" fill="#22c55e"/>
    <rect x="0" y="22" width="190" height="13" fill="#22c55e"/>
    <text x="95" y="24" text-anchor="middle" font-family="Arial" font-size="12" fill="white" font-weight="bold">768D Encoding</text>

    <!-- Vector visualization -->
    <rect x="20" y="50" width="150" height="20" rx="4" fill="#3b82f6" opacity="0.7"/>
    <rect x="20" y="72" width="150" height="20" rx="4" fill="#22c55e" opacity="0.7"/>
    <rect x="20" y="94" width="150" height="20" rx="4" fill="#f59e0b" opacity="0.7"/>

    <text x="95" y="64" text-anchor="middle" font-family="monospace" font-size="8" fill="white">X features (256)</text>
    <text x="95" y="86" text-anchor="middle" font-family="monospace" font-size="8" fill="white">Y features (256)</text>
    <text x="95" y="108" text-anchor="middle" font-family="monospace" font-size="8" fill="white">Z features (256)</text>

    <text x="95" y="130" text-anchor="middle" font-family="Arial" font-size="10" fill="#64748b">Rich representation!</text>
  </g>

  <!-- Bottom: Frequency Visualization -->
  <g transform="translate(30, 235)">
    <rect x="0" y="0" width="840" height="165" rx="12" fill="white" filter="url(#shadowEnc)"/>
    <text x="420" y="25" text-anchor="middle" font-family="Arial" font-size="14" fill="#581c87" font-weight="bold">Why Sinusoidal? Multi-Scale Position Awareness</text>

    <!-- High frequency wave -->
    <g transform="translate(40, 45)">
      <text x="0" y="12" font-family="Arial" font-size="10" fill="#1e40af" font-weight="bold">High Frequency:</text>
      <text x="110" y="12" font-family="Arial" font-size="9" fill="#64748b">Fine detail (nearby differences)</text>

      <!-- Wave path - high freq -->
      <path d="M 0 35 Q 10 20, 20 35 T 40 35 T 60 35 T 80 35 T 100 35 T 120 35 T 140 35 T 160 35 T 180 35 T 200 35"
            stroke="#3b82f6" stroke-width="2" fill="none"/>
      <line x1="0" y1="35" x2="200" y2="35" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2,2"/>
    </g>

    <!-- Medium frequency wave -->
    <g transform="translate(300, 45)">
      <text x="0" y="12" font-family="Arial" font-size="10" fill="#22c55e" font-weight="bold">Medium Frequency:</text>
      <text x="130" y="12" font-family="Arial" font-size="9" fill="#64748b">Local structure</text>

      <!-- Wave path - medium freq -->
      <path d="M 0 35 Q 25 15, 50 35 T 100 35 T 150 35 T 200 35"
            stroke="#22c55e" stroke-width="2" fill="none"/>
      <line x1="0" y1="35" x2="200" y2="35" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2,2"/>
    </g>

    <!-- Low frequency wave -->
    <g transform="translate(560, 45)">
      <text x="0" y="12" font-family="Arial" font-size="10" fill="#f59e0b" font-weight="bold">Low Frequency:</text>
      <text x="105" y="12" font-family="Arial" font-size="9" fill="#64748b">Coarse structure (far apart)</text>

      <!-- Wave path - low freq -->
      <path d="M 0 35 Q 50 10, 100 35 T 200 35"
            stroke="#f59e0b" stroke-width="2" fill="none"/>
      <line x1="0" y1="35" x2="200" y2="35" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2,2"/>
    </g>

    <!-- Key insight box -->
    <g transform="translate(40, 100)">
      <rect x="0" y="0" width="760" height="50" rx="8" fill="#7c3aed" opacity="0.1"/>
      <text x="380" y="20" text-anchor="middle" font-family="Arial" font-size="11" fill="#581c87" font-weight="bold">Key Insight: Different frequencies capture different scales of position</text>
      <text x="380" y="38" text-anchor="middle" font-family="Arial" font-size="10" fill="#7c3aed">High freq distinguishes (100, 50, 25) from (100, 51, 25) • Low freq distinguishes (100, 50, 25) from (500, 200, 100)</text>
    </g>
  </g>
</svg>
