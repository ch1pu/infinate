      <text x="105" y="18" text-anchor="middle" font-family="Arial" font-size="10" fill="#89b4fa" font-weight="bold">TransformerBridge</text>

      <!-- Inner components -->
      <rect x="15" y="30" width="85" height="35" rx="4" fill="#45475a"/>
      <text x="57" y="45" text-anchor="middle" font-family="Arial" font-size="9" fill="#a6e3a1">Spatial</text>
      <text x="57" y="58" text-anchor="middle" font-family="Arial" font-size="9" fill="#a6e3a1">Transformer</text>

      <rect x="110" y="30" width="85" height="35" rx="4" fill="#45475a"/>
      <text x="152" y="45" text-anchor="middle" font-family="Arial" font-size="9" fill="#f9e2af">Context</text>
      <text x="152" y="58" text-anchor="middle" font-family="Arial" font-size="9" fill="#f9e2af">Manager</text>

      <!-- Arrow from ContextManager to VectorStore -->
      <line x1="152" y1="70" x2="152" y2="90" stroke="#f9e2af" stroke-width="1.5"/>
      <polygon points="152,95 148,90 156,90" fill="#f9e2af"/>

      <rect x="110" y="100" width="85" height="30" rx="4" fill="#45475a"/>
      <text x="152" y="120" text-anchor="middle" font-family="Arial" font-size="9" fill="#f38ba8">VectorStore</text>
    </g>

    <!-- Arrow down from bridge -->
    <line x1="115" y1="270" x2="115" y2="300" stroke="#89b4fa" stroke-width="2"/>
    <polygon points="115,305 110,300 120,300" fill="#89b4fa"/>

    <!-- Output -->
    <g transform="translate(65, 310)">
      <rect x="0" y="0" width="100" height="40" rx="6" fill="#45475a"/>
      <text x="50" y="18" text-anchor="middle" font-family="Arial" font-size="10" fill="#a6e3a1" font-weight="bold">Output</text>
      <text x="50" y="32" text-anchor="middle" font-family="monospace" font-size="9" fill="#a6adc8">O(k) tensor</text>
    </g>

    <!-- Right side: O(k) verification -->
    <g transform="translate(240, 50)">
      <rect x="0" y="0" width="200" height="240" rx="6" fill="#1e1e2e" stroke="#a6e3a1" stroke-width="2"/>
      <text x="100" y="20" text-anchor="middle" font-family="Arial" font-size="10" fill="#a6e3a1" font-weight="bold">O(k) Verified</text>

      <text x="15" y="45" font-family="monospace" font-size="10" fill="#cdd6f4">Context:   Time:</text>
      <text x="15" y="65" font-family="monospace" font-size="10" fill="#cdd6f4">  1000  → 11.82ms</text>
      <text x="15" y="85" font-family="monospace" font-size="10" fill="#cdd6f4">  2000  → 12.96ms</text>
      <text x="15" y="105" font-family="monospace" font-size="10" fill="#cdd6f4">  4000  → 12.61ms</text>

      <line x1="10" y1="120" x2="190" y2="120" stroke="#45475a"/>

      <text x="15" y="145" font-family="Arial" font-size="10" fill="#f38ba8">If O(n²):</text>
      <text x="15" y="165" font-family="monospace" font-size="10" fill="#f38ba8">2x → 4x time ✗</text>
      <text x="15" y="185" font-family="monospace" font-size="10" fill="#f38ba8">4x → 16x time ✗</text>

      <text x="15" y="210" font-family="Arial" font-size="10" fill="#a6e3a1">Actual O(k):</text>
      <text x="15" y="230" font-family="monospace" font-size="10" fill="#a6e3a1">2x → 1.1x time ✓</text>
    </g>
  </g>

