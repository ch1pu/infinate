      <text x="72" y="24" text-anchor="middle" font-family="Arial" font-size="11" fill="#a6e3a1">TOTAL</text>
      <text x="72" y="50" text-anchor="middle" font-family="monospace" font-size="18" fill="#a6e3a1" font-weight="bold">23/23 ✓</text>
