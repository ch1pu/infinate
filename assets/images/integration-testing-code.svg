      <text x="65" y="20" text-anchor="middle" font-family="Arial" font-size="10" fill="#a6e3a1">TOTAL</text>
      <text x="65" y="40" text-anchor="middle" font-family="monospace" font-size="16" fill="#a6e3a1" font-weight="bold">23/23 ✓</text>
    </g>
  </g>

  <!-- Footer: Performance stats -->
  <g transform="translate(20, 555)">
    <rect x="0" y="0" width="180" height="30" rx="4" fill="#45475a"/>
    <text x="90" y="20" text-anchor="middle" font-family="monospace" font-size="11" fill="#a6e3a1">✓ 23 tests passing</text>
  </g>

  <g transform="translate(210, 555)">
    <rect x="0" y="0" width="180" height="30" rx="4" fill="#45475a"/>
    <text x="90" y="20" text-anchor="middle" font-family="monospace" font-size="11" fill="#f9e2af">72% module coverage</text>
  </g>

  <g transform="translate(400, 555)">
    <rect x="0" y="0" width="180" height="30" rx="4" fill="#45475a"/>
    <text x="90" y="20" text-anchor="middle" font-family="monospace" font-size="11" fill="#89b4fa">12,161 tokens/sec</text>
