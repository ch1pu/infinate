    <rect x="0" y="0" width="200" height="35" rx="4" fill="#45475a"/>
    <text x="100" y="23" text-anchor="middle" font-family="monospace" font-size="12" fill="#a6e3a1">✓ 23 tests passing</text>
  </g>

  <g transform="translate(235, 645)">
    <rect x="0" y="0" width="200" height="35" rx="4" fill="#45475a"/>
    <text x="100" y="23" text-anchor="middle" font-family="monospace" font-size="12" fill="#f9e2af">72% module coverage</text>
