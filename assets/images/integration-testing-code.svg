      <text x="120" y="20" text-anchor="middle" font-family="Arial" font-size="11" fill="#89b4fa" font-weight="bold">TransformerBridge</text>

      <!-- Inner components -->
      <rect x="15" y="35" width="100" height="40" rx="4" fill="#45475a"/>
      <text x="65" y="52" text-anchor="middle" font-family="Arial" font-size="10" fill="#a6e3a1">Spatial</text>
      <text x="65" y="66" text-anchor="middle" font-family="Arial" font-size="10" fill="#a6e3a1">Transformer</text>

      <rect x="125" y="35" width="100" height="40" rx="4" fill="#45475a"/>
      <text x="175" y="52" text-anchor="middle" font-family="Arial" font-size="10" fill="#f9e2af">Context</text>
      <text x="175" y="66" text-anchor="middle" font-family="Arial" font-size="10" fill="#f9e2af">Manager</text>

      <!-- Arrow from ContextManager to VectorStore -->
      <line x1="175" y1="80" x2="175" y2="98" stroke="#f9e2af" stroke-width="1.5"/>
      <polygon points="175,103 171,96 179,96" fill="#f9e2af"/>

      <rect x="125" y="108" width="100" height="32" rx="4" fill="#45475a"/>
      <text x="175" y="128" text-anchor="middle" font-family="Arial" font-size="10" fill="#f38ba8">VectorStore</text>
    </g>

    <!-- Arrow down from bridge -->
    <line x1="135" y1="295" x2="135" y2="320" stroke="#89b4fa" stroke-width="2"/>
    <polygon points="135,325 130,318 140,318" fill="#89b4fa"/>

    <!-- Output -->
    <g transform="translate(75, 330)">
      <rect x="0" y="0" width="120" height="45" rx="6" fill="#45475a"/>
      <text x="60" y="20" text-anchor="middle" font-family="Arial" font-size="11" fill="#a6e3a1" font-weight="bold">Output</text>
      <text x="60" y="36" text-anchor="middle" font-family="monospace" font-size="10" fill="#a6adc8">O(k) tensor</text>
    </g>

    <!-- Right side: O(k) verification -->
    <g transform="translate(280, 55)">
      <rect x="0" y="0" width="220" height="260" rx="6" fill="#1e1e2e" stroke="#a6e3a1" stroke-width="2"/>
      <text x="110" y="24" text-anchor="middle" font-family="Arial" font-size="12" fill="#a6e3a1" font-weight="bold">O(k) Verified</text>

      <text x="20" y="55" font-family="monospace" font-size="11" fill="#cdd6f4">Context:    Time:</text>
      <text x="20" y="80" font-family="monospace" font-size="11" fill="#cdd6f4">  1000   →  11.82ms</text>
      <text x="20" y="105" font-family="monospace" font-size="11" fill="#cdd6f4">  2000   →  12.96ms</text>
      <text x="20" y="130" font-family="monospace" font-size="11" fill="#cdd6f4">  4000   →  12.61ms</text>

      <line x1="15" y1="150" x2="205" y2="150" stroke="#45475a"/>

      <text x="20" y="175" font-family="Arial" font-size="11" fill="#f38ba8">If O(n²):</text>
      <text x="20" y="198" font-family="monospace" font-size="11" fill="#f38ba8">  2x → 4x time  ✗</text>
      <text x="20" y="218" font-family="monospace" font-size="11" fill="#f38ba8">  4x → 16x time ✗</text>

      <text x="20" y="245" font-family="Arial" font-size="11" fill="#a6e3a1">Actual O(k):</text>
      <text x="20" y="268" font-family="monospace" font-size="11" fill="#a6e3a1">  2x → 1.1x time ✓</text>
    </g>
  </g>

