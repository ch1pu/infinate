    <g transform="translate(160, 105)">
      <rect x="0" y="0" width="130" height="50" rx="4" fill="#45475a"/>
      <text x="65" y="20" text-anchor="middle" font-family="Arial" font-size="10" fill="#cdd6f4">Benchmarks</text>
      <text x="65" y="38" text-anchor="middle" font-family="monospace" font-size="14" fill="#a6e3a1" font-weight="bold">6/6 ✓</text>
