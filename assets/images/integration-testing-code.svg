<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700">
  <defs>
    <linearGradient id="bgCodeIC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e"/>
      <stop offset="100%" style="stop-color:#181825"/>
    </linearGradient>
    <filter id="shadowCodeIC" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="4" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1100" height="700" fill="url(#bgCodeIC)"/>

  <!-- Title bar (window chrome) -->
  <rect x="0" y="0" width="1100" height="45" fill="#313244"/>
  <circle cx="22" cy="22" r="8" fill="#f38ba8"/>
  <circle cx="48" cy="22" r="8" fill="#f9e2af"/>
  <circle cx="74" cy="22" r="8" fill="#a6e3a1"/>
  <text x="550" y="28" text-anchor="middle" font-family="monospace" font-size="14" fill="#cdd6f4">transformer_bridge.py — TransformerBridge (M1.7 Integration)</text>

  <!-- LEFT PANEL: TransformerBridge Code -->
  <g transform="translate(20, 60)">
    <rect x="0" y="0" width="520" height="320" rx="8" fill="#313244" filter="url(#shadowCodeIC)"/>
    <text x="260" y="28" text-anchor="middle" font-family="monospace" font-size="13" fill="#89b4fa" font-weight="bold">TransformerBridge Class</text>

    <!-- Code lines -->
    <g transform="translate(18, 50)">
      <text font-family="monospace" font-size="12">
        <tspan x="0" y="0" fill="#89b4fa">class</tspan>
        <tspan fill="#f9e2af"> TransformerBridge</tspan>
        <tspan fill="#cdd6f4">(</tspan>
        <tspan fill="#89b4fa">nn.Module</tspan>
        <tspan fill="#cdd6f4">):</tspan>
      </text>
      <text font-family="monospace" font-size="11">
        <tspan x="0" y="22" fill="#6c7086">    """Bridge connecting Transformer to VectorStore."""</tspan>
      </text>
      <text font-family="monospace" font-size="12">
        <tspan x="0" y="48" fill="#89b4fa">    def</tspan>
        <tspan fill="#f9e2af"> __init__</tspan>
        <tspan fill="#cdd6f4">(</tspan>
        <tspan fill="#f38ba8">self</tspan>
        <tspan fill="#cdd6f4">,</tspan>
      </text>
      <text font-family="monospace" font-size="12">
        <tspan x="0" y="68" fill="#cdd6f4">        </tspan>
        <tspan fill="#f38ba8">transformer</tspan>
        <tspan fill="#cdd6f4">: </tspan>
        <tspan fill="#89b4fa">SpatialTransformer</tspan>
        <tspan fill="#cdd6f4">,</tspan>
      </text>
      <text font-family="monospace" font-size="12">
        <tspan x="0" y="88" fill="#cdd6f4">        </tspan>
        <tspan fill="#f38ba8">vector_store</tspan>
        <tspan fill="#cdd6f4">: </tspan>
        <tspan fill="#89b4fa">VectorStoreBase</tspan>
        <tspan fill="#cdd6f4">,</tspan>
      </text>
      <text font-family="monospace" font-size="12">
        <tspan x="0" y="108" fill="#cdd6f4">        </tspan>
        <tspan fill="#f38ba8">k_neighbors</tspan>
        <tspan fill="#cdd6f4">: </tspan>
        <tspan fill="#89b4fa">int</tspan>
        <tspan fill="#cdd6f4"> = </tspan>
        <tspan fill="#fab387">50</tspan>
        <tspan fill="#cdd6f4">):</tspan>
      </text>
      <text font-family="monospace" font-size="12">
        <tspan x="0" y="133" fill="#cdd6f4">        </tspan>
        <tspan fill="#f38ba8">self</tspan>
        <tspan fill="#cdd6f4">.transformer = transformer</tspan>
      </text>
      <text font-family="monospace" font-size="12">
        <tspan x="0" y="153" fill="#cdd6f4">        </tspan>
        <tspan fill="#f38ba8">self</tspan>
        <tspan fill="#cdd6f4">.context_manager = </tspan>
        <tspan fill="#f9e2af">ContextManager</tspan>
        <tspan fill="#cdd6f4">(...)</tspan>
      </text>
      <text font-family="monospace" font-size="12">
        <tspan x="0" y="183" fill="#89b4fa">    def</tspan>
        <tspan fill="#f9e2af"> forward</tspan>
        <tspan fill="#cdd6f4">(</tspan>
        <tspan fill="#f38ba8">self</tspan>
        <tspan fill="#cdd6f4">, </tspan>
        <tspan fill="#f38ba8">x</tspan>
        <tspan fill="#cdd6f4">, </tspan>
        <tspan fill="#f38ba8">positions</tspan>
        <tspan fill="#cdd6f4">):</tspan>
      </text>
      <text font-family="monospace" font-size="11">
        <tspan x="0" y="203" fill="#6c7086">        # Query vector store for context</tspan>
      </text>
      <text font-family="monospace" font-size="12">
        <tspan x="0" y="223" fill="#cdd6f4">        ctx = </tspan>
        <tspan fill="#f38ba8">self</tspan>
        <tspan fill="#cdd6f4">.context_manager.</tspan>
        <tspan fill="#f9e2af">retrieve</tspan>
        <tspan fill="#cdd6f4">(...)</tspan>
      </text>
      <text font-family="monospace" font-size="11">
        <tspan x="0" y="243" fill="#6c7086">        # Forward through transformer</tspan>
      </text>
      <text font-family="monospace" font-size="12">
        <tspan x="0" y="263" fill="#cdd6f4">        </tspan>
        <tspan fill="#89b4fa">return</tspan>
        <tspan fill="#cdd6f4"> </tspan>
        <tspan fill="#f38ba8">self</tspan>
        <tspan fill="#cdd6f4">.transformer(x, positions)</tspan>
      </text>
    </g>
  </g>

  <!-- LEFT PANEL 2: ContextManager Code -->
  <g transform="translate(20, 400)">
    <rect x="0" y="0" width="520" height="220" rx="8" fill="#313244" filter="url(#shadowCodeIC)"/>
    <text x="260" y="28" text-anchor="middle" font-family="monospace" font-size="13" fill="#89b4fa" font-weight="bold">ContextManager Class</text>

    <g transform="translate(18, 50)">
      <text font-family="monospace" font-size="12">
        <tspan x="0" y="0" fill="#89b4fa">class</tspan>
        <tspan fill="#f9e2af"> ContextManager</tspan>
        <tspan fill="#cdd6f4">:</tspan>
      </text>
      <text font-family="monospace" font-size="11">
        <tspan x="0" y="22" fill="#6c7086">    """LRU cache + query manager."""</tspan>
      </text>
      <text font-family="monospace" font-size="12">
        <tspan x="0" y="48" fill="#89b4fa">    def</tspan>
        <tspan fill="#f9e2af"> retrieve_context</tspan>
        <tspan fill="#cdd6f4">(</tspan>
        <tspan fill="#f38ba8">self</tspan>
        <tspan fill="#cdd6f4">,</tspan>
      </text>
      <text font-family="monospace" font-size="12">
        <tspan x="0" y="68" fill="#cdd6f4">            </tspan>
        <tspan fill="#f38ba8">query_vector</tspan>
        <tspan fill="#cdd6f4">,</tspan>
        <tspan fill="#f38ba8"> query_position</tspan>
        <tspan fill="#cdd6f4">,</tspan>
        <tspan fill="#f38ba8"> k</tspan>
        <tspan fill="#cdd6f4">=</tspan>
        <tspan fill="#fab387">50</tspan>
        <tspan fill="#cdd6f4">):</tspan>
      </text>
      <text font-family="monospace" font-size="11">
        <tspan x="0" y="93" fill="#6c7086">        # Check cache first (LRU)</tspan>
      </text>
      <text font-family="monospace" font-size="12">
        <tspan x="0" y="113" fill="#89b4fa">        if</tspan>
        <tspan fill="#cdd6f4"> key </tspan>
        <tspan fill="#89b4fa">in</tspan>
        <tspan fill="#f38ba8"> self</tspan>
        <tspan fill="#cdd6f4">._cache: </tspan>
        <tspan fill="#89b4fa">return</tspan>
        <tspan fill="#cdd6f4"> cached</tspan>
      </text>
      <text font-family="monospace" font-size="11">
        <tspan x="0" y="138" fill="#6c7086">        # Query vector store (Qdrant/pgvector)</tspan>
      </text>
      <text font-family="monospace" font-size="12">
        <tspan x="0" y="158" fill="#cdd6f4">        </tspan>
        <tspan fill="#89b4fa">return</tspan>
        <tspan fill="#f38ba8"> self</tspan>
        <tspan fill="#cdd6f4">.vector_store.</tspan>
        <tspan fill="#f9e2af">query</tspan>
        <tspan fill="#cdd6f4">(...)</tspan>
      </text>
    </g>
  </g>

