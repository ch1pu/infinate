<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600">
  <defs>
    <linearGradient id="bgCodeIC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e"/>
      <stop offset="100%" style="stop-color:#181825"/>
    </linearGradient>
    <filter id="shadowCodeIC" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="4" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1000" height="600" fill="url(#bgCodeIC)"/>

  <!-- Title bar (window chrome) -->
  <rect x="0" y="0" width="1000" height="40" fill="#313244"/>
  <circle cx="20" cy="20" r="7" fill="#f38ba8"/>
  <circle cx="44" cy="20" r="7" fill="#f9e2af"/>
  <circle cx="68" cy="20" r="7" fill="#a6e3a1"/>
  <text x="500" y="26" text-anchor="middle" font-family="monospace" font-size="13" fill="#cdd6f4">transformer_bridge.py — TransformerBridge (M1.7 Integration)</text>

  <!-- LEFT PANEL: TransformerBridge Code -->
  <g transform="translate(20, 55)">
    <rect x="0" y="0" width="480" height="290" rx="8" fill="#313244" filter="url(#shadowCodeIC)"/>
    <text x="240" y="25" text-anchor="middle" font-family="monospace" font-size="12" fill="#89b4fa" font-weight="bold">TransformerBridge Class</text>

    <!-- Code lines -->
    <g transform="translate(15, 45)">
      <text font-family="monospace" font-size="11">
        <tspan x="0" y="0" fill="#89b4fa">class</tspan>
        <tspan fill="#f9e2af"> TransformerBridge</tspan>
        <tspan fill="#cdd6f4">(</tspan>
        <tspan fill="#89b4fa">nn.Module</tspan>
        <tspan fill="#cdd6f4">):</tspan>
      </text>
      <text font-family="monospace" font-size="11">
        <tspan x="0" y="18" fill="#6c7086">    """Bridge connecting Transformer to VectorStore."""</tspan>
      </text>
      <text font-family="monospace" font-size="11">
        <tspan x="0" y="40" fill="#89b4fa">    def</tspan>
        <tspan fill="#f9e2af"> __init__</tspan>
        <tspan fill="#cdd6f4">(</tspan>
        <tspan fill="#f38ba8">self</tspan>
        <tspan fill="#cdd6f4">,</tspan>
      </text>
      <text font-family="monospace" font-size="11">
        <tspan x="0" y="55" fill="#cdd6f4">        </tspan>
        <tspan fill="#f38ba8">transformer</tspan>
        <tspan fill="#cdd6f4">: </tspan>
        <tspan fill="#89b4fa">SpatialTransformer</tspan>
        <tspan fill="#cdd6f4">,</tspan>
      </text>
      <text font-family="monospace" font-size="11">
        <tspan x="0" y="70" fill="#cdd6f4">        </tspan>
        <tspan fill="#f38ba8">vector_store</tspan>
        <tspan fill="#cdd6f4">: </tspan>
        <tspan fill="#89b4fa">VectorStoreBase</tspan>
        <tspan fill="#cdd6f4">,</tspan>
      </text>
      <text font-family="monospace" font-size="11">
        <tspan x="0" y="85" fill="#cdd6f4">        </tspan>
        <tspan fill="#f38ba8">k_neighbors</tspan>
        <tspan fill="#cdd6f4">: </tspan>
        <tspan fill="#89b4fa">int</tspan>
        <tspan fill="#cdd6f4"> = </tspan>
        <tspan fill="#fab387">50</tspan>
        <tspan fill="#cdd6f4">):</tspan>
      </text>
      <text font-family="monospace" font-size="11">
        <tspan x="0" y="105" fill="#cdd6f4">        </tspan>
        <tspan fill="#f38ba8">self</tspan>
        <tspan fill="#cdd6f4">.</tspan>
        <tspan fill="#cdd6f4">transformer = transformer</tspan>
      </text>
      <text font-family="monospace" font-size="11">
        <tspan x="0" y="120" fill="#cdd6f4">        </tspan>
        <tspan fill="#f38ba8">self</tspan>
        <tspan fill="#cdd6f4">.context_manager = </tspan>
        <tspan fill="#f9e2af">ContextManager</tspan>
        <tspan fill="#cdd6f4">(...)</tspan>
      </text>
      <text font-family="monospace" font-size="11">
        <tspan x="0" y="145" fill="#89b4fa">    def</tspan>
        <tspan fill="#f9e2af"> forward</tspan>
        <tspan fill="#cdd6f4">(</tspan>
        <tspan fill="#f38ba8">self</tspan>
        <tspan fill="#cdd6f4">, </tspan>
        <tspan fill="#f38ba8">x</tspan>
        <tspan fill="#cdd6f4">, </tspan>
        <tspan fill="#f38ba8">positions</tspan>
        <tspan fill="#cdd6f4">):</tspan>
      </text>
      <text font-family="monospace" font-size="11">
        <tspan x="0" y="160" fill="#6c7086">        # Query vector store for context</tspan>
      </text>
      <text font-family="monospace" font-size="11">
        <tspan x="0" y="175" fill="#cdd6f4">        ctx = </tspan>
        <tspan fill="#f38ba8">self</tspan>
        <tspan fill="#cdd6f4">.context_manager.</tspan>
        <tspan fill="#f9e2af">retrieve_context</tspan>
        <tspan fill="#cdd6f4">(...)</tspan>
      </text>
      <text font-family="monospace" font-size="11">
        <tspan x="0" y="195" fill="#6c7086">        # Forward through transformer</tspan>
      </text>
      <text font-family="monospace" font-size="11">
        <tspan x="0" y="210" fill="#cdd6f4">        </tspan>
        <tspan fill="#89b4fa">return</tspan>
        <tspan fill="#cdd6f4"> </tspan>
        <tspan fill="#f38ba8">self</tspan>
        <tspan fill="#cdd6f4">.transformer(x, positions)</tspan>
      </text>
    </g>
  </g>

  <!-- LEFT PANEL 2: ContextManager Code -->
  <g transform="translate(20, 360)">
    <rect x="0" y="0" width="480" height="180" rx="8" fill="#313244" filter="url(#shadowCodeIC)"/>
    <text x="240" y="25" text-anchor="middle" font-family="monospace" font-size="12" fill="#89b4fa" font-weight="bold">ContextManager Class</text>

    <g transform="translate(15, 45)">
      <text font-family="monospace" font-size="11">
        <tspan x="0" y="0" fill="#89b4fa">class</tspan>
        <tspan fill="#f9e2af"> ContextManager</tspan>
        <tspan fill="#cdd6f4">:</tspan>
      </text>
      <text font-family="monospace" font-size="11">
        <tspan x="0" y="18" fill="#6c7086">    """LRU cache + query manager."""</tspan>
      </text>
      <text font-family="monospace" font-size="11">
        <tspan x="0" y="40" fill="#89b4fa">    def</tspan>
        <tspan fill="#f9e2af"> retrieve_context</tspan>
        <tspan fill="#cdd6f4">(</tspan>
        <tspan fill="#f38ba8">self</tspan>
        <tspan fill="#cdd6f4">, </tspan>
        <tspan fill="#f38ba8">query_vector</tspan>
        <tspan fill="#cdd6f4">,</tspan>
      </text>
      <text font-family="monospace" font-size="11">
        <tspan x="0" y="55" fill="#cdd6f4">                       </tspan>
        <tspan fill="#f38ba8">query_position</tspan>
        <tspan fill="#cdd6f4">, </tspan>
        <tspan fill="#f38ba8">k</tspan>
        <tspan fill="#cdd6f4">=</tspan>
        <tspan fill="#fab387">50</tspan>
        <tspan fill="#cdd6f4">):</tspan>
      </text>
      <text font-family="monospace" font-size="11">
        <tspan x="0" y="75" fill="#6c7086">        # Check cache first (LRU)</tspan>
      </text>
      <text font-family="monospace" font-size="11">
        <tspan x="0" y="90" fill="#89b4fa">        if</tspan>
        <tspan fill="#cdd6f4"> key </tspan>
        <tspan fill="#89b4fa">in</tspan>
        <tspan fill="#f38ba8"> self</tspan>
        <tspan fill="#cdd6f4">._cache: </tspan>
        <tspan fill="#89b4fa">return</tspan>
        <tspan fill="#cdd6f4"> cached</tspan>
      </text>
      <text font-family="monospace" font-size="11">
        <tspan x="0" y="110" fill="#6c7086">        # Query vector store (Qdrant/pgvector)</tspan>
      </text>
      <text font-family="monospace" font-size="11">
        <tspan x="0" y="125" fill="#cdd6f4">        </tspan>
        <tspan fill="#89b4fa">return</tspan>
        <tspan fill="#f38ba8"> self</tspan>
        <tspan fill="#cdd6f4">.vector_store.</tspan>
        <tspan fill="#f9e2af">query</tspan>
        <tspan fill="#cdd6f4">(...)</tspan>
      </text>
    </g>
  </g>

