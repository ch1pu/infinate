<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320">
  <defs>
    <linearGradient id="bgQuery" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#faf5ff"/>
      <stop offset="100%" style="stop-color:#f3e8ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="320" fill="url(#bgQuery)"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial" font-size="16" fill="#581c87" font-weight="bold">Query Radius: Only Check Nearby Tokens</text>

  <!-- Main visualization area -->
  <g transform="translate(150, 50)">

    <!-- Search radius circle -->
    <circle cx="300" cy="130" r="120" fill="#7c3aed" opacity="0.08"/>
    <circle cx="300" cy="130" r="120" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="8,4" opacity="0.5"/>
    <text x="300" y="265" text-anchor="middle" font-family="Arial" font-size="11" fill="#7c3aed">Search Radius (k neighbors)</text>

    <!-- Query in center -->
    <circle cx="300" cy="130" r="40" fill="#7c3aed" filter="url(#glow)"/>
    <text x="300" y="125" text-anchor="middle" font-family="Arial" font-size="11" fill="white" font-weight="bold">Query:</text>
    <text x="300" y="140" text-anchor="middle" font-family="Arial" font-size="10" fill="white">"machine</text>
    <text x="300" y="152" text-anchor="middle" font-family="Arial" font-size="10" fill="white">learning"</text>

    <!-- NEARBY tokens (inside radius) - green checkmarks -->
    <g>
      <!-- Neural Networks -->
      <circle cx="220" cy="80" r="32" fill="#10b981" filter="url(#shadow)"/>
      <text x="220" y="75" text-anchor="middle" font-family="Arial" font-size="8" fill="white" font-weight="bold">neural</text>
      <text x="220" y="87" text-anchor="middle" font-family="Arial" font-size="8" fill="white" font-weight="bold">networks</text>
      <line x1="255" y1="95" x2="270" y2="110" stroke="#10b981" stroke-width="3"/>
      <circle cx="250" cy="65" r="12" fill="#22c55e"/>
      <text x="250" y="70" text-anchor="middle" font-family="Arial" font-size="14" fill="white">✓</text>

      <!-- Deep Learning -->
      <circle cx="380" cy="70" r="30" fill="#10b981" filter="url(#shadow)"/>
      <text x="380" y="65" text-anchor="middle" font-family="Arial" font-size="8" fill="white" font-weight="bold">deep</text>
      <text x="380" y="77" text-anchor="middle" font-family="Arial" font-size="8" fill="white" font-weight="bold">learning</text>
      <line x1="355" y1="90" x2="335" y2="105" stroke="#10b981" stroke-width="3"/>
      <circle cx="395" cy="50" r="12" fill="#22c55e"/>
      <text x="395" y="55" text-anchor="middle" font-family="Arial" font-size="14" fill="white">✓</text>

      <!-- PyTorch -->
      <circle cx="230" cy="180" r="28" fill="#10b981" filter="url(#shadow)"/>
      <text x="230" y="185" text-anchor="middle" font-family="Arial" font-size="9" fill="white" font-weight="bold">PyTorch</text>
      <line x1="255" y1="165" x2="270" y2="150" stroke="#10b981" stroke-width="3"/>
      <circle cx="215" cy="200" r="12" fill="#22c55e"/>
      <text x="215" y="205" text-anchor="middle" font-family="Arial" font-size="14" fill="white">✓</text>

      <!-- TensorFlow -->
      <circle cx="380" cy="185" r="30" fill="#10b981" filter="url(#shadow)"/>
      <text x="380" y="182" text-anchor="middle" font-family="Arial" font-size="8" fill="white" font-weight="bold">Tensor</text>
      <text x="380" y="193" text-anchor="middle" font-family="Arial" font-size="8" fill="white" font-weight="bold">Flow</text>
      <line x1="355" y1="170" x2="335" y2="155" stroke="#10b981" stroke-width="3"/>
      <circle cx="400" cy="205" r="12" fill="#22c55e"/>
      <text x="400" y="210" text-anchor="middle" font-family="Arial" font-size="14" fill="white">✓</text>
    </g>

    <!-- FAR tokens (outside radius) - red X, faded -->
    <g opacity="0.5">
      <!-- Cooking -->
      <circle cx="50" cy="100" r="28" fill="#94a3b8" filter="url(#shadow)"/>
      <text x="50" y="97" text-anchor="middle" font-family="Arial" font-size="8" fill="white" font-weight="bold">cooking</text>
      <text x="50" y="108" text-anchor="middle" font-family="Arial" font-size="8" fill="white" font-weight="bold">recipes</text>
      <circle cx="70" cy="75" r="12" fill="#ef4444"/>
      <text x="70" y="80" text-anchor="middle" font-family="Arial" font-size="14" fill="white">✗</text>

      <!-- JavaScript -->
      <circle cx="520" cy="80" r="28" fill="#94a3b8" filter="url(#shadow)"/>
      <text x="520" y="77" text-anchor="middle" font-family="Arial" font-size="7" fill="white" font-weight="bold">JavaScript</text>
      <text x="520" y="88" text-anchor="middle" font-family="Arial" font-size="7" fill="white" font-weight="bold">basics</text>
      <circle cx="540" cy="60" r="12" fill="#ef4444"/>
      <text x="540" y="65" text-anchor="middle" font-family="Arial" font-size="14" fill="white">✗</text>

      <!-- Sports -->
      <circle cx="80" cy="200" r="25" fill="#94a3b8" filter="url(#shadow)"/>
      <text x="80" y="205" text-anchor="middle" font-family="Arial" font-size="9" fill="white" font-weight="bold">sports</text>
      <circle cx="55" cy="185" r="12" fill="#ef4444"/>
      <text x="55" y="190" text-anchor="middle" font-family="Arial" font-size="14" fill="white">✗</text>

      <!-- Weather -->
      <circle cx="530" cy="190" r="25" fill="#94a3b8" filter="url(#shadow)"/>
      <text x="530" y="195" text-anchor="middle" font-family="Arial" font-size="9" fill="white" font-weight="bold">weather</text>
      <circle cx="550" cy="170" r="12" fill="#ef4444"/>
      <text x="550" y="175" text-anchor="middle" font-family="Arial" font-size="14" fill="white">✗</text>
    </g>
  </g>

  <!-- Legend -->
  <g transform="translate(620, 80)">
    <rect x="0" y="0" width="150" height="130" rx="8" fill="white" filter="url(#shadow)"/>
    <text x="75" y="22" text-anchor="middle" font-family="Arial" font-size="11" fill="#334155" font-weight="bold">Result</text>

    <circle cx="25" cy="50" r="10" fill="#22c55e"/>
    <text x="25" y="55" text-anchor="middle" font-family="Arial" font-size="12" fill="white">✓</text>
    <text x="85" y="55" text-anchor="middle" font-family="Arial" font-size="10" fill="#166534">Retrieved</text>

    <circle cx="25" cy="85" r="10" fill="#ef4444"/>
    <text x="25" y="90" text-anchor="middle" font-family="Arial" font-size="12" fill="white">✗</text>
    <text x="85" y="90" text-anchor="middle" font-family="Arial" font-size="10" fill="#991b1b">Ignored</text>

    <text x="75" y="115" text-anchor="middle" font-family="Arial" font-size="9" fill="#64748b">O(k) not O(n)</text>
  </g>
</svg>