[tool.poetry]
name = "spatial-engine"
version = "0.1.0"
description = "Spatial AI Engine with O(k) Constant Complexity for Unlimited Context"
authors = ["Infinite Project Team"]
readme = "README.md"
license = "Apache-2.0"

[tool.poetry.dependencies]
python = "^3.11"
torch = "^2.1.0"
numpy = "^1.26.0"
pydantic = "^2.5.0"
python-dotenv = "^0.21.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-asyncio = "^0.21.0"
pytest-benchmark = "^4.0.0"
pytest-watch = "^4.2.0"
black = "^23.12.0"
ruff = "^0.1.8"
mypy = "^1.7.0"
ipython = "^8.18.0"
ipdb = "^0.13.13"
pre-commit = "^3.5.0"

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | \.mypy_cache
  | \.pytest_cache
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"

# Enable rule sets
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "N",    # pep8-naming
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade (use modern Python)
    "B",    # flake8-bugbear (find bugs)
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "NPY",  # NumPy-specific rules
]

# Ignore specific rules
ignore = [
    "E501",  # Line too long (handled by black)
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"tests/*" = ["S101"]      # Allow assert in tests

[tool.ruff.isort]
known-first-party = ["spatial_engine"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["spatial_engine"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-v",
    "--strict-markers",
    "--cov=spatial_engine",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]
markers = [
    "unit: Unit tests (fast, no I/O)",
    "integration: Integration tests (database, API)",
    "slow: Slow tests (model training)",
    "gpu: Tests requiring GPU",
    "npu: Tests requiring NPU",
    "benchmark: Performance benchmark tests",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
