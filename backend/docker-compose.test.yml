version: '3.8'

services:
  postgres-test:
    image: pgvector/pgvector:pg15
    container_name: infinate_postgres_test
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test_spatial
    ports:
      - "5433:5432"  # Use port 5433 to avoid conflict with existing postgres on 5432
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_test_data:
